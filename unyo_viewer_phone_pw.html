<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
  <title>東急線 運用ビューワー（Mobile完全互換版）</title>
  <style>
    :root { 
      --toyoko: #d90240; --meguro: #009cd3; --dento: #01aa8f; 
      --oimachi: #f08d41; --shinyoko: #890d84; --ikegami: #ed85a7; --tamagawa: #ad0277; --extra: #607d8b; 
      --bg-color: #eef1f5; --text-color: #333; --border-color: #ddd;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: "Helvetica Neue", Arial, sans-serif; margin: 0; background: var(--bg-color); font-size: 13px; color: var(--text-color); -webkit-text-size-adjust: 100%; overflow-x: hidden; }
    
    #sticky-header { position: sticky; top: 0; z-index: 1000; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.1); border-top: 4px solid #1976d2; width: 100%; }
    .header-top { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; flex-wrap: nowrap; overflow: hidden; gap: 10px; }
    h1 { margin: 0; font-size: 16px; color: #222; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; flex-wrap: nowrap; }
    
    .btn-action { background: #333; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: bold; white-space: nowrap; flex-shrink: 0; transition: 0.2s; }
    .btn-action:hover { opacity: 0.8; }
    .btn-export { background: #1976d2; }
    .btn-sync { background: #ff9800; color: #fff; }
    .btn-reset { background: #c62828; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: bold; }
    
    #cloudStatus { font-family: monospace; font-size: 11px; color: #01aa8f; font-weight: bold; background: #e8f5e9; padding: 6px 8px; border-radius: 4px; text-align: center; white-space: nowrap; flex-shrink: 0; min-width: 140px; }

    #noticeBar { background: #ffebee; color: #d32f2f; padding: 12px 20px; font-size: 16px; font-weight: bold; border-bottom: 1px solid #ffcdd2; overflow: hidden; display: none; letter-spacing: 1px; }
    .marquee-container { width: 100%; overflow: hidden; white-space: nowrap; box-sizing: border-box; }
    .marquee-content { display: inline-block; padding-left: 100%; animation: marquee 20s linear infinite; }
    @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

    .tab-area { display: flex; gap: 8px; overflow-x: auto; padding: 10px 15px; -webkit-overflow-scrolling: touch; scrollbar-width: none; border-bottom: 1px solid var(--border-color); background: #fff; }
    .tab-area::-webkit-scrollbar { display: none; }
    .tab { flex: 0 0 auto; padding: 8px 16px; cursor: pointer; border: 1px solid #ccc; background: #f5f5f5; border-radius: 20px; font-size: 13px; font-weight: bold; transition: 0.2s; }
    .tab.active { background: #333; color: #fff; border-color: #333; }
    .tab-daily { background: #e8f5e9; border-color: #a5d6a7; color: #2e7d32; }
    .tab-import { background: #fff3e0; border-color: #ffcc80; color: #ef6c00; }
    .tab-custom { background: #e1bee7; border-color: #f48fb1; color: #880e4f; }
    .tab-custom.active, .tab-daily.active, .tab-import.active { background: #333; color: #fff; border-color: #333; }

    .filter-select { padding: 6px 8px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; font-weight: bold; min-width: 100px; max-width: 140px; }
    
    #container { padding: 15px; max-width: 1200px; margin: 0 auto; width: 100%; padding-bottom: 90px; }
    .line-section { margin-bottom: 25px; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow: hidden; border: 1px solid var(--border-color); }
    .line-header { padding: 10px 15px; font-size: 15px; font-weight: bold; color: #fff; letter-spacing: 1px; }
    .line-body { padding: 10px; }
    
    .bg-toyoko { background: var(--toyoko); } .bg-meguro { background: var(--meguro); } .bg-dento { background: var(--dento); }
    .bg-oimachi { background: var(--oimachi); } .bg-shinyoko { background: var(--shinyoko); } .bg-ikegami { background: var(--ikegami); } .bg-tamagawa { background: var(--tamagawa); } .bg-extra { background: var(--extra); }

    .op-box { display: flex; align-items: stretch; border: 1px solid #e0e0e0; border-radius: 6px; margin-bottom: 10px; overflow: hidden; }
    .op-left { width: 85px; background: #f8f9fa; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; flex-shrink: 0; }
    .op-no { font-weight: bold; font-family: monospace; font-size: 18px; color: #d32f2f; text-align: center; }
    .src-tag { font-size: 10px; background: #ddd; padding: 2px 4px; border-radius: 4px; color: #555; margin-top: 6px; text-align: center; line-height: 1.2; word-break: break-all;}
    
    .op-right { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #fff; }
    
    .train-row { display: flex; align-items: center; padding: 10px 12px; border-bottom: 1px solid #f0f0f0; width: 100%; gap: 10px; transition: background 0.2s; flex-wrap: nowrap; overflow: hidden; }
    .train-row:last-child { border-bottom: none; }
    .row-active { background: #fffde7; }
    .row-sync-wait { background: #f5f5f5; border-left: 4px solid #9e9e9e; }

    .t-basic { display: flex; align-items: center; flex-shrink: 0; width: 250px; gap: 8px; white-space: nowrap; }
    .t-tr { width: 65px; flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; }
    .t-tr-no { font-family: monospace; color: #1976d2; font-weight: bold; font-size: 14px; line-height: 1.2; }
    .t-tr-sub { font-size: 10px; color: #666; margin-top: 2px; }
    .t-tr-form { font-size: 11px; color: #4886a5; font-weight: bold; margin-top: 2px; display: inline-block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
    
    /* ★ 目黒線・南北線・8両用の専用スタイル（エメラルドグリーンの太い下線） */
    .cars8-minami-badge { 
        text-decoration: underline;
        text-decoration-color: #00ada9;
        text-decoration-thickness: 5px;
        text-underline-offset: 2px;
    }
    
    .t-dest { flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; overflow: hidden; }
    .t-dest-text { font-size: 14px; font-weight: bold; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
    .t-delay { color: #d32f2f; font-size: 11px; font-weight: bold; background: #ffebee; padding: 2px 6px; border-radius: 4px; display: inline-block; width: max-content; border: 1px solid #ffcdd2; margin-top: 2px; }
    
    .t-pos { width: 140px; font-size: 13px; color: #222; flex-shrink: 0; padding-right: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-right: 1px dashed #eee; }
    .t-pos strong { color: #1976d2; margin-right: 4px; }
    
    .t-hist { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; display: flex; align-items: center; padding-bottom: 6px; -webkit-overflow-scrolling: touch; }
    .t-hist::-webkit-scrollbar { height: 6px; display: block; }
    .t-hist::-webkit-scrollbar-track { background: transparent; }
    .t-hist::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
    
    /* 矢印(▶)を疑似要素にしてDOM数を削減 */
    .hist-item { background: #f5f5f5; padding: 4px 8px; border-radius: 4px; font-size: 11px; white-space: nowrap; border-bottom: 2px solid #ccc; display: inline-flex; align-items: center; gap: 4px; position: relative; margin-right: 14px; cursor: pointer; }
    .hist-item::after { content: '▶'; position: absolute; right: -12px; color: #aaa; font-size: 9px; top: 50%; transform: translateY(-50%); }
    .hist-item:last-child::after { content: ''; }
    
    .hist-item.is-ekikan { background: transparent; border: none; color: #888; font-size: 10px; padding: 2px 4px; }
.hist-item strong { color: #444; }
    .tentative-mark { color: #d32f2f; font-weight: bold; font-size: 11px; margin-left: 1px; }

    .kind-badge { display: inline-block; min-width: 44px; padding: 3px 4px; border-radius: 3px; font-size: 11px; font-weight: bold; color: #fff; margin-right: 4px; text-align: center; box-sizing: border-box; line-height: 1; flex-shrink:0; }
    .kind-各停, .kind-B { background: #1976d2; } .kind-G, .kind-準急 { background: #4caf50; } 
    .kind-急行 { background: #d90240; } .kind-特急, .kind-F { background: #ff9800; } 
    .kind-通特 { background: #fff; border: 1px solid #d90240; color: #d90240; padding: 1px 0;} 
    .kind-Sトレイン { background: #fff; color: #009688; border: 1px solid #009688; } .kind-回送 { background: #757575; }

    @media (max-width: 800px) {
      .header-top { padding: 8px 10px; gap: 5px; flex-wrap: wrap; }
      h1 { font-size: 15px; }
      .btn-action { padding: 5px 8px; font-size: 11px; }
      #cloudStatus { width: auto; font-size: 10px; padding: 5px 4px; }
      .tab-area { padding: 8px 10px 5px 10px; }
      .filter-select { font-size: 12px; padding: 5px 6px; }
      .op-box { flex-direction: column; }
      .op-left { width: 100%; flex-direction: row; justify-content: flex-start; gap: 15px; border-right: none; border-bottom: 1px solid #e0e0e0; padding: 8px 15px; box-sizing: border-box; align-items: center; }
      .op-no { font-size: 16px; margin: 0; }
      .src-tag { margin-top: 0; font-size: 11px; margin-left: auto; }
      .train-row { flex-direction: column; align-items: stretch; gap: 8px; padding: 12px; }
      .t-basic { width: 100%; border-bottom: 1px dashed #eee; padding-bottom: 8px; margin-bottom: 0; }
      .t-dest-text { font-size: 15px; white-space: normal; line-height: 1.3; }
      .t-pos { width: 100%; margin-top: 2px; font-size: 13px; color: #333; border-right: none; padding-right: 0; }
      .t-hist { width: 100%; padding-bottom: 8px; overflow-x: auto; white-space: nowrap; }
      .t-hist::-webkit-scrollbar { display: none; } 
    }

    /* --- FAB（浮遊フィルターボタン） --- */
    .fab { position: fixed; bottom: 20px; right: 20px; background: #1976d2; color: #fff; width: 56px; height: 56px; border-radius: 28px; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 1500; cursor: pointer; border: none; font-size: 24px; }
    .fab:active { background: #115293; transform: scale(0.95); }

    /* --- モーダル全般 --- */
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:9999; justify-content:center; align-items:center; padding:0; }
    .tt-modal-header { background: #1976d2; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;}
    .tt-modal-header h3 { margin: 0; font-size: 16px; color: #fff; font-weight: bold; letter-spacing: 1px; }
    .tt-modal-header .btn-close { background: rgba(255,255,255,0.2); color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; }

    /* --- フィルターモーダル --- */
    .filter-modal-box { background:#fff; width:100%; height:85vh; margin-top:auto; border-radius:12px 12px 0 0; display:flex; flex-direction:column; box-shadow:0 -10px 40px rgba(0,0,0,0.3); }
    .fm-item { display:flex; flex-direction:column; gap:6px; margin-bottom: 12px;}
    .fm-item label { font-weight:bold; font-size:12px; color:#555; }
    .fm-item select, .fm-item input { padding:10px; font-size:14px; border:1px solid #ccc; border-radius:6px; background:#f9f9f9; font-weight: bold; color: #333; }
    .fm-toggle-row { display:flex; align-items:center; gap:8px; padding:12px; border-radius:6px; font-weight:bold; font-size:14px; color:#333; cursor:pointer; }
    .fm-toggle-row input { transform: scale(1.2); }

    /* --- 時刻表モーダル --- */
    .modal-box { background:#fff; padding:0; border-radius:10px; width:95%; max-width:550px; height:85vh; display:flex; flex-direction:column; box-shadow:0 10px 40px rgba(0,0,0,0.3); overflow:hidden; }
    .tt-controls-area { background: #f8f9fa; padding: 10px 15px; border-bottom: 1px solid #e0e0e0; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;}
    .tt-main-wrapper { display: flex; flex: 1; overflow: hidden; position: relative; }
    .modal-content { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; background:#fafafa; padding-bottom: 30px; margin:0; }
    
    .tt-index-bar { width: 30px; background: #fff; border-left: 1px solid #eee; display: flex; flex-direction: column; z-index: 10; overflow-y: auto; scrollbar-width: none; flex-shrink: 0; }
    .tt-index-bar::-webkit-scrollbar { display: none; }
    .tt-index-btn { flex: 1; min-height: 20px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #777; cursor: pointer; user-select: none; border-bottom: 1px solid #f5f5f5;}
    .tt-index-btn:active { background: #e3f2fd; color: #1976d2; }

    .tt-row { display:flex; padding:12px 10px; border-bottom:1px solid #eee; cursor:pointer; align-items:center; gap:10px; transition:0.2s; background:#fff; }
    .tt-row.is-active { background:#fffde7; border-left:5px solid #fbc02d; }
    .tt-row.is-pass { background:#fdfdfd; }
    .tt-row.is-pass .tt-time { color:#aaa; font-size:15px; }
    .tt-row.is-pass .dest-text { color:#888; }
    
    .tt-time-area { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 55px; flex-shrink: 0; gap: 4px; }
    .tt-time { font-weight:bold; font-size:17px; color:#1976d2; font-family: monospace; letter-spacing: -0.5px; line-height: 1; text-align: center; }
    
    .tt-dir-badge { font-size: 10px; font-weight: bold; border-radius: 3px; padding: 2px 4px; line-height: 1; white-space: nowrap; }
    .tt-dir-up { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
    .tt-dir-down { background: #e3f2fd; color: #1565c0; border: 1px solid #bbdefb; }

    .tt-info { flex:1; display:flex; flex-direction:column; min-width: 0; }
    .dest-text { color: #111; font-size: 14px; font-weight: bold; white-space: nowrap; }
    
    .extra-badge { font-size:10px; background:#9c27b0; color:#fff; padding:2px 4px; border-radius:3px; font-weight:bold; }
    .terminal-badge { font-size:10px; background:#d32f2f; color:#fff; padding:2px 4px; border-radius:3px; font-weight:bold; }
    .active-badge { font-size:10px; background:#fbc02d; color:#333; padding:2px 5px; border-radius:3px; font-weight:bold; margin-left:auto; }
    .pass-badge { font-size:10px; background:#eee; color:#777; padding:2px 4px; border-radius:3px; border:1px solid #ccc; font-weight:bold; }
    
    .highlight-flash { animation: flash-bg 2.5s ease-out; }
    @keyframes flash-bg { 0% { background-color: #ffeb3b; } 100% { background-color: transparent; } }

    .tt-tab-group { display: flex; gap: 6px; flex-wrap: wrap; }
    .tt-tab-btn { border: 1px solid #ccc; background: #fff; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-weight: bold; color: #555; transition: 0.2s; font-size: 12px; }
    .tt-tab-btn.active { background: #333; color: #fff; border-color: #333; }
  </style>
</head>
<body>

<div id="sticky-header">
  <div class="header-top">
    <h1>東急線 運用ビューワー</h1>
    <div class="header-right">
      <button class="btn-action" onclick="location.href='index.html'+location.search">路線図</button>
      <button class="btn-action btn-sync" onclick="forceSync()">🔄 強制同期</button>
      <div id="cloudStatus">☁️ 待機中</div>
    </div>
  </div>

  <div id="noticeBar"><div class="marquee-container"><div class="marquee-content" id="noticeText"></div></div></div>

  <div class="tab-area" id="tabArea">
    <button id="tab_weekday" class="tab" onclick="window.changeTab('weekday')" style="display:none;">平日累計</button>
    <button id="tab_holiday" class="tab" onclick="window.changeTab('holiday')" style="display:none;">土休累計</button>
    <button id="tab_daily" class="tab tab-daily" onclick="window.changeTab('daily')" style="display:none;">毎日記録</button>
    <button id="tab_import1" class="tab tab-import" onclick="window.changeTab('import1')">読込1</button>
    <button id="tab_import2" class="tab tab-import" onclick="window.changeTab('import2')">読込2</button>
    <button id="tab_import3" class="tab tab-import" onclick="window.changeTab('import3')">読込3</button>
  </div>
</div>

<div id="container"></div>

<button class="fab" onclick="document.getElementById('filterModal').style.display='flex'">
  <svg viewBox="0 0 24 24" width="28" height="28" fill="white"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg>
</button>

<div id="filterModal" class="modal-overlay" onclick="if(event.target===this) this.style.display='none'">
  <div class="filter-modal-box" style="max-width: 600px; margin: auto auto 0 auto;">
    <div class="tt-modal-header">
      <h3 style="margin:0;">詳細フィルター</h3>
      <button class="btn-close" style="background:transparent; font-size:24px; padding:0 10px;" onclick="document.getElementById('filterModal').style.display='none'">×</button>
    </div>
    <div class="modal-content" style="padding:15px; display:flex; flex-direction:column; background:#fff;">
      
      <div id="contextFilters" class="fm-item" style="display:none;"></div>
      
      <div class="fm-item">
        <label>路線:</label>
        <select id="lineFilter" class="filter-select" style="width:100%; max-width:none;" onchange="window.updateFormDropdown(); window.render();">
          <option value="all">全路線</option>
          <option value="toyoko">東横線</option>
          <option value="meguro">目黒線</option>
          <option value="shinyokohama">新横浜線</option>
          <option value="dento">田園都市線</option>
          <option value="oimachi">大井町線</option>
          <option value="ikegami">池上線</option>
          <option value="tamagawa">東急多摩川線</option>
          <option value="extra_tymg">非定期(東横・目黒)</option>
          <option value="extra_dtom">非定期(田都・大井)</option>
          <option value="extra_iketama">非定期(池上・多摩川)</option>
        </select>
      </div>
      
      <div class="fm-item">
        <label>運番検索:</label>
        <input type="text" id="opNumSearch" autocomplete="off" class="filter-select" style="width:100%; max-width:none;" placeholder="例: 01K" oninput="window.updateFormDropdown(); window.render();">
      </div>

      <div class="fm-item">
        <label>区間:</label>
        <select id="sectionFilter" class="filter-select" style="width:100%; max-width:none;" onchange="window.updateDestDropdown(); window.updateFormDropdown(); window.render();">
          <option value="all">すべての区間</option>
          <optgroup label="系統別">
            <option value="system_tymg">東横・目黒線系統</option>
            <option value="system_dtom">田都・大井町線系統</option>
            <option value="system_iketama">池上・多摩川線系統</option>
          </optgroup>
          <optgroup label="区間別">
            <option value="東横線">東横線</option>
            <option value="目黒線">目黒線</option>
            <option value="新横浜線">新横浜線</option>
            <option value="田園都市線">田園都市線</option>
            <option value="大井町線">大井町線</option>
            <option value="池上線">池上線</option>
            <option value="東急多摩川線">東急多摩川線</option>
          </optgroup>
        </select>
      </div>

      <div class="fm-item">
        <label>運用会社:</label>
        <select id="companyFilter" class="filter-select" style="width:100%; max-width:none;" onchange="window.updateFormDropdown(); window.render()">
          <option value="all">すべて</option>
          <option value="K">東急車 (K)</option>
          <option value="S">メトロ車 (S)</option>
          <option value="T">東武/都営 (T)</option>
          <option value="M">西武/埼玉高速 (M)</option>
          <option value="G">相鉄車 (G)</option>
          <option value="O100">大井町 100〜129番台</option>
          <option value="O130">大井町 130番台〜</option>
        </select>
      </div>

      <div class="fm-item">
        <label>種別:</label>
        <select id="kindFilter" class="filter-select" style="width:100%; max-width:none;" onchange="window.updateFormDropdown(); window.render()">
          <option value="all">すべて表示</option>
          <option value="各停">各停</option>
          <option value="B">B各停</option>
          <option value="G">G各停</option>
          <option value="準急">準急</option>
          <option value="急行">急行</option>
          <option value="通特">通特</option>
          <option value="特急_all">Fラ/特急</option>
          <option value="特急">特急</option>
          <option value="F">Fラ</option>
          <option value="Sトレイン">Sトレイン</option>
          <option value="回送">回送</option>
        </select>
      </div>

      <div class="fm-item">
        <label>行先:</label>
        <select id="destFilter" class="filter-select" style="width:100%; max-width:none;" onchange="window.updateFormDropdown(); window.render()"></select>
      </div>

      <div class="fm-item" id="formFilterArea" style="display:none;">
        <label>編成:</label>
        <select id="formFilterSel" class="filter-select" style="width:100%; max-width:none;" onchange="window.render()"></select>
      </div>

// =========================================
// 動的路線判定関数
// =========================================
function calculateSourceName(tr, hl) {
    if (!tr || !tr.history) return tr?.sourceName || "不明";
    if (hl === 'ikegami') return "池上線";
    if (hl === 'tamagawa') return "東急多摩川線";
    if (hl === 'extra_iketama') {
        if (tr.sourceName === '池上線' || tr.sourceName === '東急多摩川線') return tr.sourceName;
        if (tr.history.some(h => ["五反田","大崎広小路","戸越銀座","荏原中延","長原","洗足池","石川台","雪が谷大塚","御嶽山","久が原","千鳥町","池上","蓮沼"].includes(h.st))) return "池上線";
        if (tr.history.some(h => ["多摩川","沼部","鵜の木","下丸子","武蔵新田","矢口渡"].includes(h.st))) return "東急多摩川線";
    }
    
    // --- 溝の口以西の判定 ---
    const dentoWestStations = ["梶が谷", "宮崎台", "宮前平", "鷺沼", "たまプラーザ", "あざみ野", "江田", "市が尾", "藤が丘", "青葉台", "田奈", "長津田", "つくし野", "すずかけ台", "南町田", "南町田グランベリーパーク", "つきみ野", "中央林間", "駅間(81)", "駅間(82)", "駅間(83)", "駅間(84)", "駅間(85)", "駅間(86)", "駅間(87)", "駅間(88)", "駅間(89)", "駅間(90)", "駅間(91)", "駅間(92)", "駅間(93)", "駅間(94)", "駅間(95)", "駅間(96)", "駅間(97)", "駅間(108)", "駅間(109)", "駅間(110)", "駅間(111)", "駅間(112)", "駅間(113)", "駅間(114)", "駅間(115)", "駅間(116)", "駅間(117)", "駅間(118)", "駅間(119)", "駅間(120)", "駅間(121)", "駅間(122)", "駅間(123)", "駅間(124)"];
    let hasDentoWest = tr.history.some(h => dentoWestStations.includes(h.st));
    
    if (hl === 'dento' || hl === 'oimachi' || hl === 'extra_dtom') {
        if (hasDentoWest) return "田園都市線";
        let hasOimachiTrack = tr.history.some(h => (h.st === "二子玉川" && h.track === "3") || (h.st === "溝の口" && h.track === "2"));
        let hasDentoTrack = tr.history.some(h => (h.st === "溝の口" || h.st === "二子玉川") && (h.track === "1" || h.track === "4"));
        let hasDentoSection = tr.history.some(h => ["駅間(78)", "駅間(79)", "駅間(80)", "駅間(105)", "駅間(106)", "駅間(107)"].includes(h.st));
        
        if (hasOimachiTrack) return "大井町線";
        if (hasDentoTrack || hasDentoSection) return "田園都市線";
        
        return (hl === 'oimachi') ? "大井町線" : "田園都市線";
    } else {
        let hasShinYoko = tr.history.some(h => ["新横浜", "新綱島"].some(s => h.st.includes(s)));
        if (hasShinYoko) return "新横浜線";
        
        let baseLine = "東横線";
        if (hl === 'meguro') baseLine = "目黒線";
        else if (hl === 'shinyokohama') baseLine = "新横浜線";
        else if (hl === 'extra_tymg') {
            if (tr.trainNo && String(tr.trainNo).match(/^[2-6]/)) baseLine = "目黒線";
        }
        return baseLine;
    }
}

// キャッシュ・通信機能
// =========================================
function saveCache(data) { try { localStorage.setItem('tokyu_unyo_cache_phone', JSON.stringify(data)); localStorage.setItem('tokyu_unyo_cache_time_phone', Date.now()); } catch (e) {} }

function loadCache() {
  try {
    let cached = localStorage.getItem('tokyu_unyo_cache_phone');
    if (cached) {
      let data = JSON.parse(cached);
      logs.weekday = data.weekday || {};
      logs.holiday = data.holiday || {};
      logs.daily = data.daily || {};
      logs.customViews = data.customViews || [];
      if(data.appConfig) logs.appConfig = data.appConfig;
      hasReceivedCloudData = true;
      updateTabs(); updateNotice();
      
      let selectedDaily = null;
      const dailySel = document.getElementById("dailyDateSelect");
      if(dailySel && currentView === 'daily') selectedDaily = dailySel.value;
      if (!currentView.startsWith("import")) {
        updateContextUI(selectedDaily); 
        window.updateDestDropdown(); window.updateFormDropdown(); window.render();
      }
      
      let cTime = localStorage.getItem('tokyu_unyo_cache_time_phone');
      if (cTime) {
        lastCloudTime = new Date(parseInt(cTime)).toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit', second:'2-digit'}) + " (キャッシュ)";
        updateStatusDisplay();
      }
    }
  } catch(e) {}
}

function updateStatusDisplay() {
    const el = document.getElementById("cloudStatus");
    if (!el) return;

    const compact = CLOUD_GROUP_ORDER.map(function(group) {
        const st = cloudGroupState[group];
        const label = group === 'TYMG' ? 'TY' : (group === 'DTOM' ? 'DT' : 'IK');
        if (st.ok) return label + '○';
        if (st.error) return label + '×';
        return label + '…';
    });
    const anyOk = CLOUD_GROUP_ORDER.some(function(group) { return cloudGroupState[group].ok; });
    const anyError = CLOUD_GROUP_ORDER.some(function(group) { return !!cloudGroupState[group].error; });
    const allError = CLOUD_GROUP_ORDER.every(function(group) { return !!cloudGroupState[group].error; });

    if (hasReceivedCloudData || anyOk) {
        el.textContent = `☁️ ${compact.join(' ')}${lastCloudTime ? ' ' + lastCloudTime : ''}`;
    } else {
        el.textContent = `☁️ ${compact.join(' ')} 待機中`;
    }

    el.title = CLOUD_GROUP_ORDER.map(function(group) {
        const st = cloudGroupState[group];
        return group + ': ' + (st.ok ? '正常' : (st.error ? ('エラー ' + st.error) : '待機中'));
    }).join(' / ');

    if (allError) {
        el.style.color = "#d32f2f"; el.style.background = "#ffebee";
    } else if (anyError) {
        el.style.color = "#e65100"; el.style.background = "#fff3e0";
    } else {
        el.style.color = "#01aa8f"; el.style.background = "#e8f5e9";
    }
}

function forceSync() {

      if (compF === "K" && label.includes("K")) return true; if (compF === "S" && label.includes("S")) return true;
      if (compF === "T" && label.includes("T")) return true; if (compF === "M" && label.includes("M")) return true;
      if (compF === "G" && label.includes("G")) return true;
      if (label.match(/^\d+$/)) { let num = parseInt(label, 10); if (compF === "O100" && num >= 100 && num <= 129) return true; if (compF === "O130" && num >= 130) return true; }
      return false;
  };

  const addForm = (hl, aff, orch, tFmtType, cars, opLabel) => {
      if (!aff && (!orch || orch === "00" || orch === "0")) return;
      let fObj = getFormationString(tFmtType || hl, aff, orch, useFmt, cars, opLabel);
      let dispText = useFmt ? fObj.fNo : orch;
      if (dispText) { let val = hl.includes('oimachi') ? dispText : (fObj.dispAff ? `[${fObj.dispAff}] ${dispText}` : dispText); forms.add(val); }
  };

  if (data) {
    for (const opKey in data) { 
      let hl = data[opKey].homeLine; if (hl === 'extra_toyoko' || hl === 'extra_meguro') hl = 'extra_tymg';
      if (lineF !== "all" && lineF !== hl) continue;
      
      let label = data[opKey].label;
      if (opSearch && !label.toUpperCase().includes(opSearch)) continue;
      if (!checkComp(label)) continue;

      if(!data[opKey] || !data[opKey].trains) continue;
      for (const tUid in data[opKey].trains) {
        const t = data[opKey].trains[tUid];
        if (currentView === 'weekday' || currentView === 'holiday') { if (t.trainNo && (t.trainNo.endsWith("000") || t.trainNo.endsWith("990"))) continue; }
        if (t && !t.deleted && (t.affiliation || (t.orchestration && t.orchestration !== "00" && t.orchestration !== "0"))) {
            let calcSrc = calculateSourceName(t, hl);
            let srcMatch = false;
            if (secF === "all") srcMatch = true; 
            else if (secF === "system_tymg") {
                if (["toyoko", "meguro", "shinyokohama", "extra_tymg"].some(h => hl.includes(h))) srcMatch = true;
                if (["東横線", "目黒線", "新横浜線"].some(l => calcSrc.includes(l))) srcMatch = true;
            } 
            else if (secF === "system_dtom") {
                if (["dento", "oimachi", "extra_dtom"].some(h => hl.includes(h))) srcMatch = true;
                if (["田園都市線", "大井町線"].some(l => calcSrc.includes(l))) srcMatch = true;
            }
            else if (secF === "system_iketama") {
                if (["ikegami", "tamagawa", "extra_iketama"].some(h => hl.includes(h))) srcMatch = true;
                if (["池上線", "東急多摩川線"].some(l => calcSrc.includes(l))) srcMatch = true;
            } 
            else {
                if (calcSrc.includes(secF)) srcMatch = true;
                else {
                    let homeLineMap = {"東横線": "toyoko", "目黒線": "meguro", "新横浜線": "shinyokohama", "田園都市線": "dento", "大井町線": "oimachi", "池上線":"ikegami", "東急多摩川線":"tamagawa"};
                    if (hl.includes(homeLineMap[secF])) srcMatch = true;
                    let exclusives = LINE_EXCLUSIVES[secF] || [];
                    if (t.history && t.history.some(h => exclusives.includes(h.st))) srcMatch = true;
                }
            }
            if (srcMatch) addForm(hl, t.affiliation, t.orchestration, t.formatType, t.cars, label);
        }
      }
    }
  }
  return Array.from(forms).sort();
}

function isArrayEqual(arr1, arr2) {
    if (arr1.length !== arr2.length) return false;
    for (let i = 0; i < arr1.length; i++) { if (arr1[i] !== arr2[i]) return false; }
    return true;
}

// =========================================
// Live API（走行中判定専用）
// 表示内容（行き先・種別・編成・履歴など）には一切使用しない。
// Live API由来の簡易列車表示・補完行の生成は行わず、記録済み列車の走行中判定にだけ使用する。
// =========================================
const LIVE_API_ENDPOINTS = [
  {id:'toyoko', url:'https://w-tid.jp/tokyu/toyoko.json'},
  {id:'meguro', url:'https://w-tid.jp/tokyu/meguro.json'},
  {id:'shinyokohama', url:'https://w-tid.jp/tokyu/shinyokohama.json'},
  {id:'dento', url:'https://w-tid.jp/tokyu/dento.json'},
  {id:'oimachi', url:'https://w-tid.jp/tokyu/oimachi.json'},
  {id:'iketama', url:'https://w-tid.jp/tokyu/iketama.json'}
];
let liveRunningByLine = new Map();
let isFetchingLiveStatus = false;

function normalizeLiveTrainNo(t) {
  if (!t) return '';
  const rawOp = String(t.operation_number || '0');
  const rawTr = String(t.train_number || '0');
  if (rawOp === '09999900' || rawTr === '09999900' || rawTr === '0') return '';
  let tNo = '';
  if (rawOp.length === 8) tNo = rawOp.substring(1, 7);
  else if (rawTr.length === 8) tNo = rawTr.substring(1, 7);
  else tNo = rawTr.padStart(6, '0');
  if (tNo === '999000' || tNo === '999900') return '';
  return tNo;
}

function getLiveLineCandidates(t, hl) {
  const out = new Set();
  const src = String((t && t.sourceName) || '');
  const calc = String(calculateSourceName(t || {}, hl || '') || '');
  const addFromText = text => {
    if (text.includes('東横')) out.add('toyoko');
    if (text.includes('目黒')) out.add('meguro');
    if (text.includes('新横浜')) out.add('shinyokohama');
    if (text.includes('田園都市')) out.add('dento');
    if (text.includes('大井町')) out.add('oimachi');
    if (text.includes('池上')) out.add('ikegami');
    if (text.includes('多摩川')) out.add('tamagawa');
  };
  addFromText(src); addFromText(calc);
  const direct = {toyoko:'toyoko',meguro:'meguro',shinyokohama:'shinyokohama',dento:'dento',oimachi:'oimachi',ikegami:'ikegami',tamagawa:'tamagawa'};
  if (direct[hl]) out.add(direct[hl]);
  if (hl === 'extra_tymg') { out.add('toyoko'); out.add('meguro'); out.add('shinyokohama'); }
  if (hl === 'extra_dtom') { out.add('dento'); out.add('oimachi'); }
  if (hl === 'extra_iketama') { out.add('ikegami'); out.add('tamagawa'); }
  return [...out];
}

function isRunningByLiveApi(t, hl) {
  const trainNo = String((t && t.trainNo) || '').padStart(6, '0');
  if (!trainNo || trainNo === '000000') return false;
  const candidates = getLiveLineCandidates(t, hl);
  return candidates.some(line => liveRunningByLine.get(line)?.has(trainNo));
}

async function fetchLiveRunningStatus() {
  if (isFetchingLiveStatus) return;
  isFetchingLiveStatus = true;
  const next = new Map([
    ['toyoko', new Set()], ['meguro', new Set()], ['shinyokohama', new Set()],
    ['dento', new Set()], ['oimachi', new Set()], ['ikegami', new Set()], ['tamagawa', new Set()]
  ]);
  try {
    await Promise.all(LIVE_API_ENDPOINTS.map(async api => {
      let timeoutId = null;
      try {
        const controller = new AbortController();
        timeoutId = setTimeout(() => controller.abort(), 20000);
        const res = await fetch(`${api.url}?t=${Date.now()}`, {cache:'no-store', signal:controller.signal});
        if (!res.ok) return;
        const data = await res.json();
        if (!data || !Array.isArray(data.trains)) return;
        for (const row of data.trains) {
          const no = normalizeLiveTrainNo(row);
          if (!no) continue;
          if (api.id === 'iketama') {
            const lineId = Number(row.line_id);
            if (lineId === 26005) next.get('ikegami').add(no);
            else if (lineId === 26006) next.get('tamagawa').add(no);
          } else {
            next.get(api.id)?.add(no);
          }
        }
      } catch (_) {
        // 走行判定APIの失敗は表示データ自体には影響させない。
      } finally {
        if (timeoutId) clearTimeout(timeoutId);
      }
    }));
    liveRunningByLine = next;
    if (typeof window.render === 'function') window.render();
  } finally {
    isFetchingLiveStatus = false;
  }
}

function liveStatusLoop() {
  fetchLiveRunningStatus().finally(() => setTimeout(liveStatusLoop, 10000));
}

            if (hl === 'dento' && t.formationNumber) {

              const isEkikan = displaySt.includes("駅間");
              const cls = `hist-item ${isEkikan ? 'is-ekikan' : ''}`;
              let delayMark = "";
              if (h.delay > 0) { delayMark = (currentView === 'daily' || currentView.startsWith('import') || currentView.startsWith('custom_')) ? `<sup class="tentative-mark">⁺${h.delay}</sup>` : `<sup class="tentative-mark">*</sup>`; }
              let trackCircle = TRACK_CIRCLES[h.track] || `(${h.track})`;

              return `<span class="${cls} clickable-st" onclick="window.openStationTimetable(this.getAttribute('data-st'), '${tUid}')" data-st="${displaySt}" title="この駅の時刻表を見る"><strong>${h.t}${delayMark}</strong> ${displaySt}${trackMark}</span>`;
            }).join('');
            hHtml += `</div>`;

            const dispTrainNo = t.trainNo ? `${t.trainNo.substring(0,3)}-${t.trainNo.substring(3)}` : "不明";
            let badgeText = dKind; if (dKind === "F") badgeText = "Fラ"; else if (dKind === "B") badgeText = "B各停"; else if (dKind === "G") badgeText = "G各停"; else if (dKind === "Sトレイン") badgeText = "S";
            let dateTag = (g.id.startsWith('extra') && t.date && currentView !== 'daily') ? `<div class="t-tr-sub">(${t.date})</div>` : "";
            let badgeDelay = t.history[t.history.length-1].delay || 0;
            let posText = `<strong>${t.history[t.history.length-1].t}</strong> ${normalizeDestName(t.history[t.history.length-1].st)}`;
let badgeDelayHtml = "";
            if (badgeDelay > 0 && (currentView === 'daily' || currentView.startsWith('import') || currentView.startsWith('custom_'))) {
                badgeDelayHtml = `<span class="t-delay">${badgeDelay}分遅れ</span>`;
            }

            let rowClass = isRunning ? 'row-active' : '';

            tHtml += `<div class="train-row ${rowClass}" id="train_row_${tUid}">
              <div class="t-basic">
                <div class="t-tr">
                    <div class="t-tr-no">${dispTrainNo}</div>

                    ${dateTag}
                </div>

                  <div class="t-dest-text"><span class="kind-badge kind-${dKind}">${badgeText}</span>${formatDestLabel(displayDest)}</div>

                </div>
              </div>

            </div>`;

      }

      if(tHtml) groupHtml += `<div class="op-box">

          <div class="op-no">${label || "不明"}</div>

        </div>
        <div class="op-right">${tHtml}</div>

    });

  });

  const currentScrollY = window.scrollY;
  const currentHeight = container.getBoundingClientRect().height;

  container.innerHTML = html || "<div style='padding:40px; text-align:center; color:#888; font-weight:bold;'>指定した条件に一致する運用はありません。</div>";
  
  if (currentScrollY > 0) window.scrollTo(0, currentScrollY);
  setTimeout(() => { container.style.minHeight = "auto"; }, 100);
};

function getTrainDirection(tr) {
    if (!tr || !tr.trainNo) return 1; 
    let lastDigit = parseInt(tr.trainNo.slice(-1), 10);
    if (!isNaN(lastDigit)) { return (lastDigit % 2 === 0) ? 0 : 1; }
    return 1;
}

function isPassStation(kind, stName) {
    if (!kind || kind.includes("各停") || kind === "B") return false;
    if (kind === "G") return (stName === "高津" || stName === "二子新地");
    if (kind.includes("回送")) return true;

    const stopDict = {
        "特急": ["渋谷", "中目黒", "自由が丘", "武蔵小杉", "菊名", "横浜", "新横浜", "新綱島", "日吉"],
        "F": ["渋谷", "中目黒", "自由が丘", "武蔵小杉", "菊名", "横浜", "新横浜", "新綱島", "日吉"],
        "通特": ["渋谷", "中目黒", "学芸大学", "自由が丘", "田園調布", "多摩川", "武蔵小杉", "日吉", "菊名", "横浜", "新横浜", "新綱島"],
        "急行": ["渋谷", "中目黒", "学芸大学", "自由が丘", "田園調布", "多摩川", "武蔵小杉", "日吉", "綱島", "菊名", "横浜", "目黒", "武蔵小山", "大岡山", "新横浜", "新綱島", "三軒茶屋", "二子玉川", "溝の口", "鷺沼", "たまプラーザ", "あざみ野", "青葉台", "長津田", "南町田", "南町田グランベリーパーク", "中央林間", "大井町", "旗の台"],
        "準急": ["渋谷", "池尻大橋", "三軒茶屋", "駒沢大学", "桜新町", "用賀", "二子玉川", "溝の口", "鷺沼", "たまプラーザ", "あざみ野", "青葉台", "長津田", "つくし野", "すずかけ台", "南町田", "南町田グランベリーパーク", "つきみ野", "中央林間"],
        "Sトレイン": ["渋谷", "自由が丘", "横浜"]
    };

    let baseKind = kind === "特急_all" ? "特急" : kind;
    if (stopDict[baseKind]) { return !stopDict[baseKind].includes(stName); }
    return false;
}

window.openStationTimetable = function(stName, currentTUid) {
  const data = getActiveData();
  if (!data) return;

  let trainsAtSt = [];
  let clickedTrainData = null;
  
  Object.keys(data).forEach(opKey => {
    let u = data[opKey]; if (!u || !u.trains) return;
    let isExtra = opKey.startsWith("extra_");

    Object.keys(u.trains).forEach(tUid => {
      let tr = u.trains[tUid]; if (!tr || tr.deleted) return;
      if ((currentView === 'weekday' || currentView === 'holiday') && tr.trainNo && (tr.trainNo.endsWith("000") || tr.trainNo.endsWith("990"))) return;

      let targetHist = tr.history.find(h => normalizeDestName(h.st) === normalizeDestName(stName));
      if (targetHist) {
        let hlForDest = u.homeLine;
        if (hlForDest === 'extra_toyoko' || hlForDest === 'extra_meguro') hlForDest = 'extra_tymg';
        const recordedDest = getRecordedDisplayDest(tr, hlForDest);
        let isTerminal = false;
        if (["渋谷", "目黒", "横浜", "新横浜"].includes(stName)) {
            isTerminal = (recordedDest === stName);
        } else {
            isTerminal = (recordedDest === stName) || (tr.history.length > 0 && normalizeDestName(tr.history[tr.history.length-1].st) === stName);
        }
        let isFirst = (tr.history.length > 0 && tr.history[0].st === stName);
        
        let isPass = isPassStation(tr.kind, stName);
        if (isTerminal || isFirst) isPass = false;

        // 修正前: let hl = opKey.split('_')[0]; 
        // 修正後: u.homeLine から直接取得するように変更します
        let hl = u.homeLine;
        
        if (hl === 'extra_toyoko' || hl === 'extra_meguro') hl = 'extra_tymg';
        let dispLine = calculateSourceName(tr, hl);

        let tData = {
          time: targetHist.t, tv: getTv(targetHist.t), delay: targetHist.delay || 0,
          track: targetHist.track || "", 
          opLabel: u.label, kind: tr.kind, dest: recordedDest, tNo: tr.trainNo, tUid: tUid,
          sourceName: dispLine, dir: getTrainDirection(tr),
          isTerminal: isTerminal, isExtra: isExtra, isPass: isPass,
          affiliation: tr.affiliation || "", orchestration: tr.orchestration || "", cars: tr.cars || 0,
          formatType: tr.formatType || ""
        };
        trainsAtSt.push(tData);
        if (tUid === currentTUid) clickedTrainData = tData;
      }
    });
  });

  trainsAtSt.sort((a, b) => a.tv - b.tv);
  
  ttState.stName = stName; ttState.trains = trainsAtSt; ttState.currentTUid = currentTUid;
  ttState.dirMode = clickedTrainData ? (clickedTrainData.dir === 0 ? "up" : "down") : "up";
  ttState.lineMode = "all"; ttState.availableLines = [];
  
  const ST_GROUPS = {
    "渋谷": { separate: true, lines: ["東横線", "田園都市線"] }, "自由が丘": { separate: true, lines: ["東横線", "大井町線"] },
    "田園調布": { separate: false, lines: ["東横線", "目黒線"] }, "多摩川": { separate: false, lines: ["東横線", "目黒線"] },
    "新丸子": { separate: false, lines: ["東横線", "目黒線"] }, "武蔵小杉": { separate: false, lines: ["東横線", "目黒線"] },
    "元住吉": { separate: false, lines: ["東横線", "目黒線"] }, "日吉": { separate: false, lines: ["東横線", "目黒線", "新横浜線"] },
    "大岡山": { separate: false, lines: ["目黒線", "大井町線"] }, "二子玉川": { separate: false, lines: ["田園都市線", "大井町線"] },
    "二子新地": { separate: false, lines: ["田園都市線", "大井町線"] }, "高津": { separate: false, lines: ["田園都市線", "大井町線"] },
    "溝の口": { separate: false, lines: ["田園都市線", "大井町線"] }
  };
  
  if (ST_GROUPS[stName]) {
      ttState.availableLines = ST_GROUPS[stName].lines;
      if (ST_GROUPS[stName].separate) {
          if (clickedTrainData) { ttState.lineMode = ttState.availableLines.find(l => clickedTrainData.sourceName.includes(l)) || ttState.availableLines[0]; } 
          else { ttState.lineMode = ttState.availableLines[0]; }
      }
  }

  document.getElementById('ttModalTitle').innerText = `🕒 ${stName} 駅 時刻表`;
  document.getElementById('timetableModal').style.display = 'flex';
  renderTimetable();
};

window.jumpToTime = function(hour) {
  let container = document.getElementById('ttModalContent');
  let rows = container.querySelectorAll('.tt-row');
  for (let row of rows) {
    let tTimeEl = row.querySelector('.tt-time');
    if (!tTimeEl) continue;
    
    let parts = tTimeEl.innerText.split(':');
    if(parts.length < 2) continue;
    
    let tHour = parseInt(parts[0], 10);
    if (tHour < 4) tHour += 24;
    
    let targetHour = hour;
    if (targetHour < 4) targetHour += 24;
    
    if (tHour >= targetHour) {
      row.scrollIntoView({ behavior: 'auto', block: 'start' });
      row.classList.remove('highlight-flash');
      void row.offsetWidth;
      row.classList.add('highlight-flash');
      break;
    }
  }
};

window.closeTimetableModal = function(e) {

  document.getElementById('timetableModal').style.display = 'none';

window.jumpToTrain = function(tUid) {

};

// =========================================
// データ取得ループ（TYMG / DTOM / IKTM 3GAS仕様）
// =========================================
function getCloudGroupForHomeLine(homeLine) {
  const hl = String(homeLine || '');
  for (const group of CLOUD_GROUP_ORDER) {
    if (CLOUD_GROUP_LINES[group].has(hl)) return group;
  }
  return null;
}

function parseCloudJsonText(text) {
  const raw = String(text || '').trim();
  if (!raw) return {};
  try {
    return JSON.parse(raw);
  } catch (parseError) {
    let lastIdx = raw.lastIndexOf('{"weekday"');
    if (lastIdx === -1) lastIdx = raw.lastIndexOf('{"appConfig"');
    if (lastIdx === -1) throw parseError;
    let recoveredText = raw.substring(lastIdx);
    const endIdx = recoveredText.lastIndexOf('}');
    if (endIdx !== -1) recoveredText = recoveredText.substring(0, endIdx + 1);
    return JSON.parse(recoveredText);
  }
}

function replaceCloudGroupInOpMap(targetMap, incomingMap, group) {
  if (!targetMap || typeof targetMap !== 'object') return;

  // 取得に成功した系統だけ最新版へ置換する。
  // 他系統は通信失敗時でも直前データ／端末キャッシュを残す。
  Object.keys(targetMap).forEach(function(opKey) {
    const unit = targetMap[opKey];
    if (unit && getCloudGroupForHomeLine(unit.homeLine) === group) delete targetMap[opKey];
  });

  Object.keys(incomingMap || {}).forEach(function(opKey) {
    const unit = incomingMap[opKey];
    if (!unit) return;
    const detected = getCloudGroupForHomeLine(unit.homeLine);
    if (detected === group) targetMap[opKey] = unit;
    else if (detected) console.warn('3GAS: ' + group + ' に別系統データを検出したため無視', opKey, unit.homeLine);
    else console.warn('3GAS: homeLine を判定できないデータを無視', opKey, unit.homeLine);
  });
}

function applyCloudGroupData(group, data) {
  if (!data || typeof data !== 'object' || Array.isArray(data)) data = {};

  replaceCloudGroupInOpMap(logs.weekday, data.weekday || {}, group);
  replaceCloudGroupInOpMap(logs.holiday, data.holiday || {}, group);

  const allDates = new Set([
    ...Object.keys(logs.daily || {}),
    ...Object.keys(data.daily || {})
  ]);
  allDates.forEach(function(dateKey) {
    if (!logs.daily[dateKey]) logs.daily[dateKey] = {};
    replaceCloudGroupInOpMap(logs.daily[dateKey], (data.daily || {})[dateKey] || {}, group);
    if (Object.keys(logs.daily[dateKey]).length === 0) delete logs.daily[dateKey];
  });
}

function updateSharedCloudMetadata() {
  // appConfig / customViews は3GASへ同内容を保存する前提。
  // TYMGを優先し、停止時はDTOM→IKTMを利用する。
  const liveGroup = CLOUD_GROUP_ORDER.find(function(group) {
    return cloudGroupState[group].ok && cloudGroupData[group] && typeof cloudGroupData[group] === 'object';
  });
  const fallbackGroup = CLOUD_GROUP_ORDER.find(function(group) {
    return cloudGroupData[group] && typeof cloudGroupData[group] === 'object';
  });
  const src = cloudGroupData[liveGroup || fallbackGroup];
  if (!src) return;
  if (Array.isArray(src.customViews)) logs.customViews = src.customViews;
  if (src.appConfig && typeof src.appConfig === 'object' && !Array.isArray(src.appConfig)) logs.appConfig = src.appConfig;
}

function getCloudRetryDelay(attempt) {
  return CLOUD_RETRY_DELAYS[Math.min(attempt, CLOUD_RETRY_DELAYS.length - 1)];
}

async function fetchCloudGroup(group, force) {
  const state = cloudGroupState[group];
  const now = Date.now();
  if (!force && state.nextRetryAt && now < state.nextRetryAt) {
    return { group: group, ok: false, skipped: true };
  }

  const controller = new AbortController();
  const timeoutId = setTimeout(function() { controller.abort(); }, 45000);
  try {
    const res = await fetch(GAS_URLS[group] + '?t=' + Date.now(), {
      signal: controller.signal,
      cache: 'no-store'
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);

    const text = await res.text();
    const data = parseCloudJsonText(text);
    cloudGroupData[group] = data;
    applyCloudGroupData(group, data);

    state.ok = true;
    state.error = '';
    state.retryAttempt = 0;
    state.nextRetryAt = 0;
    return { group: group, ok: true };
  } catch (err) {
    state.ok = false;
    state.error = String(err && err.message ? err.message : err);
    const delay = getCloudRetryDelay(state.retryAttempt++);
    state.nextRetryAt = Date.now() + delay;
    console.error('Cloud load error (' + group + '); ' + Math.round(delay / 1000) + '秒後以降に再試行:', err);
    return { group: group, ok: false, error: err };
  } finally {
    clearTimeout(timeoutId);
  }
}

async function fetchFromCloud(force = false) {
  if (isFetchingCloud) return;
  isFetchingCloud = true;
  const statusEl = document.getElementById('cloudStatus');
  if (statusEl) statusEl.textContent = '☁️ 3系統受信中...';

  try {
    const results = await Promise.all(CLOUD_GROUP_ORDER.map(function(group) {
      return fetchCloudGroup(group, force);
    }));
    const successCount = results.filter(function(r) { return r && r.ok; }).length;

    if (successCount > 0) {
      updateSharedCloudMetadata();
      saveCache(logs);
      hasReceivedCloudData = true;

      let selectedDaily = null;
      const dailySel = document.getElementById('dailyDateSelect');
      if (dailySel && currentView === 'daily') selectedDaily = dailySel.value;

      updateTabs();
      updateNotice();
      if (!currentView.startsWith('import')) {
        updateContextUI(selectedDaily);
        window.updateDestDropdown();
        window.updateFormDropdown();
        window.render();
      }

      lastCloudTime = new Date().toLocaleTimeString('ja-JP', {
        hour:'2-digit', minute:'2-digit', second:'2-digit'
      });

      if (targetTimetableStation && !hasOpenedStandalone) {
        hasOpenedStandalone = true;
        setTimeout(function() { window.openStationTimetable(targetTimetableStation, null); }, 300);
      }
    } else if (!hasReceivedCloudData) {
      lastCloudTime = '再試行中';
    }

    updateStatusDisplay();
  } finally {
    isFetchingCloud = false;
  }
}

async function cloudLoop() {
    const isTodayDaily = (currentView === 'daily' && document.getElementById('dailyDateSelect') && document.getElementById('dailyDateSelect').value === getDailyKey(new Date()));
    const targetDateForCalc = new Date(new Date().getTime() - 4 * 60 * 60 * 1000);
    const todayDayType = getAutoDayType(targetDateForCalc).type;
    const isCurrentCumulative = (currentView === todayDayType);
    const retryDue = CLOUD_GROUP_ORDER.some(function(group) {
        const st = cloudGroupState[group];
        return !!st.error && (!st.nextRetryAt || Date.now() >= st.nextRetryAt);
    });

    if ((isTodayDaily || isCurrentCumulative || retryDue) && !isFetchingCloud) {
        await fetchFromCloud(false);
    }
    setTimeout(cloudLoop, 3000);
}


window.exportData = function() {
    if (!logs || Object.keys(logs).length === 0) return alert("データがありません。");
    const exportObj = { _isRawBackup: true, timestamp: new Date().toISOString(), logs: logs };
    const a = document.createElement('a'); a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportObj));
    a.download = `tokyu_viewer_phone_raw_backup_${Date.now()}.json`; a.click();
};

window.importJSONData = function(file, targetView) {
    if (!file) return alert("ファイルを選択してください。");
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const json = JSON.parse(e.target.result);
            let sourceLogs = null;
            if (json._isRawBackup && json.logs) sourceLogs = json.logs;
            else if (json.weekday || json.holiday || json.daily) sourceLogs = json;
            else throw new Error("フォーマット違い");
            
            logs[targetView] = sourceLogs;
            alert("読み込み成功しました。");
            currentFilterState = {}; // インポート時もリセット
            window.updateDestDropdown(); window.updateFormDropdown(); window.render();
        } catch(err) {
            alert("読み込み失敗: " + err.message);
        }
    };
    reader.readAsText(file);
};

function initCloudSync() {
  loadCache(); document.getElementById("cloudStatus").textContent = "☁️ 読込中...";
  fetchFromCloud(); setTimeout(cloudLoop, 3000); 
}

document.addEventListener("DOMContentLoaded", () => {
  let ibar = document.getElementById("ttIndexBar");
  if(ibar) {
      let hHtml = "";
      for(let h=4; h<=25; h++) {
          let displayH = h >= 24 ? h - 24 : h;
          hHtml += `<div class="tt-index-btn" onclick="window.jumpToTime(${h})">${displayH}</div>`;
      }
      ibar.innerHTML = hHtml;
  }

  const urlParams = new URLSearchParams(window.location.search);
  const params = location.search.substring(1);
  targetTimetableStation = urlParams.get('timetable');
  
  if (targetTimetableStation) {
      document.getElementById('sticky-header').style.display = 'none';
      document.querySelector('.fab').style.display = 'none';
      document.getElementById('tabArea').style.display = 'none';
      document.getElementById('container').style.display = 'none';
      document.body.style.background = 'rgba(0,0,0,0.7)';
  } else if (params && document.getElementById("lineFilter")) {
      const opts = Array.from(document.getElementById("lineFilter").options).map(o => o.value);
      if (opts.includes(params)) document.getElementById("lineFilter").value = params;
  }
  
  window.changeTab('daily'); initCloudSync(); fetchLiveRunningStatus(); setTimeout(liveStatusLoop, 10000); 
});
</script>
