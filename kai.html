  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;margin:0;padding:12px;}
    /* iOSでtableのstickyヘッダが上に被ってselectが押せなくなることがあるため、
       headerをsticky最前面にし、thのsticky位置をheader高さ分だけ下げる */
    header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;position:sticky;top:0;z-index:20;background:#fff;padding:8px 0;}
    .field{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid #ddd;border-radius:12px;background:#fff;}
    .btn{padding:8px 10px;border:1px solid #ddd;border-radius:10px;background:#fff;font-size:14px;cursor:pointer}
    select{padding:8px 10px;border:1px solid #ddd;border-radius:10px;font-size:14px;background:#fff}
    .muted{opacity:.7;font-size:12px}
    table{width:100%;border-collapse:collapse;table-layout:auto}
    th,td{border-bottom:1px solid #eee;padding:8px 6px;vertical-align:top;font-size:13px;word-break:break-word}
    /* 表ヘッダはstickyにすると環境によって行と重なってズレることがあるため、通常表示にする */
    th{background:#fafafa;text-align:left;position:static}
    .pill{display:inline-block;padding:2px 6px;border-radius:999px;border:1px solid #ddd;font-size:12px}
    .right{text-align:right}
    .small{font-size:12px;opacity:.85}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
  
  .tableWrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid #ddd; border-radius:12px; }
  #tbl{ min-width: 760px; width:100%; }
  #tbl th, #tbl td{ white-space:nowrap; }
  #tbl td:nth-child(3){ white-space:normal; } /* 現在位置は折り返しOK */
  @media (max-width: 480px){
    header{ padding: 10px 12px; }
    main{ padding: 12px; }
    .tableWrap{ border-radius:10px; }
    #tbl{ min-width: 720px; }
    #tbl th, #tbl td{ font-size: 12px; padding: 6px 8px; }
    .pill{ font-size: 11px; padding: 2px 6px; }
  }

</style>
</head>

      {station_id:948,station_name:"二子新地",tracks:"M-6,-3H6M-6,-1H6M-6,1H6M-6,3H6",plats:[-2,2]},
      {section_id:[79,140,157,106]},
      {station_id:949,station_name:"高津",tracks:"M-6,-3H6M-6,-1H6M-6,1H6M-6,3H6M2,-3L3,-1M2,3L3,1",plats:[-2,2]},
      {section_id:[80,141,158,107]},
      {station_id:950,station_name:"溝の口",tracks:"M-6,-3H5L6,-1M-6,-1H3.5L4.5,-3M-6,1H3.5L4.5,3M-6,3H5L6,1M2,1L3,-1M2,-1L3,1",plats:[-1,1]},
      {section_id:[81,108]},
    ]},
    "shinyokohama": { uri:"shinyokohama", line_id:26009, line_name:"東急新横浜線", sections:[
      {station_id:919,station_name:"日吉",tracks:"M-2,-1L-3,-3M-2,1L-3,3M-6,-3H6M-6,-1H6M-6,1H6M-6,3H6M2,-3L3,-1M2,3L3,1M4,-1L4.5,0H5M4,1L4.5,0",plats:[-1,1]},
      {section_id:[263,265]},
      {station_id:982,station_name:"新綱島",tracks:"M-6,-1H6M-6,1H6",plats:[0]},
      {section_id:[264,266]},
      {station_id:983,station_name:"新横浜",tracks:"M-5,-1L-4,1M-5,1L-4,-1M-2,1L-3,-1M-2,3L-3,1M-6,-1H6M-6,1H5V4H-5V5H6M-2,3H2M2,1L3,-1M2,3L3,1M4,1L5,-1",plats:[0,1]},
    ]},
  };

// Build line list from linedata
  const ALLOWED_KEYS = ["toyoko","meguro","shinyokohama","dento","oimachi"];
  const LINES = ALLOWED_KEYS.map(k => ({
    key: k,
    name: linedata[k].line_name,
    url: `https://w-tid.jp/tokyu/${linedata[k].uri}.json`,
    line_id: linedata[k].line_id,
  }));

  // station_id -> station_name, section_id -> "A〜B" maps (per line key)
  const STATION_MAP = {};   // { lineKey: {stationId: name} }
  const SECTION_MAP = {};   // { lineKey: {sectionId: {from,to}} }

  function buildLineMaps(){
    ALLOWED_KEYS.forEach(lineKey=>{
      const ld = linedata[lineKey];
      const st = {};
      const secTemp = []; // pending {ids, fromName}
      const secMap = {};

      // first pass: station names
      ld.sections.forEach(item=>{
        if (item.station_id != null){
          st[String(item.station_id)] = item.station_name || String(item.station_id);
        }
      });

      // second pass: assign section between previous and next station
      let lastStationName = null;
      let pending = []; // section ids waiting for 'to'
      ld.sections.forEach(item=>{
        if (item.station_id != null){
          const curName = item.station_name || String(item.station_id);
          if (pending.length && lastStationName){
            pending.forEach(id=>{
              if (id != null && id !== -1){
                secMap[String(id)] = {from: lastStationName, to: curName};
              }
            });
          }
          pending = [];
          lastStationName = curName;
        } else if (item.section_id != null){
          // store all section ids; will be linked when the next station appears
          const arr = Array.isArray(item.section_id) ? item.section_id : [item.section_id];
          arr.forEach(id=>{
            if (id != null && id !== -1) pending.push(id);
          });
        }
      });

      STATION_MAP[lineKey] = st;
      SECTION_MAP[lineKey] = secMap;
    });
  }

  function stationName(lineKey, stationId){
    const m = STATION_MAP[lineKey] || {};
    return m[String(stationId)] || `駅${stationId}`;
  }
  function sectionBetween(lineKey, sectionId){
    const m = SECTION_MAP[lineKey] || {};
    return m[String(sectionId)] || null;
  }

  const UPDATE_INTERVAL_MS = 6000;

  function opno(no, line){
    var opchar = {0:"K",1:"M",2:"K",3:"S",4:"T",5:"M",6:"G",7:"S",8:"T",9:"G"};
    if (line == 26005 || line == 26006) return ("00"+no).slice(-2);
    if (typeof no != "number") return no;
    if (no == 999) return no;
    if (line == null || line == 26001 || line == 26002 || line == 26009)
      if ((no/100|0) in opchar) return ("00"+no).slice(-2) + opchar[no/100|0];
    if (line == 26003 && no < 100) return ("00"+no).slice(-2) + (no < 50 ? "K" : no % 2 == 0 ? "T" : "S");
    return ("00"+no).slice(no < 10 ? -1 : no < 100 ? -2 : -3);
  }

  function positionLabel(t, lineKey){
    if (t.station_id != null){
      const name = stationName(lineKey, t.station_id);
      const tr = (t.track_number != null) ? ` ${t.track_number}` : "";
      return `${name}${tr} (sta${t.station_id})`;
    }
    if (t.section_id != null){
      const bt = sectionBetween(lineKey, t.section_id);
      if (bt) return `${bt.from}〜${bt.to} (sec${t.section_id})`;
      return `区間 sec${t.section_id}`;
    }
    return "-";
  }

  function companyLabel(t){
    if ("affiliation" in t && t.affiliation != null && String(t.affiliation).trim() !== "") return String(t.affiliation);
    return "？";
  }
  function formationLabel(t){
    const parts = [];
    if ("train_orchestration_number" in t && t.train_orchestration_number && String(t.train_orchestration_number) !== "00") parts.push(String(t.train_orchestration_number));
    if ("train_orchestration" in t && t.train_orchestration) parts.push(String(t.train_orchestration));
    return parts.length ? parts.join(" ") : "-";
  }
  function carsLabel(t){
    const v = ("num_of_cars" in t && t.num_of_cars != null) ? String(t.num_of_cars) : "";
    const n = Number(v);
    if (!isNaN(n) && n>0 && n!==99) return String(n);
    return "";
  }
  function isKaisou(t){
    const raw = (t.kind ?? t.train_kind ?? t.trainKind ?? t.train_kind_name ?? t.trainKindName ?? "");
    const k = String(raw).trim();
    return k.startsWith("回");
  }
  function escapeHtml(str){
    return String(str).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;");
  }

  function makeTrainDomId(lineId, up, operationNumber){
    const op = (operationNumber===undefined || operationNumber===null) ? "" : String(operationNumber);
    const dir = up ? "up" : "down";
    return ("train-" + lineId + "-" + dir + "-" + op).replace(/[^A-Za-z0-9_-]/g, "_");
  }
  function render(rows){
    const tb = document.getElementById("tbody");
    tb.innerHTML = rows.length ? rows.map(r => `
      <tr class="row" data-linekey="${escapeHtml(r.lineKey)}" data-trainid="${escapeHtml(r.trainId)}">
        <td><span class="pill">${escapeHtml(r.line)}</span></td>
        <td class="mono">${escapeHtml(r.op)}</td>
        <td>${escapeHtml(r.pos)} <span class="small">${r.dir}</span></td>
        <td>${escapeHtml(r.company)}</td>
        <td class="mono">${escapeHtml(r.form)}</td>
        <td class="right mono">${escapeHtml(r.cars)}</td>
      </tr>
    `).join("") : `<tr><td colspan="6" class="muted">回送が見つかりません</td></tr>`;

    // 行クリックでその路線の路線図ページへ
    tb.querySelectorAll('tr.row[data-linekey]').forEach(tr=>{
      tr.addEventListener('click', ()=>{
        const lk = tr.getAttribute('data-linekey');
        const tid = tr.getAttribute('data-trainid');
        if(lk){
          location.href = 'index.html?' + lk + (tid ? ('#' + encodeURIComponent(tid)) : '');
        }
      });
    });
  }
  async function fetchLine(line){
    const tsUrl = (u)=> u + (u.includes('?') ? '&' : '?') + 'ts=' + Date.now();

    // 取得に失敗する環境（特に file:// ）向けにフォールバックを用意
    const FALLBACK = {
      toyoko: 'https://tokyu-train-data.vercel.app/toyoko.json',
      meguro: 'https://tokyu-train-data.vercel.app/meguro.json',
      shinyokohama: 'https://tokyu-train-data.vercel.app/shinyokohama.json',
      // dento / oimachi は基本 w-tid を使う（必要なら追加可能）
    };

    async function tryFetch(url){
      const res = await fetch(tsUrl(url), {cache:"no-store"});
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      const ct = (res.headers.get('content-type')||'').toLowerCase();
      if (ct.includes('text/html')){
        const text = await res.text();
        throw new Error('HTMLが返りました（JSONではない）: ' + (text.slice(0,80).replace(/\s+/g,' ') + '…'));
      }
      try{
        return await res.json();
      }catch(err){
        const text = await res.text().catch(()=> '');
        throw new Error('JSON parse失敗: ' + String(err) + (text ? (' / head: ' + text.slice(0,80).replace(/\s+/g,' ') + '…') : ''));
      }
    }

    try{
      return await tryFetch(line.url);
    }catch(primaryErr){
      const fb = FALLBACK[line.key];
      if (!fb) throw primaryErr;
      // フォールバックも失敗したら両方の理由を表示
      try{
        return await tryFetch(fb);
      }catch(fbErr){
        throw new Error(`${primaryErr} / fallback失敗: ${fbErr}`);
      }
    }
  }
  async function update(){
    const key = document.getElementById("lineSel").value;
    const status = document.getElementById("status");
    status.textContent = `更新中… ${new Date().toLocaleTimeString()}`;
    const targets = key === "all" ? LINES : LINES.filter(l=>l.key===key);
    try{
      const results = await Promise.all(targets.map(fetchLine));
      const rows = [];
      results.forEach((data, idx)=>{
        const line = targets[idx];
        let trains = [];
        if (Array.isArray(data)) trains = data;
        else if (data && Array.isArray(data.trains)) trains = data.trains;
        else if (data && Array.isArray(data.Trains)) trains = data.Trains;
        else trains = [];
        trains.forEach(t=>{
          if (!isKaisou(t)) return;
          const lineId = ("train_line_id" in t && t.train_line_id!=null) ? Number(t.train_line_id) : Number(t.line_id);
          rows.push({
            lineKey: line.key,
            trainId: makeTrainDomId(lineId, !!t.up, t.operation_number),
            line: line.name,
            op: opno(t.operation_number, lineId),
            pos: positionLabel(t, line.key),
            dir: t.up ? "上り" : "下り",
            company: companyLabel(t),
            form: formationLabel(t),
            cars: carsLabel(t),
          });
        });
      });
      rows.sort((a,b)=> (a.line.localeCompare(b.line) || a.op.localeCompare(b.op)));
      render(rows);
      status.textContent = `更新: ${new Date().toLocaleTimeString()} / 対象 ${targets.length}路線 / 回送 ${rows.length}本`;
    }catch(e){
      status.textContent = `更新失敗: ${e}`;
    }
  }
  function init(){
    // PCで file:// 直開きしている場合は注意喚起（Fetchが失敗しがち）
    if (location.protocol === 'file:'){
      const w = document.getElementById('filewarn');
      if (w) w.style.display = 'block';
    }
    // tableのstickyヘッダがheaderに被らないよう、header高さをCSS変数に反映
    const headerEl = document.querySelector('header');
    if(headerEl){
      const h = headerEl.getBoundingClientRect().height;
      document.documentElement.style.setProperty('--header-h', Math.ceil(h) + 'px');
    }
    buildLineMaps();
    const sel = document.getElementById("lineSel");
    sel.innerHTML = `<option value="all">全路線</option>` + LINES.map(l=>`<option value="${l.key}">${l.name}</option>`).join("");
    const saved = localStorage.getItem("kai_line") || "all";
    sel.value = saved;
    sel.addEventListener("change", ()=>{ localStorage.setItem("kai_line", sel.value); update(); });
    update();
    setInterval(update, UPDATE_INTERVAL_MS);
  }
  document.addEventListener("DOMContentLoaded", init);
</script>
