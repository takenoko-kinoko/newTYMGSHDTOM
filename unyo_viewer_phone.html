<!doctype html>
<html lang="ja">
<head>

  <style>

    .header-top { display: flex; justify-content: space-between; align-items: center; padding: 10px; flex-wrap: wrap; gap: 8px; }

    .header-right { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 6px; }
    
    .btn-action { background: #333; color: #fff; border: none; padding: 8px; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: bold; white-space: nowrap; flex: 1; text-align: center; }

    .tab-area::-webkit-scrollbar { display: none; }
    .tab { flex: 0 0 auto; padding: 8px 16px; cursor: pointer; border: 1px solid #ccc; background: #f5f5f5; border-radius: 20px; font-size: 13px; font-weight: bold; transition: 0.2s; }
    .tab.active { background: #333; color: #fff; border-color: #333; }
    .tab-daily { background: #e8f5e9; border-color: #a5d6a7; color: #2e7d32; }
    .tab-daily.active { background: #2e7d32; color: #fff; border-color: #2e7d32; }

    .filter-bar { background: #fafafa; padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; border-bottom: 1px solid var(--border-color); }
    .filter-item { display: flex; flex-direction: column; gap: 4px; width: calc(50% - 4px); }

    .filter-label { font-weight: bold; color: #777; font-size: 11px; }
    .filter-select { width: 100%; padding: 8px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; background: #fff; font-weight: bold; outline: none; }
    
    .running-toggle { flex: 1; display:flex; justify-content:center; align-items:center; gap:4px; background:#e3f2fd; padding:8px; border-radius:4px; border:1px solid #bbdefb; font-size:12px; font-weight:bold; color:#1976d2; cursor:pointer; }
    .running-toggle input { margin:0; transform:scale(1.2); }

    #container { padding: 10px; max-width: 800px; margin: 0 auto; width: 100%; }
    
    .line-section { margin-bottom: 20px; background: #fff; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); overflow: hidden; border: 1px solid var(--border-color); }
    .line-header { padding: 10px 12px; font-size: 14px; font-weight: bold; color: #fff; letter-spacing: 1px; }
    
    .bg-toyoko { background: var(--toyoko); } .bg-meguro { background: var(--meguro); } .bg-dento { background: var(--dento); }
    .bg-oimachi { background: var(--oimachi); } .bg-shinyoko { background: var(--shinyoko); } .bg-extra { background: var(--extra); }

    .op-box { display: flex; flex-direction: column; border-bottom: 3px solid #eee; background: #fff; }
    .op-left { width: 100%; display: flex; justify-content: space-between; align-items: center; background: #f0f7ff; padding: 8px 12px; border-bottom: 1px solid #c3e0ff; }
    .op-no { font-weight: bold; font-family: monospace; font-size: 16px; color: #1565c0; }
    .src-tag { font-size: 11px; background: #bbdefb; padding: 4px 8px; border-radius: 4px; color: #0d47a1; font-weight: bold; }

    .train-row:last-child { border-bottom: none; }
    .row-active { background: #fffde7; }
    .row-sync-wait { background: #f5f5f5; border-left: 4px solid #9e9e9e; }

    .t-tr { display: flex; align-items: center; gap: 10px; width: 100%; }
    .t-tr-no { font-family: monospace; color: #1976d2; font-weight: bold; font-size: 15px; }
    .t-tr-form { font-size: 12px; color: #4886a5; font-weight: bold; background: #e1f5fe; padding: 3px 8px; border-radius: 4px; border: 1px solid #b3e5fc; }
    .t-tr-sub { font-size: 11px; color: #666; }
    
    .t-dest { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .t-dest-text { font-size: 15px; font-weight: bold; color: #333; display: flex; align-items: center; gap: 6px; }
    .t-delay { color: #d32f2f; font-size: 12px; font-weight: bold; background: #ffebee; padding: 4px 8px; border-radius: 4px; border: 1px solid #ffcdd2; }

    .t-pos strong { color: #1976d2; margin-right: 4px; }

    .t-hist::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
    
    .hist-item { background: #f5f5f5; padding: 6px 10px; border-radius: 4px; font-size: 12px; border: 1px solid #ddd; display: inline-flex; align-items: center; gap: 4px; }
    .hist-item.is-ekikan { background: transparent; border: none; color: #888; font-size: 11px; padding: 2px 4px; }
    .hist-item.live-badge { background: #e3f2fd; border-color: #1976d2; color: #1565c0; font-weight: bold; }
    .hist-item strong { color: #444; }
    .tentative-mark { color: #d32f2f; font-weight: bold; font-size: 11px; margin-left: 1px; }

</head>

<div id="sticky-header">

</div>

      let tHtmlArr = [];
      let processedLiveTnos = new Set();
      
      if (u && u.trains) {

            const tA = (hA && hA.length>0) ? getTv(hA[0].t) : 9999; const tB = (hB && hB.length>0) ? getTv(hB[0].t) : 9999;

                let tvHist = getTv(lastH.t); let tvLive = getTv(liveInfo.t);
                let diff = Math.abs(tvLive - tvHist); if (diff > 1440 - 180) diff = 1440 - diff;
                
                if (diff <= 180) {
                    isRunning = true; currentPosSt = liveInfo.st; currentPosT = liveInfo.t; currentDelay = liveInfo.delay;
                    processedLiveTnos.add(t.trainNo);
                    if (lastH.st !== currentPosSt) showLiveBadge = true; 
                }
            }
            
            if (!isRunning) { if (t.lastSeen && (Date.now() - t.lastSeen < 300000)) isRunning = true; }
            if (showRunningOnly && !isRunning) return;
            hasContent = true; 
            
            let formTag = "";
            if (currentView === 'daily' || currentView.startsWith('custom_')) {
                if (aff || orch) {
                    let dispText = useFmt ? `${fObj.fNo}` : `${orch}`;
                    if (g.id === 'oimachi') { if (dispText) formTag = `<div class="t-tr-form">${dispText}</div>`; } 
                    else { let affPart = fObj.dispAff ? `[${fObj.dispAff}] ` : ""; formTag = `<div class="t-tr-form">${affPart}${dispText}</div>`; }
                }
            }
            
            let remarksTag = "";
            if (t.remarks && t.remarks.trim() !== "") {
                remarksTag = `<div style="font-size:11px; color:#555; background:#fff9c4; padding:2px 6px; border-radius:4px; margin-top:4px; border:1px solid #fff59d; display:inline-block; max-width:100%; white-space:normal; word-break:break-all;">✎ ${t.remarks}</div>`;
            }

            let hHtmlArr = [`<div class="t-hist">`];
            t.history.forEach((h, i) => {
              const lColor = ST_COLOR_MAP[h.st] || `var(--${g.id.replace('extra_tymg','extra').replace('extra_dtom','extra')})`;
              const isEkikan = h.st.includes("駅間");
              const style = !isEkikan ? `border-color:${lColor};` : ``;
              const cls = `hist-item ${isEkikan ? 'is-ekikan' : ''}`;
              
              let delayMark = "";
              if (h.delay > 0) { delayMark = (currentView === 'daily' || currentView.startsWith('custom_')) ? `<sup class="tentative-mark">⁺${h.delay}</sup>` : `<sup class="tentative-mark">*</sup>`; }
              hHtmlArr.push(`<span class="${cls}" style="${style}"><strong>${h.t}${delayMark}</strong> ${h.st}</span>`);
              if(i < t.history.length-1) hHtmlArr.push(`<span style="color:#aaa; font-size:10px;">▶</span>`);
            });
            if (showLiveBadge) {
                let liveDelayMark = currentDelay > 0 ? `<sup class="tentative-mark">⁺${currentDelay}</sup>` : "";
                hHtmlArr.push(`<span style="color:#aaa; font-size:10px; margin:0 4px;">▶</span><span class="hist-item live-badge"><strong>${currentPosT}${liveDelayMark}</strong> ${currentPosSt} <span style="font-size:10px;">(Live)</span></span>`);
            }
            hHtmlArr.push(`</div>`);

            const dispTrainNo = t.trainNo ? `${t.trainNo.substring(0,3)}-${t.trainNo.substring(3)}` : "不明";
            let badgeText = dKind; if (dKind === "F") badgeText = "Fラ"; else if (dKind === "B") badgeText = "B各停"; else if (dKind === "G") badgeText = "G各停"; else if (dKind === "Sトレイン") badgeText = "S";
            let dateTag = (g.id.startsWith('extra') && t.date && currentView !== 'daily') ? `<div class="t-tr-sub">(${t.date})</div>` : "";

            let posText = ""; let badgeDelay = 0;
            if (isRunning) {
                badgeDelay = currentDelay > 0 ? currentDelay : (!showLiveBadge && t.history[t.history.length-1].delay > 0 ? t.history[t.history.length-1].delay : 0);
                posText = `<strong>${currentPosT || t.history[t.history.length-1].t}</strong> ${currentPosSt || t.history[t.history.length-1].st}`;
            } else {
                badgeDelay = t.history[t.history.length-1].delay || 0;
                posText = `<strong>${t.history[t.history.length-1].t}</strong> ${t.history[t.history.length-1].st}`;
            }
            if (isTodayDaily && !isRunning) posText = ''; 

            let badgeDelayHtml = "";
            if (badgeDelay > 0 && (currentView === 'daily' || currentView.startsWith('custom_'))) badgeDelayHtml = `<span class="t-delay">${badgeDelay}分遅れ</span>`;

            let rowClass = isRunning ? 'row-active' : '';

            tHtmlArr.push(`<div class="train-row ${rowClass}">
              <div class="t-basic">
                <div class="t-tr"><div class="t-tr-no">${dispTrainNo}</div>${formTag}${dateTag}</div>
                <div class="t-dest">
                  <div class="t-dest-text"><span class="kind-badge kind-${dKind}">${badgeText}</span>${t.dest}${t.dest.endsWith('線')?'直通':'行'}</div>
                  ${badgeDelayHtml}
                  ${remarksTag}
                </div>
              </div>
              <div class="t-pos">${posText}</div>
              ${hHtmlArr.join('')}
            </div>`);
          });
      }

      // 未保存のライブ列車を表示
      Object.keys(liveTrainsForOp).forEach(tNo => {
          if (!processedLiveTnos.has(tNo)) {
              const liveInfo = liveTrainsForOp[tNo];
              if(secF !== "all" && liveInfo.sourceName !== secF) return;
              if(kindF !== "all" && liveInfo.kind !== kindF && !(kindF==='特急_all' && (liveInfo.kind==='特急'||liveInfo.kind==='F'))) return;
              if(destF !== "all" && liveInfo.dest !== destF) return;
              
              let isDaiso = false;
              if (liveInfo.affiliation && label) {
                  const opAlphaMatch = label.match(/[A-Za-z]/);
                  if (opAlphaMatch) {
                      const affGroup = getAffiliationGroup(g.id, liveInfo.affiliation); 
                      if (affGroup && opAlphaMatch[0] !== affGroup) isDaiso = true;
                  }
              }
              if (daisoF && !isDaiso) return;

              let fObj = getFormationString(g.id, liveInfo.affiliation, liveInfo.orchestration, useFmt);
              hasContent = true;
              
              let formTag = "";
              if (liveInfo.affiliation || liveInfo.orchestration) {
                  let dispText = useFmt ? fObj.fNo : liveInfo.orchestration;
                  if (g.id === 'oimachi') { if (dispText) formTag = `<div class="t-tr-form">${dispText}</div>`; } 
                  else { let affPart = fObj.dispAff ? `[${fObj.dispAff}] ` : ""; formTag = `<div class="t-tr-form">${affPart}${dispText}</div>`; }
              }
              
              let badgeText = liveInfo.kind; if (badgeText === "F") badgeText = "Fラ"; else if (badgeText === "B") badgeText = "B各停"; else if (badgeText === "G") badgeText = "G各停"; else if (badgeText === "Sトレイン") badgeText = "S";
              let posText = `<strong>${liveInfo.t}</strong> ${liveInfo.st}`;
              let badgeDelay = liveInfo.delay || 0;
              let badgeDelayHtml = badgeDelay > 0 ? `<span class="t-delay">${badgeDelay}分遅れ</span>` : "";
              let liveDelayMark = badgeDelay > 0 ? `<sup class="tentative-mark">⁺${badgeDelay}</sup>` : "";

              tHtmlArr.push(`<div class="train-row row-sync-wait">
                <div class="t-basic">
                  <div class="t-tr">
                      <div class="t-tr-no">${tNo.substring(0,3)}-${tNo.substring(3)}</div>
                      ${formTag}
                      <div class="t-tr-sub" style="color:#9e9e9e; font-weight:bold;">(待機中)</div>
                  </div>
                  <div class="t-dest">
                    <div class="t-dest-text"><span class="kind-badge kind-${liveInfo.kind}">${badgeText}</span>${liveInfo.dest}${liveInfo.dest.endsWith('線')?'直通':'行'}</div>
                    ${badgeDelayHtml}
                  </div>
                </div>
                <div class="t-pos">${posText}</div>
                <div class="t-hist">
                    <span class="hist-item" style="border-color:#9e9e9e;"><strong>${liveInfo.t}${liveDelayMark}</strong> ${liveInfo.st}</span>
                </div>
              </div>`);
          }
      });
      
      if(tHtmlArr.length > 0) {
        groupHtmlArr.push(`<div class="op-box">
          <div class="op-left">
            <div class="op-no">${label || "不明"}</div>
            ${g.id.startsWith('extra')?`<div class="src-tag">from ${srcName}</div>`:''}
          </div>
          <div class="op-right">${tHtmlArr.join('')}</div>
        </div>`);
      }
    });
    if(hasContent) {
        groupHtmlArr.push("</div></div>");
        htmlArr.push(groupHtmlArr.join(''));
    }
  });
  
  let finalHtml = htmlArr.join('');
  if (!finalHtml) finalHtml = "<div style='padding:40px; text-align:center; color:#888; font-weight:bold;'>指定した条件に一致する列車はありません。</div>";
  
  // DOM更新負荷を軽減
  if (lastRenderedState !== finalHtml) {
      if (container) container.innerHTML = finalHtml;
      lastRenderedState = finalHtml;
  }
}

// =========================================
// ライブAPI取得 (10秒ごとの軽量ループ)
// =========================================
async function fetchLiveApiData() {
  if (isFetchingApi) return; 
  isFetchingApi = true;
  const now = new Date();
  let targetDateForCalc = new Date(now.getTime() - 4 * 60 * 60 * 1000);
  let autoInfo = getAutoDayType(targetDateForCalc); let dayType = autoInfo.type;

  let newLiveCache = {}; 
  try {
      for(let api of API_ENDPOINTS) {
          const controller = new AbortController(); 
          const timeoutId = setTimeout(() => controller.abort(), 8000);
          const res = await fetch(`${api.url}?t=${Date.now()}`, { cache: 'no-store', signal: controller.signal });
          clearTimeout(timeoutId);
          if (!res.ok) continue;
          
          const text = await res.text();
          const data = JSON.parse(text);
          if (!data || !data.trains) continue;
          
          data.trains.forEach(t => {
              if (!t.train_number || t.train_number === "0") return;
              let rawOp = String(t.operation_number || "0"); let rawTr = String(t.train_number || "0");
              if (rawOp === "09999900" || rawTr === "09999900") return;
              let tNo = ""; let opNo = "";
              if (rawOp.length === 8 && rawOp !== "09999900") { tNo = rawOp.substring(1, 7); opNo = tNo.substring(0, 3); } 
              else if (rawTr.length === 8 && rawTr !== "09999900") { tNo = rawTr.substring(1, 7); opNo = rawOp.padStart(3, '0'); } 
              else { tNo = rawTr.padStart(6, '0'); opNo = rawOp.padStart(3, '0'); }
              if (tNo === "999000" || tNo === "999900") return;
              
              const stName = STATION_MAP[t.station_id] || (t.section_id ? `駅間(${t.section_id})` : "不明");
              if (api.id === 'meguro' && tNo === "999090" && stName.includes("大岡山")) return;

              const info = getUnyoInfoStr(opNo, api.id, dayType); if (!info) return;

              const opKey = `${info.homeLine}_${info.label}`;
              const destMapToUse = ['toyoko', 'meguro', 'shinyokohama'].includes(api.id) ? DEST_MAP_TYMG : DEST_MAP_DTOM;
              const destStr = cleanDestName(t.destination_station_code, destMapToUse);
              const dispKind = getDispKind(t.kind || "普", info.homeLine);
              const delay = parseInt(t.delay_time, 10) || 0;
              const actualTimeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

              if (!newLiveCache[opKey]) newLiveCache[opKey] = {};
              newLiveCache[opKey][tNo] = {
                  trainNo: tNo, kind: dispKind, dest: destStr,
                  sourceName: {toyoko:"東横線", meguro:"目黒線", shinyokohama:"新横浜線", dento:"田園都市線", oimachi:"大井町線"}[api.id],
                  st: stName, t: actualTimeStr, delay: delay,
                  affiliation: t.affiliation || "", orchestration: t.train_orchestration_number || ""
              };
          });
      }
      
      apiLiveCache = newLiveCache; // キャッシュを更新
      lastApiTime = new Date().toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
      updateStatusDisplay();
      
      // クラウドデータが無いか、または現在見ているのが最新のデータならAPIデータを合成して再描画
      if (!currentView.startsWith("import")) { 
          updateDestDropdown(); 
          requestAnimationFrame(() => render());
      }
  } catch (err) {
      lastApiTime = "⚠ エラー (自動再試行中)";
      updateStatusDisplay();
  } finally {
      isFetchingApi = false;
      newLiveCache = null; 
  }
}

// =========================================
// クラウド取得処理 (30秒ごとのメモリ解放ループ)
// =========================================
async function fetchFromCloud() {
  if (isFetchingCloud) return;
  isFetchingCloud = true;
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 15000);
    const res = await fetch(GAS_URL + "?t=" + Date.now(), { signal: controller.signal });
    clearTimeout(timeoutId);
    
    if (!res.ok) throw new Error("HTTP " + res.status);
    
    const text = await res.text();
    const data = JSON.parse(text);
    
    if (data) {
      hasReceivedCloudData = true; 
      
      let selectedDaily = null;
      const dailySel = document.getElementById("dailyDateSelect");
      if(dailySel && currentView === 'daily') selectedDaily = dailySel.value;
      if(!selectedDaily) selectedDaily = getDailyKey(new Date());
      
      // ★ 既存の巨大データを完全に捨ててメモリを解放
      logs = null; 
      logs = { weekday: {}, holiday: {}, daily: {}, customViews: [], appConfig: {} };
      
      logs.weekday = data.weekday || {};
      logs.holiday = data.holiday || {};
      logs.customViews = data.customViews || [];
      logs.appConfig = data.appConfig || {};
      
      // ★ 毎日の記録は、現在選んでいる日付だけフルで残し、それ以外は空にする（超軽量化）
      if (data.daily) {
          const todayKey = getDailyKey(new Date());
          Object.keys(data.daily).forEach(k => {
              if (k === selectedDaily || k === todayKey) {
                  logs.daily[k] = data.daily[k];
              } else {
                  logs.daily[k] = { _empty: true };
              }
          });
      }
      
      updateTabs(); updateNotice();
      
      if (!currentView.startsWith("import")) {
        updateContextUI(selectedDaily); 
        updateDestDropdown(); 
        requestAnimationFrame(() => render());
      }
      
      lastCloudTime = new Date().toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
      updateStatusDisplay();
    }
  } catch (err) {
    lastCloudTime = "⚠ 取得エラー (自動再試行中)";
    updateStatusDisplay();
  } finally {
    isFetchingCloud = false;
  }
}

// =========================================
// 安全な直列同期ループ
// =========================================
async function cloudLoop() {
    if (!isFetchingCloud && !isFetchingApi) await fetchFromCloud();
    setTimeout(cloudLoop, 30000); // 30秒に1回
}

async function apiLoop() {
    if (!isFetchingApi && !isFetchingCloud) await fetchLiveApiData();
    setTimeout(apiLoop, 10000); // 10秒に1回
}

function initCloudSync() {
  document.getElementById("cloudStatus").textContent = "☁️ 初期データ取得中... (お待ちください)";
  cloudLoop();
  setTimeout(apiLoop, 2000); // APIループは2秒ずらして開始
}

document.addEventListener("DOMContentLoaded", async () => {
  await loadHolidays();
  changeTab('daily'); 
  initCloudSync(); 
});
</script>
