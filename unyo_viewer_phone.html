<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
  <title>東急線 運用ビューワー（Mobile完全互換版）</title>
  <style>
    :root { 
      --toyoko: #d90240; --meguro: #009cd3; --dento: #01aa8f; 
      --oimachi: #f08d41; --shinyoko: #890d84; --extra: #607d8b; 
      --bg-color: #eef1f5; --text-color: #333; --border-color: #ddd;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: "Helvetica Neue", Arial, sans-serif; margin: 0; background: var(--bg-color); font-size: 13px; color: var(--text-color); -webkit-text-size-adjust: 100%; overflow-x: hidden; }
    
    #sticky-header { position: sticky; top: 0; z-index: 1000; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.1); border-top: 4px solid #1976d2; width: 100%; }
    .header-top { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; flex-wrap: nowrap; overflow: hidden; gap: 10px; }
    h1 { margin: 0; font-size: 16px; color: #222; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; flex-wrap: nowrap; }
    
    .btn-action { background: #333; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: bold; white-space: nowrap; flex-shrink: 0; transition: 0.2s; }
    .btn-action:hover { opacity: 0.8; }
    .btn-export { background: #1976d2; }
    .btn-sync { background: #ff9800; color: #fff; }
    .btn-reset { background: #c62828; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: bold; }
    
    #cloudStatus { font-family: monospace; font-size: 11px; color: #01aa8f; font-weight: bold; background: #e8f5e9; padding: 6px 8px; border-radius: 4px; text-align: center; white-space: nowrap; flex-shrink: 0; min-width: 140px; }

    #noticeBar { background: #ffebee; color: #d32f2f; padding: 12px 20px; font-size: 16px; font-weight: bold; border-bottom: 1px solid #ffcdd2; overflow: hidden; display: none; letter-spacing: 1px; }
    .marquee-container { width: 100%; overflow: hidden; white-space: nowrap; box-sizing: border-box; }
    .marquee-content { display: inline-block; padding-left: 100%; animation: marquee 20s linear infinite; }
    @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

    .tab-area { display: flex; gap: 8px; overflow-x: auto; padding: 10px 15px; -webkit-overflow-scrolling: touch; scrollbar-width: none; border-bottom: 1px solid var(--border-color); background: #fff; }
    .tab-area::-webkit-scrollbar { display: none; }
    .tab { flex: 0 0 auto; padding: 8px 16px; cursor: pointer; border: 1px solid #ccc; background: #f5f5f5; border-radius: 20px; font-size: 13px; font-weight: bold; transition: 0.2s; }
    .tab.active { background: #333; color: #fff; border-color: #333; }
    .tab-daily { background: #e8f5e9; border-color: #a5d6a7; color: #2e7d32; }
    .tab-import { background: #fff3e0; border-color: #ffcc80; color: #ef6c00; }
    .tab-custom { background: #e1bee7; border-color: #f48fb1; color: #880e4f; }
    .tab-custom.active, .tab-daily.active, .tab-import.active { background: #333; color: #fff; border-color: #333; }

    .filter-select { padding: 6px 8px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; font-weight: bold; min-width: 100px; max-width: 140px; }
    
    #container { padding: 15px; max-width: 1200px; margin: 0 auto; width: 100%; padding-bottom: 90px; }
    .line-section { margin-bottom: 25px; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow: hidden; border: 1px solid var(--border-color); }
    .line-header { padding: 10px 15px; font-size: 15px; font-weight: bold; color: #fff; letter-spacing: 1px; }
    .line-body { padding: 10px; }
    
    .bg-toyoko { background: var(--toyoko); } .bg-meguro { background: var(--meguro); } .bg-dento { background: var(--dento); }
    .bg-oimachi { background: var(--oimachi); } .bg-shinyoko { background: var(--shinyoko); } .bg-extra { background: var(--extra); }

    .op-box { display: flex; align-items: stretch; border: 1px solid #e0e0e0; border-radius: 6px; margin-bottom: 10px; overflow: hidden; }
    .op-left { width: 85px; background: #f8f9fa; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; flex-shrink: 0; }
    .op-no { font-weight: bold; font-family: monospace; font-size: 18px; color: #d32f2f; text-align: center; }
    .src-tag { font-size: 10px; background: #ddd; padding: 2px 4px; border-radius: 4px; color: #555; margin-top: 6px; text-align: center; line-height: 1.2; word-break: break-all;}
    
    .op-right { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #fff; }
    
    .train-row { display: flex; align-items: center; padding: 10px 12px; border-bottom: 1px solid #f0f0f0; width: 100%; gap: 10px; transition: background 0.2s; flex-wrap: nowrap; overflow: hidden; }
    .train-row:last-child { border-bottom: none; }
    .row-active { background: #fffde7; }
    .row-sync-wait { background: #f5f5f5; border-left: 4px solid #9e9e9e; }

    .t-basic { display: flex; align-items: center; flex-shrink: 0; width: 250px; gap: 8px; white-space: nowrap; }
    .t-tr { width: 65px; flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; }
    .t-tr-no { font-family: monospace; color: #1976d2; font-weight: bold; font-size: 14px; line-height: 1.2; }
    .t-tr-sub { font-size: 10px; color: #666; margin-top: 2px; }
    .t-tr-form { font-size: 11px; color: #4886a5; font-weight: bold; margin-top: 2px; display: inline-block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
    
    .t-dest { flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; overflow: hidden; }
    .t-dest-text { font-size: 14px; font-weight: bold; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
    .t-delay { color: #d32f2f; font-size: 11px; font-weight: bold; background: #ffebee; padding: 2px 6px; border-radius: 4px; display: inline-block; width: max-content; border: 1px solid #ffcdd2; margin-top: 2px; }
    
    .t-pos { width: 140px; font-size: 13px; color: #222; flex-shrink: 0; padding-right: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-right: 1px dashed #eee; }
    .t-pos strong { color: #1976d2; margin-right: 4px; }
    
    .t-hist { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; display: flex; align-items: center; padding-bottom: 6px; -webkit-overflow-scrolling: touch; }
    .t-hist::-webkit-scrollbar { height: 6px; display: block; }
    .t-hist::-webkit-scrollbar-track { background: transparent; }
    .t-hist::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
    
    .hist-item { background: #f5f5f5; padding: 4px 8px; border-radius: 4px; font-size: 11px; white-space: nowrap; border-bottom: 2px solid #ccc; display: inline-flex; align-items: center; gap: 4px; position: relative; margin-right: 14px; cursor: pointer; }
    .hist-item::after { content: '▶'; position: absolute; right: -12px; color: #aaa; font-size: 9px; top: 50%; transform: translateY(-50%); }
    .hist-item:last-child::after { content: ''; }
    
    .hist-item.is-ekikan { background: transparent; border: none; color: #888; font-size: 10px; padding: 2px 4px; }
    .hist-item.live-badge { background: #e3f2fd; border-color: #1976d2; color: #1565c0; font-weight: bold; margin-right: 0; }
    .hist-item.live-badge::after { content: ''; } 
    .hist-item strong { color: #444; }
    .tentative-mark { color: #d32f2f; font-weight: bold; font-size: 11px; margin-left: 1px; }

    .kind-badge { display: inline-block; min-width: 44px; padding: 3px 4px; border-radius: 3px; font-size: 11px; font-weight: bold; color: #fff; margin-right: 4px; text-align: center; box-sizing: border-box; line-height: 1; flex-shrink:0; }
    .kind-各停, .kind-B { background: #1976d2; } .kind-G, .kind-準急 { background: #4caf50; } 
    .kind-急行 { background: #d90240; } .kind-特急, .kind-F { background: #ff9800; } 
    .kind-通特 { background: #fff; border: 1px solid #d90240; color: #d90240; padding: 1px 0;} 
    .kind-Sトレイン { background: #fff; color: #009688; border: 1px solid #009688; } .kind-回送 { background: #757575; }

    /* ★ 両数バッジ */
    .cars-badge { font-size:10px; color:#fff; background:#1976d2; padding:1px 3px; border-radius:3px; margin-left:4px; display:inline-block; vertical-align:middle; line-height:1; }

    @media (max-width: 800px) {
      .header-top { padding: 8px 10px; gap: 5px; flex-wrap: wrap; }
      h1 { font-size: 15px; }
      .btn-action { padding: 5px 8px; font-size: 11px; }
      #cloudStatus { width: auto; font-size: 10px; padding: 5px 4px; }
      .tab-area { padding: 8px 10px 5px 10px; }
      .filter-select { font-size: 12px; padding: 5px 6px; }
      .op-box { flex-direction: column; }
      .op-left { width: 100%; flex-direction: row; justify-content: flex-start; gap: 15px; border-right: none; border-bottom: 1px solid #e0e0e0; padding: 8px 15px; box-sizing: border-box; align-items: center; }
      .op-no { font-size: 16px; margin: 0; }
      .src-tag { margin-top: 0; font-size: 11px; margin-left: auto; }
      .train-row { flex-direction: column; align-items: stretch; gap: 8px; padding: 12px; }
      .t-basic { width: 100%; border-bottom: 1px dashed #eee; padding-bottom: 8px; margin-bottom: 0; }
      .t-dest-text { font-size: 15px; white-space: normal; line-height: 1.3; }
      .t-pos { width: 100%; margin-top: 2px; font-size: 13px; color: #333; border-right: none; padding-right: 0; }
      .t-hist { width: 100%; padding-bottom: 8px; overflow-x: auto; white-space: nowrap; }
      .t-hist::-webkit-scrollbar { display: none; } 
    }

    /* --- FAB（浮遊フィルターボタン） --- */
    .fab { position: fixed; bottom: 20px; right: 20px; background: #1976d2; color: #fff; width: 56px; height: 56px; border-radius: 28px; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 1500; cursor: pointer; border: none; font-size: 24px; }
    .fab:active { background: #115293; transform: scale(0.95); }

    /* --- モーダル全般 --- */
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:9999; justify-content:center; align-items:center; padding:0; }
    .tt-modal-header { background: #1976d2; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;}
    .tt-modal-header h3 { margin: 0; font-size: 16px; color: #fff; font-weight: bold; letter-spacing: 1px; }
    .tt-modal-header .btn-close { background: rgba(255,255,255,0.2); color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; }

    /* --- フィルターモーダル --- */
    .filter-modal-box { background:#fff; width:100%; height:85vh; margin-top:auto; border-radius:12px 12px 0 0; display:flex; flex-direction:column; box-shadow:0 -10px 40px rgba(0,0,0,0.3); }
    .fm-item { display:flex; flex-direction:column; gap:6px; margin-bottom: 12px;}
    .fm-item label { font-weight:bold; font-size:12px; color:#555; }
    .fm-item select, .fm-item input { padding:10px; font-size:14px; border:1px solid #ccc; border-radius:6px; background:#f9f9f9; font-weight: bold; color: #333; }
    .fm-toggle-row { display:flex; align-items:center; gap:8px; padding:12px; border-radius:6px; font-weight:bold; font-size:14px; color:#333; cursor:pointer; }
    .fm-toggle-row input { transform: scale(1.2); }

    /* --- 時刻表モーダル --- */
    .modal-box { background:#fff; padding:0; border-radius:10px; width:95%; max-width:550px; height:85vh; display:flex; flex-direction:column; box-shadow:0 10px 40px rgba(0,0,0,0.3); overflow:hidden; }
    .tt-controls-area { background: #f8f9fa; padding: 10px 15px; border-bottom: 1px solid #e0e0e0; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;}
    .tt-main-wrapper { display: flex; flex: 1; overflow: hidden; position: relative; }
    .modal-content { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; background:#fafafa; padding-bottom: 30px; margin:0; }
    
    .tt-index-bar { width: 30px; background: #fff; border-left: 1px solid #eee; display: flex; flex-direction: column; z-index: 10; overflow-y: auto; scrollbar-width: none; flex-shrink: 0; }
    .tt-index-bar::-webkit-scrollbar { display: none; }
    .tt-index-btn { flex: 1; min-height: 20px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #777; cursor: pointer; user-select: none; border-bottom: 1px solid #f5f5f5;}
    .tt-index-btn:active { background: #e3f2fd; color: #1976d2; }

    .tt-row { display:flex; padding:12px 10px; border-bottom:1px solid #eee; cursor:pointer; align-items:center; gap:10px; transition:0.2s; background:#fff; }
    .tt-row.is-active { background:#fffde7; border-left:5px solid #fbc02d; }
    .tt-row.is-pass { background:#fdfdfd; }
    .tt-row.is-pass .tt-time { color:#aaa; font-size:15px; }
    .tt-row.is-pass .dest-text { color:#888; }
    
    .tt-time-area { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 55px; flex-shrink: 0; gap: 4px; }
    .tt-time { font-weight:bold; font-size:17px; color:#1976d2; font-family: monospace; letter-spacing: -0.5px; line-height: 1; text-align: center; }
    
    .tt-dir-badge { font-size: 10px; font-weight: bold; border-radius: 3px; padding: 2px 4px; line-height: 1; white-space: nowrap; }
    .tt-dir-up { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
    .tt-dir-down { background: #e3f2fd; color: #1565c0; border: 1px solid #bbdefb; }

    .tt-info { flex:1; display:flex; flex-direction:column; min-width: 0; }
    .dest-text { color: #111; font-size: 14px; font-weight: bold; white-space: nowrap; }
    
    .extra-badge { font-size:10px; background:#9c27b0; color:#fff; padding:2px 4px; border-radius:3px; font-weight:bold; }
    .terminal-badge { font-size:10px; background:#d32f2f; color:#fff; padding:2px 4px; border-radius:3px; font-weight:bold; }
    .active-badge { font-size:10px; background:#fbc02d; color:#333; padding:2px 5px; border-radius:3px; font-weight:bold; margin-left:auto; }
    .pass-badge { font-size:10px; background:#eee; color:#777; padding:2px 4px; border-radius:3px; border:1px solid #ccc; font-weight:bold; }
    
    .highlight-flash { animation: flash-bg 2.5s ease-out; }
    @keyframes flash-bg { 0% { background-color: #ffeb3b; } 100% { background-color: transparent; } }

    .tt-tab-group { display: flex; gap: 6px; flex-wrap: wrap; }
    .tt-tab-btn { border: 1px solid #ccc; background: #fff; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-weight: bold; color: #555; transition: 0.2s; font-size: 12px; }
    .tt-tab-btn.active { background: #333; color: #fff; border-color: #333; }
  </style>
</head>
<body>

<div id="sticky-header">
  <div class="header-top">
    <h1>東急線 運用ビューワー</h1>
    <div class="header-right">
      <button class="btn-action" onclick="location.href='index.html'+location.search">路線図</button>
      <button class="btn-action btn-sync" onclick="forceSync()">🔄 強制同期</button>
      <div id="cloudStatus">☁️ 待機中</div>
    </div>
  </div>

  <div id="noticeBar"><div class="marquee-container"><div class="marquee-content" id="noticeText"></div></div></div>

  <div class="tab-area" id="tabArea">
    <button id="tab_weekday" class="tab" onclick="window.changeTab('weekday')" style="display:none;">平日累計</button>
    <button id="tab_holiday" class="tab" onclick="window.changeTab('holiday')" style="display:none;">土休累計</button>
    <button id="tab_daily" class="tab tab-daily" onclick="window.changeTab('daily')" style="display:none;">毎日記録</button>
    <button id="tab_import1" class="tab tab-import" onclick="window.changeTab('import1')">読込1</button>
    <button id="tab_import2" class="tab tab-import" onclick="window.changeTab('import2')">読込2</button>
    <button id="tab_import3" class="tab tab-import" onclick="window.changeTab('import3')">読込3</button>
  </div>
</div>

<div id="container"></div>

<button class="fab" onclick="document.getElementById('filterModal').style.display='flex'">
  <svg viewBox="0 0 24 24" width="28" height="28" fill="white"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg>
</button>

<div id="filterModal" class="modal-overlay" onclick="if(event.target===this) this.style.display='none'">
  <div class="filter-modal-box" style="max-width: 600px; margin: auto auto 0 auto;">
    <div class="tt-modal-header">
      <h3 style="margin:0;">詳細フィルター</h3>
      <button class="btn-close" style="background:transparent; font-size:24px; padding:0 10px;" onclick="document.getElementById('filterModal').style.display='none'">×</button>
    </div>
    <div class="modal-content" style="padding:15px; display:flex; flex-direction:column; background:#fff;">
      
      <div id="contextFilters" class="fm-item" style="display:none;"></div>
      
      <div class="fm-item">
        <label>路線:</label>
        <select id="lineFilter" class="filter-select" style="width:100%; max-width:none;" onchange="window.updateFormDropdown(); window.render();">
          <option value="all">全路線</option>
          <option value="toyoko">東横線</option>
          <option value="meguro">目黒線</option>
          <option value="dento">田園都市線</option>
          <option value="oimachi">大井町線</option>
          <option value="extra_tymg">非定期(東)</option>
          <option value="extra_dtom">非定期(田)</option>
        </select>
      </div>
      
      <div class="fm-item">
        <label>運番検索:</label>
        <input type="text" id="opNumSearch" autocomplete="off" class="filter-select" style="width:100%; max-width:none;" placeholder="例: 01K" oninput="window.updateFormDropdown(); window.render();">
      </div>

      <div class="fm-item">
        <label>区間:</label>
        <select id="sectionFilter" class="filter-select" style="width:100%; max-width:none;" onchange="window.updateDestDropdown(); window.updateFormDropdown(); window.render();">
          <option value="all">すべての区間</option>
          <optgroup label="系統別">
            <option value="system_tymg">東横・目黒線系統</option>
            <option value="system_dtom">田都・大井町線系統</option>
          </optgroup>
          <optgroup label="区間別">
            <option value="東横線">東横線</option>
            <option value="目黒線">目黒線</option>
            <option value="新横浜線">新横浜線</option>
            <option value="田園都市線">田園都市線</option>
            <option value="大井町線">大井町線</option>
          </optgroup>
        </select>
      </div>

      <div class="fm-item">
        <label>運用会社:</label>
        <select id="companyFilter" class="filter-select" style="width:100%; max-width:none;" onchange="window.updateFormDropdown(); window.render()">
          <option value="all">すべて</option>
          <option value="K">東急車 (K)</option>
          <option value="S">メトロ車 (S)</option>
          <option value="T">東武/都営 (T)</option>
          <option value="M">西武/埼玉高速 (M)</option>
          <option value="G">相鉄車 (G)</option>
          <option value="O100">大井町 100〜129番台</option>
          <option value="O130">大井町 130番台〜</option>
        </select>
      </div>

      <div class="fm-item">
        <label>種別:</label>
        <select id="kindFilter" class="filter-select" style="width:100%; max-width:none;" onchange="window.updateFormDropdown(); window.render()">
          <option value="all">すべて表示</option>
          <option value="各停">各停</option>
          <option value="B">B各停</option>
          <option value="G">G各停</option>
          <option value="準急">準急</option>
          <option value="急行">急行</option>
          <option value="通特">通特</option>
          <option value="特急_all">Fラ/特急</option>
          <option value="特急">特急</option>
          <option value="F">Fラ</option>
          <option value="Sトレイン">Sトレイン</option>
          <option value="回送">回送</option>
        </select>
      </div>

      <div class="fm-item">
        <label>行先:</label>
        <select id="destFilter" class="filter-select" style="width:100%; max-width:none;" onchange="window.updateFormDropdown(); window.render()"></select>
      </div>

      <div class="fm-item" id="formFilterArea" style="display:none;">
        <label>編成:</label>
        <select id="formFilterSel" class="filter-select" style="width:100%; max-width:none;" onchange="window.render()"></select>
      </div>
      
      <div style="display:flex; flex-direction:column; gap:10px; margin-top:10px;">
        <label class="fm-toggle-row" style="background:#fff3e0; border:1px solid #ffcc80;"><input type="checkbox" id="daisoFilter" onchange="window.updateFormDropdown(); window.render()"> 代走のみ表示</label>
        <label class="fm-toggle-row" style="background:#e8eaf6; border:1px solid #9fa8da;"><input type="checkbox" id="formatFilter" onchange="window.updateFormDropdown(); window.render();" checked> 🚃 編成表記を有効化</label>
        <label class="fm-toggle-row" style="background:#e8f5e9; border:1px solid #a5d6a7;"><input type="checkbox" id="runningFilter" onchange="window.updateFormDropdown(); window.render()"> 🚄 走行中のみ表示</label>
      </div>

function calculateSourceName(tr, hl) {
    if (!tr || !tr.history) return tr?.sourceName || "不明";
    
    // --- 溝の口以西の判定 ---
    const dentoWestStations = ["梶が谷", "宮崎台", "宮前平", "鷺沼", "たまプラーザ", "あざみ野", "江田", "市が尾", "藤が丘", "青葉台", "田奈", "長津田", "つくし野", "すずかけ台", "南町田", "南町田グランベリーパーク", "つきみ野", "中央林間", "駅間(81)", "駅間(82)", "駅間(83)", "駅間(84)", "駅間(85)", "駅間(86)", "駅間(87)", "駅間(88)", "駅間(89)", "駅間(90)", "駅間(91)", "駅間(92)", "駅間(93)", "駅間(94)", "駅間(95)", "駅間(96)", "駅間(97)", "駅間(108)", "駅間(109)", "駅間(110)", "駅間(111)", "駅間(112)", "駅間(113)", "駅間(114)", "駅間(115)", "駅間(116)", "駅間(117)", "駅間(118)", "駅間(119)", "駅間(120)", "駅間(121)", "駅間(122)", "駅間(123)", "駅間(124)"];
    let hasDentoWest = tr.history.some(h => dentoWestStations.includes(h.st));
    
    if (hl === 'dento' || hl === 'oimachi' || hl === 'extra_dtom') {
        if (hasDentoWest) return "田園都市線";
        let hasOimachiTrack = tr.history.some(h => (h.st === "二子玉川" && h.track === "3") || (h.st === "溝の口" && h.track === "2"));
        let hasDentoTrack = tr.history.some(h => (h.st === "溝の口" || h.st === "二子玉川") && (h.track === "1" || h.track === "4"));
        let hasDentoSection = tr.history.some(h => ["駅間(78)", "駅間(79)", "駅間(80)", "駅間(105)", "駅間(106)", "駅間(107)"].includes(h.st));
        
        if (hasOimachiTrack) return "大井町線";
        if (hasDentoTrack || hasDentoSection) return "田園都市線";
        
        return (hl === 'oimachi') ? "大井町線" : "田園都市線";
    } else {
        let hasShinYoko = tr.history.some(h => ["新横浜", "新綱島"].some(s => h.st.includes(s)));
        if (hasShinYoko) return "新横浜線";
        
        let baseLine = "東横線";
        if (hl === 'meguro') baseLine = "目黒線";
        else if (hl === 'shinyokohama') baseLine = "新横浜線";
        else if (hl === 'extra_tymg') {
            if (tr.trainNo && String(tr.trainNo).match(/^[2-6]/)) baseLine = "目黒線";
        }
        return baseLine;
    }
}

function getTv(tStr) { if(!tStr) return -1; let [h, m] = tStr.split(':').map(Number); if(isNaN(h) || isNaN(m)) return -1; if(h < 4) h += 24; return h * 60 + m; }
function getDailyKey(d = new Date()) { const dt = new Date(d.getTime() - 4 * 60 * 60 * 1000); return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`; }

function getAutoDayType(targetDate) {
  const dKey = `${targetDate.getFullYear()}-${String(targetDate.getMonth()+1).padStart(2,'0')}-${String(targetDate.getDate()).padStart(2,'0')}`;
  const isWeekend = targetDate.getDay() === 0 || targetDate.getDay() === 6;
  if (publicHolidays[dKey]) return { type: 'holiday', reason: publicHolidays[dKey] };
  if (isWeekend) return { type: 'holiday', reason: '土日' }; return { type: 'weekday', reason: '平日' };
}

function cleanDestName(rawDestCode, destMap) { return destMap[rawDestCode] || "不明"; }

function getDispKind(rawKind, groupId) {
  if (!rawKind) return "各停"; rawKind = String(rawKind); 
  if (rawKind === "B" || (groupId === 'oimachi' && (rawKind === "普" || rawKind === "普通" || rawKind === "各" || rawKind === "各停"))) return "B";
  if (rawKind === "普" || rawKind === "普通" || rawKind === "各" || rawKind === "各停") return "各停";
  if (rawKind.includes("通勤特急") || rawKind.includes("通特") || rawKind === "通") return "通特";
  if (rawKind.includes("F") || rawKind.includes("Ｆ")) return "F"; 
  if (rawKind.includes("特急") || rawKind === "特") return "特急";
  if (rawKind.includes("急行") || rawKind === "急") return "急行";
  if (rawKind.includes("準急") || rawKind === "準") return "準急";
  if (rawKind.includes("回送") || rawKind === "回") return "回送";
  if (rawKind === "G" || rawKind === "Ｇ") return "G";
  if (rawKind.includes("S") || rawKind.includes("Ｓ") || rawKind.includes("Sトレイン") || rawKind.includes("Ｓトレイン")) return "Sトレイン";
  return rawKind;
}

function getUnyoInfoStr(opNo, tNo, lineKey, dayType) {
  const opRaw = parseInt(opNo, 10); if (opRaw === 0 || isNaN(opRaw)) return null;
  const H = opNo.charAt(0); const XX_str = opNo.substring(1); const XX = parseInt(XX_str, 10);
  let hl = "extra"; let label = String(opRaw); let detectedHl = "extra"; let detectedSys = "";
  
  if (['toyoko', 'meguro', 'shinyokohama'].includes(lineKey)) {
    if (H==='0') { detectedHl="toyoko"; detectedSys="K"; label=XX_str+"K"; } 
    else if (H==='1') { detectedHl="toyoko"; detectedSys="M"; label=XX_str+"M"; } 
    else if (H==='7') { detectedHl="toyoko"; detectedSys="S"; label=XX_str+"S"; } 
    else if (H==='8') { detectedHl="toyoko"; detectedSys="T"; label=XX_str+"T"; } 
    else if (H==='9') { detectedHl="toyoko"; detectedSys="G"; label=XX_str+"G"; } 
    else if (H==='2') { detectedHl="meguro"; detectedSys="K"; label=XX_str+"K"; } 
    else if (H==='3') { detectedHl="meguro"; detectedSys="S"; label=XX_str+"S"; } 
    else if (H==='4') { detectedHl="meguro"; detectedSys="T"; label=XX_str+"T"; } 
    else if (H==='5') { detectedHl="meguro"; detectedSys="M"; label=XX_str+"M"; } 
    else if (H==='6') { detectedHl="meguro"; detectedSys="G"; label=XX_str+"G"; }
  } else if (['dento', 'oimachi'].includes(lineKey)) {
    if (opRaw>=101 && opRaw<=149) { detectedHl="oimachi"; detectedSys="O"; label=String(opRaw); } 
    else if (opRaw>=181 && opRaw<=183) { detectedHl="dento"; detectedSys="N"; label=String(opRaw); } 
    else if (opRaw>=1 && opRaw<=49) { detectedHl="dento"; detectedSys="K"; label=String(opRaw).padStart(2,'0')+"K"; } 
    else if (opRaw>=50 && opRaw<=99) {
      detectedHl="dento";
      if ([90,92,94,96,98,99].includes(opRaw)) { detectedSys="K"; label=String(opRaw).padStart(2,'0')+"K"; } 
      else { detectedSys=(opRaw%2===1?"S":"T"); label=String(opRaw).padStart(2,'0')+detectedSys; }
    }
  }
  let checkVal = XX; if (detectedHl === 'oimachi' || detectedHl === 'dento') checkVal = opRaw;
  
  let isReg = false;
  if (OP_SETS && OP_SETS[dayType] && OP_SETS[dayType][detectedHl] && OP_SETS[dayType][detectedHl][detectedSys]) {
      isReg = OP_SETS[dayType][detectedHl][detectedSys].includes(checkVal);
  }
  
  if (isReg) { hl = detectedHl; } else {
      if (['toyoko', 'meguro', 'shinyokohama'].includes(lineKey)) { 
          hl = "extra_tymg"; 
          if (lineKey === 'meguro' || detectedHl === 'meguro') { label = tNo ? tNo.substring(0, 3) : String(opRaw).padStart(3, '0'); }
      } else { hl = "extra_dtom"; }
  }
  let srcName = {toyoko:"東横線", meguro:"目黒線", shinyokohama:"新横浜線", dento:"田園都市線", oimachi:"大井町線"}[lineKey] || lineKey;
  if (lineKey === 'shinyokohama') { srcName = (detectedHl === 'toyoko') ? "東横線" : "目黒線"; }
  return { homeLine: hl, label: label, sourceName: srcName };
}

function getAffiliationGroup(lineId, aff) {
    if (!aff) return null;
    let isTobu = aff === "武" || aff.includes("東武");
    let isTokyu = aff === "急" || aff === "み" || aff.includes("東急");
    
    // 東武と東急の判別：「東」だけの場合の文脈処理
    if (aff === "東") {
        if (lineId === 'meguro' || lineId === 'extra_meguro') {
            isTokyu = true;
        } else {
            isTobu = true; // 東横線(toyoko)や田園都市線(dento)などでは「東武」
        }
    }

    let isMetro = aff.includes("メ") || aff.includes("営") || aff.includes("副") || aff.includes("半") || aff.includes("南");
    let isToei = aff.includes("都") || aff.includes("三");
    let isSaitamaSeibu = aff.includes("埼") || aff.includes("西");
    let isSotetsu = aff.includes("相") || aff.includes("G") || aff.includes("Ｇ");

    if (lineId === 'meguro' || lineId === 'extra_meguro') {
        if (isTokyu) return "K";
        if (isMetro) return "S";
        if (isToei) return "T";
        if (isSaitamaSeibu) return "M";
        if (isSotetsu) return "G";
    } else if (lineId === 'dento' || lineId === 'extra_dtom') {
        if (isTokyu) return "K";
        if (isMetro) return "S";
        if (isTobu) return "T";
    } else { // toyoko, shinyokohama, extra_tymg 等
        if (isTokyu) return "K";
        if (isMetro) return "S";
        if (isTobu || isToei) return "T";
        if (isSaitamaSeibu) return "M";
        if (isSotetsu) return "G";
    }
    return null;
}

function getFormationString(lineId, aff, orchStr, useFormat, cars, opLabel) {
    if (!aff && !orchStr) return { dispAff: "", fNo: "" };
    if (!useFormat) return { dispAff: aff, fNo: orchStr }; 

    let opNum = opLabel ? parseInt(opLabel.replace(/[^0-9]/g, ''), 10) : 0;
    
    // 大井町線非定期除外ルール
    if (lineId === 'oimachi' || lineId === 'extra_dtom' || lineId.includes('oimachi')) {
        if (!(opNum >= 101 && opNum <= 137) && !(opNum >= 150 && opNum <= 153)) {
            return { dispAff: aff, fNo: orchStr };
        }
    }
    // 目黒線非定期除外ルール
    if (lineId === 'extra_meguro' || (lineId === 'extra_tymg' && opLabel && opLabel.match(/^[2-6]/))) {
        if (aff === "急" || !aff) {
            return { dispAff: aff, fNo: orchStr };
        }
    }

    let orch = parseInt(orchStr, 10); 
    let orchStrPad = String(orch).padStart(2, '0');
    if (isNaN(orch)) return { dispAff: aff, fNo: orchStr };
    
    let fNo = ""; let dispAff = aff; 

    if (lineId === 'meguro' || lineId === 'extra_meguro' || (lineId === 'extra_tymg' && aff && !aff.includes("急") && !aff.includes("み") && !aff.includes("相") && !aff.includes("武"))) {
        if (aff === "急" || aff === "東") { 
            dispAff = aff; 
            if ((orch >= 1 && orch <= 13) || (orch >= 21 && orch <= 23)) fNo = `31${orchStrPad}F`; 
            else if (orch >= 31 && orch <= 40) fNo = `51${String(orch + 50).padStart(2, '0')}F`; 
            else fNo = orchStr; 
        } 
        else if (aff === "相" || aff === "G" || aff === "Ｇ") { 
            fNo = `211${orchStrPad}F`; 
        }
        else if (aff === "都" || aff === "三") {
            if (cars === 8) fNo = `65${orchStrPad}F`;
            else if (cars === 6) fNo = `63${String(orch - 20).padStart(2, '0')}F`;
            else fNo = orchStr;
        }
        else if (aff === "南" || aff === "メ") {
            if (orch >= 11 && orch <= 23) {
                fNo = `91${orchStrPad}F`;
            } else if (orch === 9 || orch === 10) {
                if (cars === 8) fNo = `91${orchStrPad}F`;
                else if (cars === 6) fNo = `21${orchStrPad}F`;
                else fNo = orchStr;
            } else {
                fNo = orchStr;
            }
        }
        else { 
            fNo = orchStr; 
        }
    } 
    else if (lineId === 'toyoko' || lineId === 'extra_toyoko' || lineId === 'extra_shinyokohama' || lineId === 'shinyokohama' || (lineId === 'extra_tymg' && !fNo)) {
        if (aff === "相" || aff === "G" || aff === "Ｇ") { fNo = `201${orchStrPad}F`; } 
        else if (aff === "副" || aff === "メ" || aff === "営") { if (orch >= 81 && orch <= 95) fNo = `171${orchStrPad}F`; else if (orch >= 41 && orch <= 76) fNo = `101${String(orch - 40).padStart(2, '0')}F`; else if (orch >= 21 && orch <= 26) fNo = `171${String(orch - 20).padStart(2, '0')}F`; else fNo = orchStr; } 
        else if (aff === "東武" || aff === "武") { if ((orch >= 1 && orch <= 8) || orch === 51 || orch === 52) fNo = `91${orchStrPad}F`; else if (orch >= 71 && orch <= 77) fNo = `510${orchStrPad}F`; else fNo = orchStr; } 
        else if (aff === "み") { fNo = `Y51${orch % 10}F`; } 
        else if (aff === "急" || aff === "東") { 
            if (orch >= 81 && orch <= 87) { dispAff = "み"; fNo = `Y51${orch % 10}F`; } 
            else if (orch >= 50 && orch <= 79) fNo = `51${String(orch).padStart(2, '0')}F`; 
            else if (orch === 38) fNo = `5118F`; 
            else if (orch === 39) fNo = `5119F`; 
            else if (orch === 41) fNo = `5121F`; 
            else if (orch === 42) fNo = `5122F`; 
            else if (orch >= 1 && orch <= 15) fNo = `41${String(orch).padStart(2, '0')}F`; 
            else fNo = orchStr; 
        } 
        else if (aff === "西" || aff === "埼") {
            if ((orch >= 1 && orch <= 19) || (orch >= 51 && orch <= 58)) { fNo = `61${orchStrPad}F`; } 
            else if (orch >= 61 && orch <= 66) { fNo = `4010${orch - 60}F`; } 
            else if (orch >= 75 && orch <= 90) { fNo = `401${orch - 24}F`; } 
            else { fNo = orchStr; }
        }
        else { fNo = orchStr; }
    } 
    else if (lineId === 'oimachi' || lineId.includes('oimachi')) {
        if (cars === 7) {
            fNo = `61${orchStrPad}F`;
        } else if (cars === 5) {
            if ((orch >= 1 && orch <= 15) || (orch >= 21 && orch <= 23)) {
                fNo = `90${orchStrPad}F`;
            } else if (orch >= 51 && orch <= 68) {
                fNo = `61${orchStrPad}F`;
            } else {
                fNo = orchStr;
            }
        } else {
            fNo = orchStr;
        }
    }
    else { fNo = orchStr; }
    
    return { dispAff: dispAff, fNo: fNo };
}

function getActiveData() {
  if (currentView === 'weekday' || currentView === 'holiday') return logs[currentView];
  if (currentView === 'daily') { const sel = document.getElementById('dailyDateSelect'); return sel ? logs.daily[sel.value] : null; }
  if (currentView.startsWith('import')) return logs[currentView];
  if (currentView.startsWith('custom_')) {
    let idx = parseInt(currentView.split('_')[1]); let cv = logs.customViews[idx];
    if (!cv) return null; if (cv.type === 'upload' && cv.uploadData) return cv.uploadData;
    let baseData = logs.daily[cv.date]; if (!baseData) return null;
    let filtered = {}; for (let opKey in baseData) { if (cv.groups.includes(baseData[opKey].homeLine)) filtered[opKey] = baseData[opKey]; }
    return filtered;
  }
  return null;
}

// ★ 差分更新用ヘルパー関数
function buildDestList(data) {
  let allDests = []; Object.values(MASTER_LINE_ORDERS).forEach(list => { list.forEach(d => { if (!allDests.includes(d)) allDests.push(d); }); });
  if (data) {
    for (const opKey in data) { 
      if(!data[opKey] || !data[opKey].trains) continue;
      for (const tUid in data[opKey].trains) {
        const t = data[opKey].trains[tUid];
        if (t && !t.deleted && t.dest && t.dest !== "終点" && t.dest !== "不明" && !allDests.includes(t.dest)) { allDests.push(t.dest); }
      }
    }
  }
  return allDests;
}

function buildFormList(data) {
  let forms = new Set();
  const useFmt = document.getElementById("formatFilter")?.checked;
  const lineF = document.getElementById("lineFilter").value;
  const compF = document.getElementById("companyFilter").value;
  const secF = document.getElementById("sectionFilter").value;
  const opSearch = document.getElementById("opNumSearch") ? document.getElementById("opNumSearch").value.trim().toUpperCase() : "";

  const checkComp = (label) => {
      if (compF === "all") return true; if (!label) return false;
      if (compF === "K" && label.includes("K")) return true; if (compF === "S" && label.includes("S")) return true;
      if (compF === "T" && label.includes("T")) return true; if (compF === "M" && label.includes("M")) return true;
      if (compF === "G" && label.includes("G")) return true;
      if (label.match(/^\d+$/)) { let num = parseInt(label, 10); if (compF === "O100" && num >= 100 && num <= 129) return true; if (compF === "O130" && num >= 130) return true; }
      return false;
  };

  const addForm = (hl, aff, orch, tFmtType, cars, opLabel) => {
      if (!aff && (!orch || orch === "00")) return;
      let fObj = getFormationString(tFmtType || hl, aff, orch, useFmt, cars, opLabel);
      let dispText = useFmt ? fObj.fNo : orch;
      if (dispText) { let val = hl.includes('oimachi') ? dispText : (fObj.dispAff ? `[${fObj.dispAff}] ${dispText}` : dispText); forms.add(val); }
  };

  if (data) {
    for (const opKey in data) { 
      let hl = data[opKey].homeLine; if (hl === 'extra_toyoko' || hl === 'extra_meguro') hl = 'extra_tymg';
      if (lineF !== "all" && lineF !== hl) continue;
      
      let label = data[opKey].label;
      if (opSearch && !label.toUpperCase().includes(opSearch)) continue;
      if (!checkComp(label)) continue;

      if(!data[opKey] || !data[opKey].trains) continue;
      for (const tUid in data[opKey].trains) {
        const t = data[opKey].trains[tUid];
        if (currentView === 'weekday' || currentView === 'holiday') { if (t.trainNo && (t.trainNo.endsWith("000") || t.trainNo.endsWith("990"))) continue; }
        if (t && !t.deleted && (t.affiliation || t.orchestration)) {
            let calcSrc = calculateSourceName(t, hl);
            let srcMatch = false;
            if (secF === "all") srcMatch = true; 
            else if (secF === "system_tymg") {
                if (["toyoko", "meguro", "shinyokohama", "extra_tymg"].some(h => hl.includes(h))) srcMatch = true;
                if (["東横線", "目黒線", "新横浜線"].some(l => calcSrc.includes(l))) srcMatch = true;
            } 
            else if (secF === "system_dtom") {
                if (["dento", "oimachi", "extra_dtom"].some(h => hl.includes(h))) srcMatch = true;
                if (["田園都市線", "大井町線"].some(l => calcSrc.includes(l))) srcMatch = true;
            } 
            else {
                if (calcSrc.includes(secF)) srcMatch = true;
                else {
                    let homeLineMap = {"東横線": "toyoko", "目黒線": "meguro", "新横浜線": "shinyokohama", "田園都市線": "dento", "大井町線": "oimachi"};
                    if (hl.includes(homeLineMap[secF])) srcMatch = true;
                    let exclusives = LINE_EXCLUSIVES[secF] || [];
                    if (t.history && t.history.some(h => exclusives.includes(h.st))) srcMatch = true;
                }
            }
            if (srcMatch) addForm(hl, t.affiliation, t.orchestration, t.formatType, t.cars, label);
        }
      }
    }
  }
  
  if (!hasReceivedCloudData || (currentView === 'daily' && document.getElementById("dailyDateSelect")?.value === getDailyKey(new Date()))) {
      for (const opKey in apiLiveCache) {
          let hl = opKey.split('_')[0]; if (opKey.startsWith("extra_")) hl = opKey.split('_').slice(0,2).join('_');
          if (hl === 'extra_toyoko' || hl === 'extra_meguro') hl = 'extra_tymg';
          if (lineF !== "all" && lineF !== hl) continue;
          
          let label = opKey.split('_')[1];
          if (opSearch && !label.toUpperCase().includes(opSearch)) continue;
          if (!checkComp(label)) continue;
          
          let trains = apiLiveCache[opKey];
          for (let tNo in trains) { 
              let t = trains[tNo]; let srcMatch = false;
              if (secF === "all") srcMatch = true; else if (secF === "system_tymg" && ["東横線", "目黒線", "新横浜線"].includes(t.sourceName)) srcMatch = true; else if (secF === "system_dtom" && ["田園都市線", "大井町線"].includes(t.sourceName)) srcMatch = true; else if (t.sourceName === secF) srcMatch = true;
              if (srcMatch) addForm(hl, t.affiliation, t.orchestration, null, t.cars, label);
          }
      }
  }
  return Array.from(forms).sort();
}

function isArrayEqual(arr1, arr2) {
    if (arr1.length !== arr2.length) return false;
    for (let i = 0; i < arr1.length; i++) { if (arr1[i] !== arr2[i]) return false; }
    return true;
}

          if (compF === "G" && label.includes("G")) isMatch = true;
          if (label.match(/^\d+$/)) { let num = parseInt(label, 10); if (compF === "O100" && num >= 100 && num <= 129) isMatch = true; if (compF === "O130" && num >= 130) isMatch = true; }
          if (!isMatch) return; 
      }

      let tHtml = "";
      let processedLiveTnos = new Set();
      
      if (u && u.trains) {
          Object.keys(u.trains).sort((a,b) => {
            const hA = u.trains[a].history; const hB = u.trains[b].history;
            const tA = (hA && hA.length>0) ? getTv(hA[0].t) : 9999; const tB = (hB && hB.length>0) ? getTv(hB[0].t) : 9999;
            if (tA !== tB) return tA - tB; return (u.trains[a].date || "").localeCompare(u.trains[b].date || "");
          }).forEach(tUid => {
            const t = u.trains[tUid]; if(!t || t.deleted || !t.history || t.history.length===0) return; 
            if (currentView === 'weekday' || currentView === 'holiday') { if (t.trainNo && (t.trainNo.endsWith("000") || t.trainNo.endsWith("990"))) return; }

            let dKind = t.kind === "通勤特急" ? "通特" : t.kind;
            
            let hl = data[ok].homeLine; if (hl === 'extra_toyoko' || hl === 'extra_meguro') hl = 'extra_tymg';
            let calcSrc = calculateSourceName(t, hl);
            
            let srcMatch = false;
            if (secF === "all") srcMatch = true;
            else if (secF === "system_tymg") {
                if (["toyoko", "meguro", "shinyokohama", "extra_tymg"].some(h => hl.includes(h))) srcMatch = true;
                if (["東横線", "目黒線", "新横浜線"].some(l => calcSrc.includes(l))) srcMatch = true;
            }
            else if (secF === "system_dtom") {
                if (["dento", "oimachi", "extra_dtom"].some(h => hl.includes(h))) srcMatch = true;
                if (["田園都市線", "大井町線"].some(l => calcSrc.includes(l))) srcMatch = true;
            }
            else {
                if (calcSrc.includes(secF)) srcMatch = true;
                else {
                    let homeLineMap = {"東横線": "toyoko", "目黒線": "meguro", "新横浜線": "shinyokohama", "田園都市線": "dento", "大井町線": "oimachi"};
                    if (hl.includes(homeLineMap[secF])) srcMatch = true;
                    let exclusives = LINE_EXCLUSIVES[secF] || [];
                    if (t.history && t.history.some(h => exclusives.includes(h.st))) srcMatch = true;
                }
            }
            if (!srcMatch) return;

            if(kindF !== "all" && dKind !== kindF && !(kindF==='特急_all' && (dKind==='特急'||dKind==='F'))) return;
            if(destF !== "all" && t.dest !== destF) return;

            let isDaiso = false; let aff = t.affiliation || ""; let orch = (t.orchestration && t.orchestration !== "00") ? t.orchestration : "";
            if (aff && label) { const opAlphaMatch = label.match(/[A-Za-z]/); if (opAlphaMatch) { const affGroup = getAffiliationGroup(g.id, aff); if (affGroup && opAlphaMatch[0] !== affGroup) isDaiso = true; } }
            if (daisoF && !isDaiso) return;
            
            let fObj = getFormationString(t.formatType || g.id, aff, orch, useFmt, t.cars, label);
            let dispTextForFilter = useFmt ? fObj.fNo : orch;
            let expectedFormVal = hl.includes('oimachi') ? dispTextForFilter : (fObj.dispAff ? `[${fObj.dispAff}] ${dispTextForFilter}` : dispTextForFilter);
            if (currentView !== 'weekday' && currentView !== 'holiday' && formSelVal !== "all" && formSelVal !== expectedFormVal) return;

            let liveInfo = liveTrainsForOp[t.trainNo];
            let isRunning = false; let currentPosSt = ""; let currentPosT = ""; let currentDelay = 0; let showLiveBadge = false;

            if (liveInfo && liveInfo.kind === t.kind && liveInfo.dest === t.dest) {
                const lastH = t.history[t.history.length-1];
                let tvHist = getTv(lastH.arrT || lastH.t); let tvLive = getTv(liveInfo.t);
                let diff = Math.abs(tvLive - tvHist); if (diff > 1440 - 180) diff = 1440 - diff;
                if (diff <= 180) { isRunning = true; currentPosSt = liveInfo.st; currentPosT = liveInfo.t; currentDelay = liveInfo.delay; processedLiveTnos.add(t.trainNo); if (lastH.st !== currentPosSt) showLiveBadge = true; }
            }
            if (!isRunning && isTodayDaily) { if (t.lastSeen && (Date.now() - t.lastSeen < 300000)) isRunning = true; }
            if (showRunningOnly && !isRunning) return;

            hasContent = true; 
            
            let carsTag = "";
            if (t.cars === 8 && aff === "南" && (hl.includes('meguro') || (hl === 'extra_tymg' && String(t.trainNo).match(/^[2-6]/)))) {
                carsTag = `<span class="cars-badge">⑧</span>`;
            }

            let formTag = "";
            if ((currentView === 'daily' || currentView.startsWith('custom_') || currentView.startsWith('import'))) {
                if (aff || orch) {
                    let dispText = useFmt ? `${fObj.fNo}` : `${orch}`; let affPart = (fObj.dispAff && !hl.includes('oimachi')) ? `[${fObj.dispAff}] ` : "";
                    formTag = `<div class="t-tr-form" title="${affPart}${dispText}">${affPart}${dispText}${carsTag}</div>`;
                } else if (carsTag) {
                    formTag = `<div class="t-tr-form">${carsTag}</div>`;
                }
            }
            
            let remarksTag = "";
            if (t.remarks && t.remarks.trim() !== "") {
                remarksTag = `<div style="font-size:11px; color:#555; background:#fff9c4; padding:2px 6px; border-radius:4px; margin-top:4px; border:1px solid #fff59d; display:inline-block; max-width:100%; white-space:normal; word-break:break-all;">✎ ${t.remarks}</div>`;
            }

            let hHtml = `<div class="t-hist">` + t.history.map(h => {
              const isEkikan = h.st.includes("駅間");
              const cls = `hist-item ${isEkikan ? 'is-ekikan' : ''}`;
              let delayMark = "";
              if (h.delay > 0) { delayMark = (currentView === 'daily' || currentView.startsWith('import') || currentView.startsWith('custom_')) ? `<sup class="tentative-mark">⁺${h.delay}</sup>` : `<sup class="tentative-mark">*</sup>`; }
              return `<span class="${cls} clickable-st" onclick="window.openStationTimetable(this.getAttribute('data-st'), '${tUid}')" data-st="${h.st}" title="この駅の時刻表を見る"><strong>${h.t}${delayMark}</strong> ${h.st}</span>`;
            }).join('');
            if (showLiveBadge) {
                let liveDelayMark = currentDelay > 0 ? `<sup class="tentative-mark">⁺${currentDelay}</sup>` : "";
                hHtml += `<span class="hist-item live-badge"><strong>${currentPosT}${liveDelayMark}</strong> ${currentPosSt} <span style="font-size:10px;">(Live)</span></span>`;
            }
            hHtml += `</div>`;

            const dispTrainNo = t.trainNo ? `${t.trainNo.substring(0,3)}-${t.trainNo.substring(3)}` : "不明";
            let badgeText = dKind; if (dKind === "F") badgeText = "Fラ"; else if (dKind === "B") badgeText = "B各停"; else if (dKind === "G") badgeText = "G各停"; else if (dKind === "Sトレイン") badgeText = "S";
            let dateTag = (g.id.startsWith('extra') && t.date && currentView !== 'daily') ? `<div class="t-tr-sub">(${t.date})</div>` : "";

            let posText = ""; let badgeDelay = 0;
            if (isRunning) {
                badgeDelay = currentDelay > 0 ? currentDelay : (!showLiveBadge && t.history[t.history.length-1].delay > 0 ? t.history[t.history.length-1].delay : 0);
                posText = `<strong>${currentPosT || t.history[t.history.length-1].t}</strong> ${currentPosSt || t.history[t.history.length-1].st}`;
            } else {
                badgeDelay = t.history[t.history.length-1].delay || 0;
                posText = `<strong>${t.history[t.history.length-1].t}</strong> ${t.history[t.history.length-1].st}`;
            }
            if (isTodayDaily && !isRunning) posText = ''; 

            let badgeDelayHtml = "";
            if (badgeDelay > 0 && (currentView === 'daily' || currentView.startsWith('import') || currentView.startsWith('custom_'))) {
                badgeDelayHtml = `<span class="t-delay">${badgeDelay}分遅れ</span>`;
            }

            let rowClass = isRunning ? 'row-active' : '';

            tHtml += `<div class="train-row ${rowClass}" id="train_row_${tUid}">
              <div class="t-basic">
                <div class="t-tr">
                    <div class="t-tr-no">${dispTrainNo}</div>
                    ${formTag}
                    ${dateTag}
                </div>
                <div class="t-dest">
                  <div class="t-dest-text"><span class="kind-badge kind-${dKind}">${badgeText}</span>${t.dest}${t.dest.endsWith('線')?'直通':'行'}</div>
                  ${badgeDelayHtml}
                  ${remarksTag}
                </div>
              </div>
              <div class="t-pos">${posText}</div>
              ${hHtml}
            </div>`;
          });
      }

      if (!hasReceivedCloudData) {
          Object.keys(liveTrainsForOp).forEach(tNo => {
              if (!processedLiveTnos.has(tNo)) {
                  const liveInfo = liveTrainsForOp[tNo];
                  
                  let srcMatch = false;
                  if (secF === "all") srcMatch = true; 
                  else if (secF === "system_tymg" && ["東横線", "目黒線", "新横浜線"].includes(liveInfo.sourceName)) srcMatch = true; 
                  else if (secF === "system_dtom" && ["田園都市線", "大井町線"].includes(liveInfo.sourceName)) srcMatch = true; 
                  else if (liveInfo.sourceName === secF) srcMatch = true;
                  
                  if (!srcMatch) return;
                  if(kindF !== "all" && liveInfo.kind !== kindF && !(kindF==='特急_all' && (liveInfo.kind==='特急'||liveInfo.kind==='F'))) return;
                  if(destF !== "all" && liveInfo.dest !== destF) return;
                  
                  let isDaiso = false;
                  if (liveInfo.affiliation && label) { const opAlphaMatch = label.match(/[A-Za-z]/); if (opAlphaMatch) { const affGroup = getAffiliationGroup(g.id, liveInfo.affiliation); if (affGroup && opAlphaMatch[0] !== affGroup) isDaiso = true; } }
                  if (daisoF && !isDaiso) return;

                  let fObj = getFormationString(g.id, liveInfo.affiliation, liveInfo.orchestration, useFmt, liveInfo.cars, label);
                  if (currentView !== 'weekday' && currentView !== 'holiday' && formSelVal !== "all" && formSelVal !== `[${fObj.dispAff}] ${fObj.fNo}`) return;
                  hasContent = true;
                  
                  let carsTag = "";
                  if (liveInfo.cars === 8 && liveInfo.affiliation === "南" && (g.id.includes('meguro') || (g.id === 'extra_tymg' && String(tNo).match(/^[2-6]/)))) {
                      carsTag = `<span class="cars-badge">⑧</span>`;
                  }
                  
                  let formTag = "";
                  if (liveInfo.affiliation || liveInfo.orchestration) { 
                      let dispText = useFmt ? fObj.fNo : liveInfo.orchestration; 
                      let affPart = (fObj.dispAff && !g.id.includes('oimachi')) ? `[${fObj.dispAff}] ` : ""; 
                      formTag = `<div class="t-tr-form">${affPart}${dispText}${carsTag}</div>`; 
                  } else if (carsTag) {
                      formTag = `<div class="t-tr-form">${carsTag}</div>`;
                  }
                  
                  let badgeText = liveInfo.kind; if (badgeText === "F") badgeText = "Fラ"; else if (badgeText === "B") badgeText = "B各停"; else if (badgeText === "G") badgeText = "G各停"; else if (badgeText === "Sトレイン") badgeText = "S";
                  let posText = `<strong>${liveInfo.t}</strong> ${liveInfo.st}`;
                  let badgeDelay = liveInfo.delay || 0;
                  let badgeDelayHtml = ""; if (badgeDelay > 0) { badgeDelayHtml = `<span class="t-delay">${badgeDelay}分遅れ</span>`; }
                  let liveDelayMark = badgeDelay > 0 ? `<sup class="tentative-mark">⁺${badgeDelay}</sup>` : "";

                  tHtml += `<div class="train-row row-sync-wait">
                    <div class="t-basic">
                      <div class="t-tr">
                          <div class="t-tr-no">${tNo.substring(0,3)}-${tNo.substring(3)}</div>
                          ${formTag}
                          <div class="t-tr-sub" style="color:#9e9e9e; font-weight:bold;">(待機中)</div>
                      </div>
                      <div class="t-dest">
                        <div class="t-dest-text"><span class="kind-badge kind-${liveInfo.kind}">${badgeText}</span>${liveInfo.dest}${liveInfo.dest.endsWith('線')?'直通':'行'}</div>
                        ${badgeDelayHtml}
                      </div>
                    </div>
                    <div class="t-pos">${posText}</div>
                    <div class="t-hist">
                        <span class="hist-item" style="border-color:#9e9e9e;"><strong>${liveInfo.t}${liveDelayMark}</strong> ${liveInfo.st}</span>
                    </div>
                  </div>`;
              }
          });
      }
      
      if(tHtml) groupHtml += `<div class="op-box">
        <div class="op-left">
          <div class="op-no">${label || "不明"}</div>
          ${g.id.startsWith('extra')?`<div class="src-tag">from<br>${srcName}</div>`:''}
        </div>
        <div class="op-right">${tHtml}</div>
      </div>`;
    });
    if(hasContent) html += groupHtml + "</div></div>";
  });

  const currentScrollY = window.scrollY;
  const currentHeight = container.getBoundingClientRect().height;
  container.style.minHeight = currentHeight + "px";

  container.innerHTML = html || "<div style='padding:40px; text-align:center; color:#888; font-weight:bold;'>指定した条件に一致する運用はありません。</div>";
  
  if (currentScrollY > 0) window.scrollTo(0, currentScrollY);
  setTimeout(() => { container.style.minHeight = "auto"; }, 100);
};

// =========================================
// 時刻表＆ジャンプ機能

function getTrainDirection(tr) {
    if (!tr || !tr.trainNo) return 1; 
    let lastDigit = parseInt(tr.trainNo.slice(-1), 10);
    if (!isNaN(lastDigit)) { return (lastDigit % 2 === 0) ? 0 : 1; }
    return 1;
}

function isPassStation(kind, stName) {
    if (!kind || kind.includes("各停") || kind === "B") return false;
    if (kind === "G") return (stName === "高津" || stName === "二子新地");
    if (kind.includes("回送")) return true;

    const stopDict = {
        "特急": ["渋谷", "中目黒", "自由が丘", "武蔵小杉", "菊名", "横浜", "新横浜", "新綱島", "日吉"],
        "F": ["渋谷", "中目黒", "自由が丘", "武蔵小杉", "菊名", "横浜", "新横浜", "新綱島", "日吉"],
        "通特": ["渋谷", "中目黒", "学芸大学", "自由が丘", "田園調布", "多摩川", "武蔵小杉", "日吉", "菊名", "横浜", "新横浜", "新綱島"],
        "急行": ["渋谷", "中目黒", "学芸大学", "自由が丘", "田園調布", "多摩川", "武蔵小杉", "日吉", "綱গামী", "菊名", "横浜", "目黒", "武蔵小山", "大岡山", "新横浜", "新綱島", "三軒茶屋", "二子玉川", "溝の口", "鷺沼", "たまプラーザ", "あざみ野", "青葉台", "長津田", "南町田", "南町田グランベリーパーク", "中央林間", "大井町", "旗の台"],
        "準急": ["渋谷", "池尻大橋", "三軒茶屋", "駒沢大学", "桜新町", "用賀", "二子玉川", "溝の口", "鷺沼", "たまプラーザ", "あざみ野", "青葉台", "長津田", "つくし野", "すずかけ台", "南町田", "南町田グランベリーパーク", "つきみ野", "中央林間"],
        "Sトレイン": ["渋谷", "自由が丘", "横浜"]
    };

    let baseKind = kind === "特急_all" ? "特急" : kind;
    if (stopDict[baseKind]) { return !stopDict[baseKind].includes(stName); }
    return false;
}

window.openStationTimetable = function(stName, currentTUid) {
  const data = getActiveData();
  if (!data) return;

  let trainsAtSt = [];
  let clickedTrainData = null;
  
  Object.keys(data).forEach(opKey => {
    let u = data[opKey]; if (!u || !u.trains) return;
    let isExtra = opKey.startsWith("extra_");

    Object.keys(u.trains).forEach(tUid => {
      let tr = u.trains[tUid]; if (!tr || tr.deleted) return;
      if ((currentView === 'weekday' || currentView === 'holiday') && tr.trainNo && (tr.trainNo.endsWith("000") || tr.trainNo.endsWith("990"))) return;

      let targetHist = tr.history.find(h => h.st === stName);
      if (targetHist) {
        let isTerminal = false;
        if (["渋谷", "目黒", "横浜", "新横浜"].includes(stName)) {
            isTerminal = (tr.dest === stName);
        } else {
            isTerminal = (tr.dest === stName) || (tr.history.length > 0 && tr.history[tr.history.length-1].st === stName);
        }
        let isFirst = (tr.history.length > 0 && tr.history[0].st === stName);
        
        let isPass = isPassStation(tr.kind, stName);
        if (isTerminal || isFirst) isPass = false;

        let hl = opKey.split('_')[0]; 
        if (hl === 'extra_toyoko' || hl === 'extra_meguro') hl = 'extra_tymg';
        let dispLine = calculateSourceName(tr, hl);

        let tData = {
          time: targetHist.t, tv: getTv(targetHist.t), delay: targetHist.delay || 0,
          track: targetHist.track || "", 
          opLabel: u.label, kind: tr.kind, dest: tr.dest, tNo: tr.trainNo, tUid: tUid,
          sourceName: dispLine, dir: getTrainDirection(tr),
          isTerminal: isTerminal, isExtra: isExtra, isPass: isPass,
          affiliation: tr.affiliation || "", orchestration: tr.orchestration || "", cars: tr.cars || 0,
          formatType: tr.formatType || ""
        };
        trainsAtSt.push(tData);
        if (tUid === currentTUid) clickedTrainData = tData;
      }
    });
  });

  trainsAtSt.sort((a, b) => a.tv - b.tv);
  
  ttState.stName = stName; ttState.trains = trainsAtSt; ttState.currentTUid = currentTUid;
  ttState.dirMode = clickedTrainData ? (clickedTrainData.dir === 0 ? "up" : "down") : "up";
  ttState.lineMode = "all"; ttState.availableLines = [];
  
  const ST_GROUPS = {
    "渋谷": { separate: true, lines: ["東横線", "田園都市線"] }, "自由が丘": { separate: true, lines: ["東横線", "大井町線"] },
    "田園調布": { separate: false, lines: ["東横線", "目黒線"] }, "多摩川": { separate: false, lines: ["東横線", "目黒線"] },
    "新丸子": { separate: false, lines: ["東横線", "目黒線"] }, "武蔵小杉": { separate: false, lines: ["東横線", "目黒線"] },
    "元住吉": { separate: false, lines: ["東横線", "目黒線"] }, "日吉": { separate: false, lines: ["東横線", "目黒線", "新横浜線"] },
    "大岡山": { separate: false, lines: ["目黒線", "大井町線"] }, "二子玉川": { separate: false, lines: ["田園都市線", "大井町線"] },
    "二子新地": { separate: false, lines: ["田園都市線", "大井町線"] }, "高津": { separate: false, lines: ["田園都市線", "大井町線"] },
    "溝の口": { separate: false, lines: ["田園都市線", "大井町線"] }
  };
  
  if (ST_GROUPS[stName]) {
      ttState.availableLines = ST_GROUPS[stName].lines;
      if (ST_GROUPS[stName].separate) {
          if (clickedTrainData) { ttState.lineMode = ttState.availableLines.find(l => clickedTrainData.sourceName.includes(l)) || ttState.availableLines[0]; } 
          else { ttState.lineMode = ttState.availableLines[0]; }
      }
  }

  document.getElementById('ttModalTitle').innerText = `🕒 ${stName} 駅 時刻表`;
  document.getElementById('timetableModal').style.display = 'flex';
  renderTimetable();
};

window.setTtDir = function(dir) { ttState.dirMode = dir; renderTimetable(); };
window.setTtLine = function(line) { ttState.lineMode = line; renderTimetable(); };

function renderTimetable() {
    let filtered = ttState.trains.filter(t => {
        if (ttState.lineMode !== "all" && !t.sourceName.includes(ttState.lineMode)) return false;
        if (ttState.dirMode !== "both") { let targetDir = (ttState.dirMode === "up") ? 0 : 1; if (t.dir !== targetDir) return false; }
        return true;
    });

    document.querySelectorAll('#ttDirTabs .tt-tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(ttState.dirMode === 'up' ? 'ttTabUp' : (ttState.dirMode === 'down' ? 'ttTabDown' : 'ttTabBoth')).classList.add('active');
    
    let lineRow = document.getElementById('ttLineControlRow');
    if (ttState.availableLines.length > 0) {
        lineRow.style.display = 'flex';
        let lineHtml = `<button class="tt-tab-btn ${ttState.lineMode === 'all' ? 'active' : ''}" onclick="window.setTtLine('all')">すべて</button>`;
        ttState.availableLines.forEach(l => { lineHtml += `<button class="tt-tab-btn ${ttState.lineMode === l ? 'active' : ''}" onclick="window.setTtLine('${l}')">${l}</button>`; });
        document.getElementById('ttLineTabs').innerHTML = lineHtml;
    } else { lineRow.style.display = 'none'; }

    let html = "";
    filtered.forEach(t => {
        let dKind = t.kind === "通勤特急" ? "通特" : t.kind;
        let badgeText = dKind; if (dKind === "F") badgeText = "Fラ"; else if (dKind === "B") badgeText = "B各停"; else if (dKind === "G") badgeText = "G各停"; else if (dKind === "Sトレイン") badgeText = "S";
        
        let dispNo = t.tNo ? `${t.tNo.substring(0,3)}-${t.tNo.substring(3)}` : "不明";
        let delayHtml = t.delay > 0 ? `<span class="t-delay" style="margin-left:6px; font-weight:normal;">${t.delay}分遅れ</span>` : "";
        let trackHtml = t.track ? `<span style="color:#1976d2; font-weight:bold;">${t.track}番線</span>` : ""; 
        let isActive = (t.tUid === ttState.currentTUid) ? "is-active" : "";
        let rowIdAttr = (t.tUid === ttState.currentTUid) ? "id='tt_active_row'" : "";
        let passClass = t.isPass ? "is-pass" : "";

        let dirBadge = t.dir === 0 ? `<div class="tt-dir-badge tt-dir-up">▲ 上り</div>` : `<div class="tt-dir-badge tt-dir-down">▼ 下り</div>`;

        let carsTag = "";
        if (t.cars === 8 && t.affiliation === "南" && (t.sourceName.includes('目黒') || t.sourceName.includes('新横浜') || (t.sourceName.includes('非定期') && String(t.tNo).match(/^[2-6]/)))) {
            carsTag = `<span class="cars-badge">⑧</span>`;
        }

        html += `<div class="tt-row ${isActive} ${passClass}" ${rowIdAttr} onclick="window.jumpToTrain('${t.tUid}')">
            <div class="tt-time-area">
                <div class="tt-time">${t.time}</div>
                ${ttState.dirMode === 'both' ? dirBadge : ''}
            </div>
            <div class="tt-info">
                <div style="font-size:14px; font-weight:bold; display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                    <span class="kind-badge kind-${dKind}">${badgeText}</span>
                    <span class="dest-text">${t.dest}${t.dest.endsWith('線')?'直通':'行'}</span>${carsTag}
                    
                    ${t.isPass ? '<span class="pass-badge">通過</span>' : ''}
                    ${t.isExtra ? '<span class="extra-badge">不定期</span>' : ''}
                    ${t.isTerminal ? '<span class="terminal-badge">当駅止</span>' : ''}
                    ${t.tUid === ttState.currentTUid ? '<span class="active-badge">選択中</span>' : ''}
                </div>
                <div style="font-size:12px; color:#777; margin-top:5px; display:flex; flex-wrap:wrap; gap:10px; align-items:center;">
                    <span>運用: <strong style="color:#444;">${t.opLabel}</strong></span>
                    <span>列車: ${dispNo}</span>
                    <span style="color:#999; font-size:11px;">(${t.sourceName})</span>
                    ${trackHtml}
                    ${delayHtml}
                </div>
            </div>
        </div>`;
    });

    document.getElementById('ttModalContent').innerHTML = html || "<div style='padding:40px; text-align:center; color:#888;'>該当する列車がありません。</div>";
    setTimeout(() => { let activeRow = document.getElementById('tt_active_row'); if (activeRow) activeRow.scrollIntoView({ behavior: 'auto', block: 'center' }); }, 30);
}

window.jumpToTime = function(hour) {
  let container = document.getElementById('ttModalContent');
  let rows = container.querySelectorAll('.tt-row');
  for (let row of rows) {
    let tTimeEl = row.querySelector('.tt-time');
    if (!tTimeEl) continue;
    
    let parts = tTimeEl.innerText.split(':');
    if(parts.length < 2) continue;
    
    let tHour = parseInt(parts[0], 10);
    if (tHour < 4) tHour += 24;
    
    let targetHour = hour;
    if (targetHour < 4) targetHour += 24;
    
    if (tHour >= targetHour) {
      row.scrollIntoView({ behavior: 'auto', block: 'start' });
      row.classList.remove('highlight-flash');
      void row.offsetWidth;
      row.classList.add('highlight-flash');
      break;
    }
  }
};

window.closeTimetableModal = function(e) {
  if (e && e.target !== document.getElementById('timetableModal')) return;
  document.getElementById('timetableModal').style.display = 'none';
  if (targetTimetableStation) { window.location.href = window.location.pathname; }
};

window.jumpToTrain = function(tUid) {
  document.getElementById('timetableModal').style.display = 'none';
  if (targetTimetableStation) return; 
  const targetEl = document.getElementById(`train_row_${tUid}`);
  if (targetEl) {
    targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    targetEl.classList.remove('highlight-flash');
    void targetEl.offsetWidth;
    targetEl.classList.add('highlight-flash');
  } else { alert("該当する列車が現在のフィルター条件で見つかりません。"); }
};

// =========================================
// 直列同期ループ
// =========================================
async function fetchLiveApiData() {
  if (hasReceivedCloudData || isFetchingApi) return; 
  isFetchingApi = true;
  const now = new Date();
  let targetDateForCalc = new Date(now.getTime() - 4 * 60 * 60 * 1000);
  let autoInfo = getAutoDayType(targetDateForCalc); let dayType = autoInfo.type;

  const newLiveCache = {};
  try {
      for(let api of API_ENDPOINTS) {
          const controller = new AbortController(); const timeoutId = setTimeout(() => controller.abort(), 10000);
          const res = await fetch(`${api.url}?t=${Date.now()}`, { cache: 'no-store', signal: controller.signal });
          clearTimeout(timeoutId);
          if (!res.ok) continue;
          const data = await res.json();
          if (!data || !data.trains) continue;
          
          data.trains.forEach(t => {
              if (!t.train_number || t.train_number === "0") return;
              let rawOp = String(t.operation_number || "0"); let rawTr = String(t.train_number || "0");
              if (rawOp === "09999900" || rawTr === "09999900") return;
              let tNo = ""; let opNo = "";
              if (rawOp.length === 8 && rawOp !== "09999900") { tNo = rawOp.substring(1, 7); opNo = tNo.substring(0, 3); } 
              else if (rawTr.length === 8 && rawTr !== "09999900") { tNo = rawTr.substring(1, 7); opNo = rawOp.padStart(3, '0'); } 
              else { tNo = rawTr.padStart(6, '0'); opNo = rawOp.padStart(3, '0'); }
              if (tNo === "999000" || tNo === "999900") return;
              
              const stName = STATION_MAP[t.station_id] || (t.section_id ? `駅間(${t.section_id})` : "不明");
              if (api.id === 'meguro' && tNo === "999090" && stName.includes("大岡山")) return;

              const info = getUnyoInfoStr(opNo, tNo, api.id, dayType); if (!info) return;

              const opKey = `${info.homeLine}_${info.label}`;
              const destMapToUse = ['toyoko', 'meguro', 'shinyokohama'].includes(api.id) ? DEST_MAP_TYMG : DEST_MAP_DTOM;
              const destStr = cleanDestName(t.destination_station_code, destMapToUse);
              const dispKind = getDispKind(t.kind || "普", info.homeLine);
              const delay = parseInt(t.delay_time, 10) || 0;
              const actualTimeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
              const numOfCars = t.num_of_cars ? parseInt(t.num_of_cars, 10) : 0;

              if (!newLiveCache[opKey]) newLiveCache[opKey] = {};
              newLiveCache[opKey][tNo] = {
                  trainNo: tNo, kind: dispKind, dest: destStr, sourceName: info.sourceName, st: stName, t: actualTimeStr, delay: delay,
                  affiliation: t.affiliation || "", orchestration: t.train_orchestration_number || "", cars: numOfCars
              };
          });
      }
      if (!hasReceivedCloudData) {
          apiLiveCache = newLiveCache; lastApiTime = new Date().toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
          updateStatusDisplay(); if (!currentView.startsWith("import")) { window.updateDestDropdown(); window.updateFormDropdown(); window.render(); }
      }
  } catch (err) { lastApiTime = "⚠ エラー (自動再試行中)"; updateStatusDisplay(); } finally { isFetchingApi = false; }
}

async function fetchFromCloud() {
  if (isFetchingCloud) return; isFetchingCloud = true; document.getElementById("cloudStatus").textContent = "☁️ 受信中...";
  try {
    const controller = new AbortController(); const timeoutId = setTimeout(() => controller.abort(), 45000); 
    const res = await fetch(GAS_URL + "?t=" + Date.now(), { signal: controller.signal });
    clearTimeout(timeoutId);
    if (!res.ok) throw new Error("HTTP " + res.status);
    
    let text = await res.text(); let data = null;
    try { data = JSON.parse(text); } catch (parseError) {
        let lastIdx = text.lastIndexOf('{"weekday"'); if (lastIdx === -1) lastIdx = text.lastIndexOf('{"appConfig"');
        if (lastIdx !== -1) {
            let recoveredText = text.substring(lastIdx); let endIdx = recoveredText.lastIndexOf('}');
            if (endIdx !== -1) recoveredText = recoveredText.substring(0, endIdx + 1); data = JSON.parse(recoveredText);
        } else { throw parseError; }
    }
    
    if (data) {
      saveCache(data); hasReceivedCloudData = true; apiLiveCache = {}; 
      let selectedDaily = null; const dailySel = document.getElementById("dailyDateSelect");
      if(dailySel && currentView === 'daily') selectedDaily = dailySel.value;
      
      logs.weekday = data.weekday || {}; logs.holiday = data.holiday || {}; logs.daily = data.daily || {};
      logs.customViews = data.customViews || []; if(data.appConfig) logs.appConfig = data.appConfig;
      
      updateTabs(); updateNotice();
      if (!currentView.startsWith("import")) { updateContextUI(selectedDaily); window.updateDestDropdown(); window.updateFormDropdown(); window.render(); }
      
      lastCloudTime = new Date().toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit', second:'2-digit'}); updateStatusDisplay();
      if (targetTimetableStation && !hasOpenedStandalone) { hasOpenedStandalone = true; setTimeout(() => openStationTimetable(targetTimetableStation, null), 300); }
    }
  } catch (err) { if (!hasReceivedCloudData) { lastCloudTime = "⚠ エラー"; } else { lastCloudTime += " [遅延]"; } updateStatusDisplay(); } finally { isFetchingCloud = false; }
}

async function cloudLoop() {
    let isTodayDaily = (currentView === 'daily' && document.getElementById("dailyDateSelect") && document.getElementById("dailyDateSelect").value === getDailyKey(new Date()));
    if (isTodayDaily && !isFetchingCloud) { await fetchFromCloud(); } setTimeout(cloudLoop, 3000); 
}

async function apiLoop() {
    let isTodayDaily = (currentView === 'daily' && document.getElementById("dailyDateSelect") && document.getElementById("dailyDateSelect").value === getDailyKey(new Date()));
    if (isTodayDaily && !isFetchingApi) { await fetchLiveApiData(); } setTimeout(apiLoop, 3000); 
}

window.exportData = function() {
    if (!logs || Object.keys(logs).length === 0) return alert("データがありません。");
    const exportObj = { _isRawBackup: true, timestamp: new Date().toISOString(), logs: logs };
    const a = document.createElement('a'); a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportObj));
    a.download = `tokyu_viewer_phone_raw_backup_${Date.now()}.json`; a.click();
};

window.importJSONData = function(file, targetView) {
    if (!file) return alert("ファイルを選択してください。");
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const json = JSON.parse(e.target.result);
            let sourceLogs = null;
            if (json._isRawBackup && json.logs) sourceLogs = json.logs;
            else if (json.weekday || json.holiday || json.daily) sourceLogs = json;
            else throw new Error("フォーマット違い");
            
            logs[targetView] = sourceLogs;
            alert("読み込み成功しました。");
            currentFilterState = {}; // インポート時もリセット
            window.updateDestDropdown(); window.updateFormDropdown(); window.render();
        } catch(err) {
            alert("読み込み失敗: " + err.message);
        }
    };
    reader.readAsText(file);
};

function initCloudSync() {
  loadCache(); document.getElementById("cloudStatus").textContent = "☁️ 読込中... | 📡 読込中...";
  fetchFromCloud(); fetchLiveApiData(); setTimeout(cloudLoop, 3000); setTimeout(apiLoop, 4500); 
}

document.addEventListener("DOMContentLoaded", () => {
  let ibar = document.getElementById("ttIndexBar");
  if(ibar) {
      let hHtml = "";
      for(let h=4; h<=25; h++) {
          let displayH = h >= 24 ? h - 24 : h;
          hHtml += `<div class="tt-index-btn" onclick="window.jumpToTime(${h})">${displayH}</div>`;
      }
      ibar.innerHTML = hHtml;
  }

  const urlParams = new URLSearchParams(window.location.search);
  const params = location.search.substring(1);
  targetTimetableStation = urlParams.get('timetable');
  
  if (targetTimetableStation) {
      document.getElementById('sticky-header').style.display = 'none';
      document.querySelector('.fab').style.display = 'none';
      document.getElementById('tabArea').style.display = 'none';
      document.getElementById('container').style.display = 'none';
      document.body.style.background = 'rgba(0,0,0,0.7)';
  } else if (params && document.getElementById("lineFilter")) {
      const opts = Array.from(document.getElementById("lineFilter").options).map(o => o.value);
      if (opts.includes(params)) document.getElementById("lineFilter").value = params;
  }
  
  window.changeTab('daily'); initCloudSync(); 
});
