<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
  <title>東急線 運用ビューワー（クラウド専用版）</title>
  <style>
    :root { 
      --toyoko: #d90240; --meguro: #009cd3; --dento: #01aa8f; 
      --oimachi: #f08d41; --shinyoko: #890d84; --extra: #607d8b; 
      --bg-color: #eef1f5; --text-color: #333; --border-color: #ddd;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: "Helvetica Neue", Arial, sans-serif; margin: 0; background: var(--bg-color); font-size: 13px; color: var(--text-color); -webkit-text-size-adjust: 100%; overflow-x: hidden; }
    
    #sticky-header { position: sticky; top: 0; z-index: 1000; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.1); border-top: 4px solid #1976d2; width: 100%; }
    .header-top { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; flex-wrap: nowrap; overflow: hidden; gap: 10px; }
    h1 { margin: 0; font-size: 16px; color: #222; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; flex-wrap: nowrap; }
    
    .btn-action { background: #333; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: bold; white-space: nowrap; flex-shrink: 0; transition: 0.2s; }
    .btn-action:hover { opacity: 0.8; }
    .btn-export { background: #1976d2; }
    .btn-green { background: #01aa8f; }
    .btn-reset { background: #c62828; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: bold; }
    
    #cloudStatus { font-family: monospace; font-size: 11px; color: #01aa8f; font-weight: bold; background: #e8f5e9; padding: 6px 8px; border-radius: 4px; text-align: center; white-space: nowrap; flex-shrink: 0; min-width: 140px; }

    #noticeBar { background: #ffebee; color: #d32f2f; padding: 12px 20px; font-size: 16px; font-weight: bold; border-bottom: 1px solid #ffcdd2; overflow: hidden; display: none; letter-spacing: 1px; }
    .marquee-container { width: 100%; overflow: hidden; white-space: nowrap; box-sizing: border-box; }
    .marquee-content { display: inline-block; padding-left: 100%; animation: marquee 20s linear infinite; }
    @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

    .tab-area { display: flex; gap: 8px; overflow-x: auto; padding: 10px 15px; -webkit-overflow-scrolling: touch; scrollbar-width: none; border-bottom: 1px solid var(--border-color); background: #fff; }
    .tab-area::-webkit-scrollbar { display: none; }
    .tab { flex: 0 0 auto; padding: 8px 16px; cursor: pointer; border: 1px solid #ccc; background: #f5f5f5; border-radius: 20px; font-size: 13px; font-weight: bold; transition: 0.2s; }
    .tab.active { background: #333; color: #fff; border-color: #333; }
    .tab-daily { background: #e8f5e9; border-color: #a5d6a7; color: #2e7d32; }
    .tab-import { background: #fff3e0; border-color: #ffcc80; color: #ef6c00; }
    .tab-custom { background: #e1bee7; border-color: #f48fb1; color: #880e4f; }
    .tab-custom.active, .tab-daily.active, .tab-import.active { background: #333; color: #fff; border-color: #333; }

    .filter-bar { background: #fafafa; padding: 8px 15px; display: flex; align-items: center; gap: 10px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; border-bottom: 1px solid var(--border-color); }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-item { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .filter-label { font-weight: bold; color: #555; font-size: 12px; white-space: nowrap; }
    .filter-select { padding: 6px 8px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; font-weight: bold; min-width: 100px; max-width: 140px; }
    input.filter-select { font-weight: normal; cursor: text; min-width: 80px; max-width: 100px; }
    
    .running-toggle { cursor:pointer; font-size:12px; font-weight:bold; color:#1976d2; display:flex; align-items:center; gap:4px; background:#e3f2fd; padding:6px 10px; border-radius:4px; border:1px solid #bbdefb; white-space:nowrap; }

    #container { padding: 15px; max-width: 1200px; margin: 0 auto; width: 100%; }
    .line-section { margin-bottom: 25px; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow: hidden; border: 1px solid var(--border-color); }
    .line-header { padding: 10px 15px; font-size: 15px; font-weight: bold; color: #fff; letter-spacing: 1px; }
    .line-body { padding: 10px; }
    
    .bg-toyoko { background: var(--toyoko); } .bg-meguro { background: var(--meguro); } .bg-dento { background: var(--dento); }
    .bg-oimachi { background: var(--oimachi); } .bg-shinyoko { background: var(--shinyoko); } .bg-extra { background: var(--extra); }

    .op-box { display: flex; align-items: stretch; border: 1px solid #e0e0e0; border-radius: 6px; margin-bottom: 10px; overflow: hidden; }
    .op-left { width: 85px; background: #f8f9fa; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; flex-shrink: 0; }
    .op-no { font-weight: bold; font-family: monospace; font-size: 18px; color: #d32f2f; text-align: center; }
    .src-tag { font-size: 10px; background: #ddd; padding: 2px 4px; border-radius: 4px; color: #555; margin-top: 6px; text-align: center; line-height: 1.2; word-break: break-all;}
    
    .op-right { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #fff; }
    
    .train-row { display: flex; align-items: center; padding: 10px 12px; border-bottom: 1px solid #f0f0f0; width: 100%; gap: 10px; transition: background 0.2s; flex-wrap: nowrap; overflow: hidden; }
    .train-row:last-child { border-bottom: none; }
    .row-active { background: #fffde7; }

    .t-basic { display: flex; align-items: center; flex-shrink: 0; width: 250px; gap: 8px; white-space: nowrap; }
    
    .t-tr { width: 65px; flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; }
    .t-tr-no { font-family: monospace; color: #1976d2; font-weight: bold; font-size: 14px; line-height: 1.2; }
    .t-tr-sub { font-size: 10px; color: #666; margin-top: 2px; }
    
    .t-tr-form { font-size: 11px; color: #4886a5; font-weight: bold; margin-top: 2px; display: inline-block; white-space: nowrap; }
    
    .t-dest { flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; overflow: hidden; }
    .t-dest-text { font-size: 14px; font-weight: bold; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
    .t-delay { color: #d32f2f; font-size: 11px; font-weight: bold; background: #ffebee; padding: 2px 6px; border-radius: 4px; display: inline-block; width: max-content; border: 1px solid #ffcdd2; }
    
    .t-pos { width: 140px; font-size: 13px; color: #222; flex-shrink: 0; padding-right: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-right: 1px dashed #eee; }
    .t-pos strong { color: #1976d2; margin-right: 4px; }
    
    .t-hist { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; display: flex; align-items: center; gap: 4px; padding-bottom: 6px; -webkit-overflow-scrolling: touch; }
    .t-hist::-webkit-scrollbar { height: 6px; display: block; }
    .t-hist::-webkit-scrollbar-track { background: transparent; }
    .t-hist::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
    .t-hist::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    
    .hist-item { background: #f5f5f5; padding: 4px 8px; border-radius: 4px; font-size: 11px; white-space: nowrap; border-bottom: 2px solid #ccc; display: inline-flex; align-items: center; gap: 4px; }
    .hist-item.is-ekikan { background: transparent; border: none; color: #888; font-size: 10px; padding: 2px 4px; }
    .hist-item strong { color: #444; }
    .tentative-mark { color: #d32f2f; font-weight: bold; font-size: 12px; margin-left: 1px; }

    .kind-badge { display: inline-block; min-width: 44px; padding: 3px 4px; border-radius: 3px; font-size: 11px; font-weight: bold; color: #fff; margin-right: 4px; text-align: center; box-sizing: border-box; line-height: 1; flex-shrink:0; }
    .kind-各停 { background: #1976d2; } 
    .kind-B { background: #1976d2; } 
    .kind-G { background: #4caf50; } 
    .kind-準急 { background: #4caf50; } 
    .kind-急行 { background: #d90240; }
    .kind-特急, .kind-F { background: #ff9800; } 
    .kind-通特 { background: #fff; border: 1px solid #d90240; color: #d90240; padding: 1px 0;} 
    .kind-Sトレイン { background: #fff; color: #009688; border: 1px solid #009688; } 
    .kind-回送 { background: #757575; }

    @media (max-width: 800px) {
      .header-top { padding: 8px 10px; gap: 5px; flex-wrap: wrap; }
      h1 { font-size: 15px; }
      .btn-action { padding: 5px 8px; font-size: 11px; }
      #cloudStatus { width: auto; font-size: 10px; padding: 5px 4px; }
      
      #noticeBar { padding: 8px 15px; font-size: 13px; }
      .tab-area { padding: 8px 10px 5px 10px; }
      .filter-bar { padding: 8px 10px; gap: 8px; }
      .filter-select { font-size: 12px; padding: 5px 6px; }
      
      .op-box { flex-direction: column; }
      .op-left { width: 100%; flex-direction: row; justify-content: space-between; border-right: none; border-bottom: 1px solid #e0e0e0; padding: 8px 15px; box-sizing: border-box; }
      .src-tag { margin-top: 0; font-size: 11px; }
      
      .train-row { flex-direction: column; align-items: flex-start; gap: 6px; padding: 12px; }
      .t-basic { width: 100%; flex-wrap: nowrap; align-items: flex-start; border-bottom: 1px dashed #eee; padding-bottom: 8px; margin-bottom: 4px; }
      .t-dest-text { font-size: 15px; white-space: normal; line-height: 1.3; }
      
      .t-pos { width: 100%; margin-top: 2px; font-size: 12px; color: #d32f2f; border-right: none; padding-right: 0; }
      .t-hist { width: 100%; padding-bottom: 8px; }
      .t-hist::-webkit-scrollbar { display: none; }
    }
  </style>
</head>
<body>

<div id="sticky-header">
  <div class="header-top">
    <h1>東急線 運用ビューワー</h1>
    <div class="header-right">
      <button class="btn-action" onclick="location.href='index.html'+location.search">路線図</button>
      <button class="btn-action btn-green" onclick="forceSync()">🔄 強制同期</button>
      <button class="btn-action btn-export" onclick="exportData()">💾 JSON保存</button>
      <div id="cloudStatus">☁️ 待機中 | 📡 待機中</div>
    </div>
  </div>

  <div id="noticeBar">
    <div class="marquee-container">
      <div class="marquee-content" id="noticeText"></div>
    </div>
  </div>

  <div class="tab-area" id="tabArea">
    <button id="tab_weekday" class="tab" onclick="changeTab('weekday')" style="display:none;">平日累計</button>
    <button id="tab_holiday" class="tab" onclick="changeTab('holiday')" style="display:none;">土休累計</button>
    <button id="tab_daily" class="tab tab-daily" onclick="changeTab('daily')" style="display:none;">毎日記録</button>
    <button id="tab_import1" class="tab tab-import" onclick="changeTab('import1')">読込1</button>
    <button id="tab_import2" class="tab tab-import" onclick="changeTab('import2')">読込2</button>
    <button id="tab_import3" class="tab tab-import" onclick="changeTab('import3')">読込3</button>
  </div>

  <div class="filter-bar">
    <div id="contextFilters" style="display:flex; align-items:center; gap:8px;"></div>
    
    <div class="filter-item">
      <span class="filter-label">区間:</span>
      <select id="sectionFilter" class="filter-select" onchange="updateDestDropdown(); render();">
        <option value="all">すべての区間</option>
        <option value="東横線">東横線</option><option value="目黒線">目黒線</option>
        <option value="田園都市線">田園都市線</option><option value="大井町線">大井町線</option><option value="新横浜線">新横浜線</option>
      </select>
    </div>

    <div class="filter-item">
      <span class="filter-label">運用:</span>
      <select id="opFilter" class="filter-select" onchange="render();">
        <option value="all">すべての路線</option>
        <option value="toyoko">東横線</option><option value="meguro">目黒線</option>
        <option value="dento">田園都市線</option><option value="oimachi">大井町線</option>
        <option value="extra_tymg">東横・目黒系 非定期</option><option value="extra_dtom">田都・大井町系 非定期</option>
      </select>
    </div>
    
    <div class="filter-item">
      <span class="filter-label">所属:</span>
      <select id="companyFilter" class="filter-select" onchange="render()">
        <option value="all">すべて</option>
        <option value="K">東急車 (K)</option><option value="S">メトロ車 (S)</option><option value="T">東武/都営 (T)</option>
        <option value="M">西武/埼玉高速 (M)</option><option value="G">相鉄車 (G)</option>
        <option value="O100">大井町 100〜129番台</option><option value="O130">大井町 130番台〜</option>
      </select>
    </div>

    <div class="filter-item">
      <span class="filter-label">種別:</span>
      <select id="kindFilter" class="filter-select" onchange="render()">
        <option value="all">すべて表示</option>
        <option value="各停">各停</option><option value="B">B各停</option><option value="G">G各停</option>
        <option value="準急">準急</option><option value="急行">急行</option><option value="通特">通特</option>
        <option value="特急_all">Fラ/特急</option><option value="特急">特急</option><option value="F">Fラ</option>
        <option value="Sトレイン">Sトレイン</option><option value="回送">回送</option>
      </select>
    </div>

    <div class="filter-item">
      <span class="filter-label">行先:</span>
      <select id="destFilter" class="filter-select" onchange="render()"></select>
    </div>

    <div class="filter-item" id="formFilterArea" style="display:none;">
      <span class="filter-label">編成:</span>
      <select id="formFilterSel" class="filter-select" onchange="render()"></select>
    </div>
    
    <div class="filter-item" style="margin-left: auto; display:flex; gap:6px;">
      <label class="running-toggle" style="background:#fff3e0; border-color:#ffcc80; color:#e65100;">
        <input type="checkbox" id="daisoFilter" onchange="render()"> 代走のみ
      </label>
      <label class="running-toggle" style="background:#e8eaf6; border-color:#9fa8da; color:#3f51b5;">
        <input type="checkbox" id="formatFilter" onchange="updateFormDropdown(); render();"> 🚃 編成表記
      </label>
      <label class="running-toggle">
        <input type="checkbox" id="runningFilter" onchange="render()"> 🚄 走行中のみ
      </label>
    </div>
  </div>
</div>

<div id="container"></div>

<script>

function getTv(tStr) {
  if(!tStr) return -1;
  let [h, m] = tStr.split(':').map(Number);
  if(isNaN(h) || isNaN(m)) return -1;
  if(h < 4) h += 24;
  return h * 60 + m;
}

function getDailyKey(d = new Date()) { 
    const dt = new Date(d.getTime() - 4 * 60 * 60 * 1000); 
    return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`; 
}

function getAutoDayType(targetDate) {
  const dKey = `${targetDate.getFullYear()}-${String(targetDate.getMonth()+1).padStart(2,'0')}-${String(targetDate.getDate()).padStart(2,'0')}`;
  const isWeekend = targetDate.getDay() === 0 || targetDate.getDay() === 6;
  if (publicHolidays[dKey]) return { type: 'holiday', reason: publicHolidays[dKey] };
  if (isWeekend) return { type: 'holiday', reason: '土日' }; return { type: 'weekday', reason: '平日' };
}

function getDispKind(rawKind, groupId) {

  if (rawKind.includes("通勤特急") || rawKind.includes("通特") || rawKind === "通") return "通特";

function getUnyoInfoStr(opNo, lineKey, dayType) {
  const opRaw = parseInt(opNo, 10); if (opRaw === 0 || isNaN(opRaw)) return null;
  const H = opNo.charAt(0); const XX_str = opNo.substring(1); const XX = parseInt(XX_str, 10);
  let hl = "extra"; let label = String(opRaw); let detectedHl = "extra"; let detectedSys = "";
  if (['toyoko', 'meguro', 'shinyokohama'].includes(lineKey)) {
    if (H==='0') { detectedHl="toyoko"; detectedSys="K"; label=XX_str+"K"; } else if (H==='1') { detectedHl="toyoko"; detectedSys="M"; label=XX_str+"M"; }
    else if (H==='7') { detectedHl="toyoko"; detectedSys="S"; label=XX_str+"S"; } else if (H==='8') { detectedHl="toyoko"; detectedSys="T"; label=XX_str+"T"; }
    else if (H==='9') { detectedHl="toyoko"; detectedSys="G"; label=XX_str+"G"; } else if (H==='2') { detectedHl="meguro"; detectedSys="K"; label=XX_str+"K"; }
    else if (H==='3') { detectedHl="meguro"; detectedSys="S"; label=XX_str+"S"; } else if (H==='4') { detectedHl="meguro"; detectedSys="T"; label=XX_str+"T"; }
    else if (H==='5') { detectedHl="meguro"; detectedSys="M"; label=XX_str+"M"; } else if (H==='6') { detectedHl="meguro"; detectedSys="G"; label=XX_str+"G"; }
  } else if (['dento', 'oimachi'].includes(lineKey)) {
    if (opRaw>=101 && opRaw<=149) { detectedHl="oimachi"; detectedSys="O"; label=String(opRaw); } 
    else if (opRaw>=181 && opRaw<=183) { detectedHl="dento"; detectedSys="N"; label=String(opRaw); } 
    else if (opRaw>=1 && opRaw<=49) { detectedHl="dento"; detectedSys="K"; label=String(opRaw).padStart(2,'0')+"K"; } 
    else if (opRaw>=50 && opRaw<=99) {
      detectedHl="dento";
      if ([90,92,94,96,98,99].includes(opRaw)) { detectedSys="K"; label=String(opRaw).padStart(2,'0')+"K"; } 
      else { detectedSys=(opRaw%2===1?"S":"T"); label=String(opRaw).padStart(2,'0')+detectedSys; }
    }
  }
  let checkVal = XX; if (detectedHl === 'oimachi' || detectedHl === 'dento') checkVal = opRaw;
  const isReg = OP_SETS[dayType] && OP_SETS[dayType][detectedHl] && OP_SETS[dayType][detectedHl][detectedSys] && OP_SETS[dayType][detectedHl][detectedSys].includes(checkVal);
  if (isReg) hl = detectedHl; else hl = ['toyoko', 'meguro', 'shinyokohama'].includes(lineKey) ? "extra_tymg" : "extra_dtom";
  
  if (detectedHl === 'meguro' && typeof MEGURO_PAIRS !== 'undefined' && MEGURO_PAIRS[dayType] && MEGURO_PAIRS[dayType][label]) {
      label = MEGURO_PAIRS[dayType][label];
  }
  
  const sourceName = {toyoko:"東横線", meguro:"目黒線", shinyokohama:"新横浜線", dento:"田園都市線", oimachi:"大井町線"}[lineKey];
  return { homeLine: hl, label: label, sourceName: sourceName };
}

        if (["東", "武", "都"].includes(aff)) return "T";

}

function getFormationString(lineId, aff, orchStr, useFormat) {
    if (!aff && !orchStr) return { dispAff: "", fNo: "" };
    
    if (!useFormat || lineId.startsWith('extra')) {
        return { dispAff: aff, fNo: orchStr };
    }

    let orch = parseInt(orchStr, 10);
    let orchStrPad = String(orch).padStart(2, '0');
    
    if (isNaN(orch)) return { dispAff: aff, fNo: orchStr };

    let fNo = "";
    let dispAff = aff; 

    if (lineId === 'meguro') {
        if (aff === "急" || aff === "東") { 
            dispAff = aff;
            if ((orch >= 1 && orch <= 13) || (orch >= 21 && orch <= 23)) fNo = `31${orchStrPad}F`;
            else if (orch >= 31 && orch <= 40) fNo = `51${String(orch + 50).padStart(2, '0')}F`;
            else fNo = orchStr;
        } else if (aff === "相" || aff === "G") {
            fNo = `211${orchStrPad}F`; 
        } else {
            fNo = orchStr;
        }
    } 
    else if (lineId === 'toyoko' || lineId === 'shinyokohama') {
        if (aff === "相" || aff === "G") {
            fNo = `201${orchStrPad}F`; 
        } else if (aff === "副" || aff === "メ" || aff === "営") {
            if (orch >= 81 && orch <= 95) fNo = `171${orchStrPad}F`;
            else if (orch >= 41 && orch <= 76) fNo = `101${String(orch - 40).padStart(2, '0')}F`;
            else if (orch >= 21 && orch <= 26) fNo = `171${String(orch - 20).padStart(2, '0')}F`;
            else fNo = orchStr;
        } else if (aff === "東" || aff === "武") {
            if ((orch >= 1 && orch <= 8) || orch === 51 || orch === 52) fNo = `91${orchStrPad}F`;
            else if (orch >= 71 && orch <= 77) fNo = `510${orchStrPad}F`;
            else fNo = orchStr;
        } else if (aff === "み") {
            fNo = `Y51${orch % 10}F`;
        } else if (aff === "急") {
            if (orch >= 81 && orch <= 87) {
                dispAff = "み"; 
                fNo = `Y51${orch % 10}F`;
            }
            else if (orch >= 50 && orch <= 79) fNo = `51${String(orch).padStart(2, '0')}F`;
            else if (orch === 38) fNo = `5118F`;
            else if (orch === 39) fNo = `5119F`;
            else if (orch === 41) fNo = `5121F`;
            else if (orch === 42) fNo = `5122F`;
            else if (orch >= 1 && orch <= 15) fNo = `41${String(orch).padStart(2, '0')}F`;
            else fNo = orchStr;
        } else {
            fNo = orchStr;
        }
    } else {
        fNo = orchStr;
    }
    
    return { dispAff: dispAff, fNo: fNo };
}

function mergeData(target, source) {
  ['weekday', 'holiday', 'daily'].forEach(type => {
    if (source[type]) {
      if (!target[type]) target[type] = {};
      if (type === 'daily') { for (let d in source.daily) { if (!target.daily[d]) target.daily[d] = {}; mergeOpData(target.daily[d], source.daily[d]); } } 
      else { mergeOpData(target[type], source[type]); }
    }
  });
}

function mergeOpData(targetObj, sourceObj) {
  for (let opKey in sourceObj) {
    if (!targetObj[opKey]) { targetObj[opKey] = sourceObj[opKey]; } 
    else {
      let tTrains = targetObj[opKey].trains; let sTrains = sourceObj[opKey].trains;
      for (let tUid in sTrains) {
        if (!tTrains[tUid]) { tTrains[tUid] = sTrains[tUid]; } 
        else {
          let tHist = tTrains[tUid].history || []; let sHist = sTrains[tUid].history || [];
          sHist.forEach(sh => { if (sh && sh.t && sh.st && !tHist.find(th => th && th.t === sh.t && th.st === sh.st)) { tHist.push(sh); } });
          tHist.sort((a,b) => getTv(a.t) - getTv(b.t)); tTrains[tUid].history = tHist;
          if (sTrains[tUid].remarks) tTrains[tUid].remarks = sTrains[tUid].remarks;
          if (sTrains[tUid].deleted) tTrains[tUid].deleted = true; 
          tTrains[tUid].lastSeen = sTrains[tUid].lastSeen || tTrains[tUid].lastSeen;
        }
      }
    }
  }
}

function sanitizeLogs() {
  ['weekday', 'holiday', 'daily'].forEach(type => {
      if(logs[type]) {
          for(let key in logs[type]) {
              if(key.includes('/')) { 
                  let newK = key.replace(/\//g, '-');
                  if (!logs[type][newK]) logs[type][newK] = logs[type][key];
                  else Object.assign(logs[type][newK], logs[type][key]);
                  delete logs[type][key]; 
              }
              else if (type !== 'daily' && logs[type][key] && logs[type][key].trains) {
                  for(let uid in logs[type][key].trains) {
                      let tr = logs[type][key].trains[uid];
                      if(!tr) continue;
                      if(tr.deleted) { delete logs[type][key].trains[uid]; continue; } 
                      let needsUpdate = false; let newUid = uid;
                      if(uid.includes('/')) { newUid = uid.replace(/\//g, '-'); needsUpdate = true; }
                      if(tr.date && tr.date.includes('/')) { tr.date = tr.date.replace(/\//g, '-'); needsUpdate = true; }
                      if (needsUpdate) { logs[type][key].trains[newUid] = tr; if (newUid !== uid) delete logs[type][key].trains[uid]; }
                  }
                  if(Object.keys(logs[type][key].trains).length === 0) { delete logs[type][key]; }
              }
          }
      }
  });
}

      if(!data[opKey] || !data[opKey].trains) continue;

  Array.from(forms).sort().forEach(f => { formSelect.appendChild(new Option(f, f)); });

function getActiveData() {
  if (currentView === 'weekday' || currentView === 'holiday') return logs[currentView];
  if (currentView === 'daily') { const sel = document.getElementById('dailyDateSelect'); return sel ? logs.daily[sel.value] : null; }
  if (currentView.startsWith('import')) return logs[currentView];
  if (currentView.startsWith('custom_')) {
    let idx = parseInt(currentView.split('_')[1]);
    let cv = logs.customViews[idx];
    if (!cv) return null;
    if (cv.type === 'upload' && cv.uploadData) return cv.uploadData;
    let baseData = logs.daily[cv.date];
    if (!baseData) return null;
    let filtered = {};
    for (let opKey in baseData) {
      if (cv.groups.includes(baseData[opKey].homeLine)) filtered[opKey] = baseData[opKey];
    }
    return filtered;
  }
  return null;
}

    noticeBar.style.display = "block";
  } else {
    noticeBar.style.display = "none";
  }
}

function updateContextUI(preservedDailyDate = null) {
  const ctx = document.getElementById("contextFilters");
  if (!ctx) return;
  ctx.innerHTML = "";

  if (currentView === "daily") {
    const label = document.createElement("span"); label.className = "filter-label"; label.textContent = "表示日:"; ctx.appendChild(label);
    const select = document.createElement("select"); select.id = "dailyDateSelect"; select.className = "filter-select"; select.style.maxWidth = "110px";
    select.onchange = () => { updateDestDropdown(); updateFormDropdown(); render(); };
    
    const keys = Object.keys(logs.daily || {}).sort().reverse();
    if (keys.length === 0) select.appendChild(new Option("記録なし", getDailyKey()));
    else keys.forEach(k => select.appendChild(new Option(k, k)));
    
    if (preservedDailyDate && Array.from(select.options).some(o => o.value === preservedDailyDate)) {
       select.value = preservedDailyDate;
    }
    ctx.appendChild(select);

  } else if (currentView.startsWith("import") && logs[currentView]) {
    const clearBtn = document.createElement("button");
    clearBtn.className = "btn-reset";
    clearBtn.textContent = "✖ 破棄";
    clearBtn.onclick = () => {
      if(confirm(`読み込んだデータを破棄しますか？`)) { logs[currentView] = null; changeTab('daily'); }
    };
    ctx.appendChild(clearBtn);
  }
}

function updateTabs() {
  const cfg = logs.appConfig || { dispW: true, dispH: true, dispD: true, lines: {} };
  
  const tabW = document.getElementById('tab_weekday');
  const tabH = document.getElementById('tab_holiday');
  const tabD = document.getElementById('tab_daily');
  
  if(tabW) tabW.style.display = cfg.dispW !== false ? '' : 'none';
  if(tabH) tabH.style.display = cfg.dispH !== false ? '' : 'none';
  if(tabD) tabD.style.display = cfg.dispD !== false ? '' : 'none';

  let needsSwitch = false;
  if (currentView === 'weekday' && cfg.dispW === false) needsSwitch = true;
  if (currentView === 'holiday' && cfg.dispH === false) needsSwitch = true;
  if (currentView === 'daily' && cfg.dispD === false) needsSwitch = true;

  if (needsSwitch) {
      if (cfg.dispW !== false) changeTab('weekday');
      else if (cfg.dispH !== false) changeTab('holiday');
      else if (cfg.dispD !== false) changeTab('daily');
      else changeTab('import1'); 
  }

  document.querySelectorAll('.tab-custom').forEach(el => el.remove());
  const tabArea = document.getElementById('tabArea');
  if (logs.customViews) {
    logs.customViews.forEach((cv, i) => {
      if (cv.active && cv.title) {
        let btn = document.createElement('button');
        btn.id = `tab_custom_${i}`;
        btn.className = `tab tab-custom ${currentView === `custom_${i}` ? 'active' : ''}`;
        btn.onclick = () => changeTab(`custom_${i}`);
        btn.textContent = cv.title;
        tabArea.appendChild(btn);
      }
    });
  }
}

function changeTab(tabId) { 
  currentView = tabId; 
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  const target = document.getElementById('tab_' + tabId);
  if(target) target.classList.add('active');
  
  updateContextUI(); 
  updateDestDropdown(); 
  updateFormDropdown();
  render(); 
}

function render() {
  const container = document.getElementById("container");
  
  if (currentView.startsWith("import") && (!logs[currentView] || Object.keys(logs[currentView]).length === 0)) {
    container.innerHTML = `<div style="text-align:center; padding:40px; background:#fff; border-radius:8px;">
        <p style="font-weight:bold; margin-bottom:15px; color:#555;">JSONファイルを読み込んで表示します。</p>
        <input type="file" id="jsonUpload_${currentView}" accept=".json" style="margin-bottom: 15px;"><br>
        <button class="btn-action btn-export" style="margin:0 auto; padding:10px 20px; font-size:14px;" onclick="importJSONData(document.getElementById('jsonUpload_${currentView}').files[0], '${currentView}')">ファイルを読み込む</button>
      </div>`;
    return;
  }

  const data = getActiveData();
  if (!data || Object.keys(data).length === 0) { container.innerHTML = "<div style='padding:40px; text-align:center; color:#888; font-weight:bold;'>データがありません</div>"; return; }

  const cfg = logs.appConfig || { lines: {} };
  const secF = document.getElementById("sectionFilter") ? document.getElementById("sectionFilter").value : "all";
  const opF = document.getElementById("opFilter").value;
  const kindF = document.getElementById("kindFilter").value;
  const destF = document.getElementById("destFilter").value;
  const compF = document.getElementById("companyFilter").value;
  const showRunningOnly = document.getElementById("runningFilter")?.checked;
  const useFmt = document.getElementById("formatFilter")?.checked; 
  
  const formSelVal = document.getElementById("formFilterSel")?.value || "all";
  const daisoF = document.getElementById("daisoFilter") ? document.getElementById("daisoFilter").checked : false;

  let html = "";
  const groups = [
    { id: 'toyoko', name: '東横線 定期運用', cl: 'bg-toyoko' }, { id: 'meguro', name: '目黒線 定期運用', cl: 'bg-meguro' },
    { id: 'shinyokohama', name: '新横浜線 定期運用', cl: 'bg-shinyoko' }, { id: 'dento', name: '田園都市線 定期運用', cl: 'bg-dento' },
    { id: 'oimachi', name: '大井町線 定期運用', cl: 'bg-oimachi' },
    { id: 'extra_tymg', name: '東横・目黒 非定期/臨時', cl: 'bg-extra' }, { id: 'extra_dtom', name: '田都・大井 非定期/臨時', cl: 'bg-extra' }
  ];

  groups.forEach(g => {
    if (!currentView.startsWith("import") && !currentView.startsWith("custom_")) {
        if (cfg.lines && cfg.lines[g.id] && cfg.lines[g.id].disp === false) return;
    }
    if (opF !== "all" && opF !== g.id) return;
    
    const opKeys = Object.keys(data).filter(k => data[k] && data[k].homeLine === g.id).sort((a, b) => {
      const getRank = s => { if(s.includes('K')) return 1; if(s.includes('S')) return 2; if(s.includes('T')) return 3; return 4; };
      return getRank(a) - getRank(b) || a.localeCompare(b);
    });
    
    if(opKeys.length === 0) return;

    let groupHtml = `<div class="line-section"><div class="line-header ${g.cl}">${g.name}</div><div class="line-body">`;
    let hasContent = false;

    opKeys.forEach(ok => {
      const u = data[ok]; 
      if (!u || !u.trains) return;
      
      if (compF !== "all") {
          let lbl = u.label || "";
          let isMatch = false;
          if (compF === "K" && lbl.includes("K")) isMatch = true;
          if (compF === "S" && lbl.includes("S")) isMatch = true;
          if (compF === "T" && lbl.includes("T")) isMatch = true;
          if (compF === "M" && lbl.includes("M")) isMatch = true;
          if (compF === "G" && lbl.includes("G")) isMatch = true;
          if (lbl.match(/^\d+$/)) {
              let num = parseInt(lbl, 10);
              if (compF === "O100" && num >= 100 && num <= 129) isMatch = true;
              if (compF === "O130" && num >= 130) isMatch = true;
          }
          if (!isMatch) return; 
      }

      let tHtml = "";
      let activeUid = null;
      let maxTime = -1;
      
      Object.keys(u.trains).forEach(uid => {
        const t = u.trains[uid];
        if(!t || t.deleted || !t.history) return; 
        const h = t.history;
        if(h.length > 0) {
          const lastH = h[h.length-1];
          if(lastH && lastH.t) {
            let tv = getTv(lastH.t);
            if(tv > maxTime) { maxTime = tv; activeUid = uid; }
          }
        }
      });

      Object.keys(u.trains).sort((a,b) => {
        const hA = u.trains[a] ? u.trains[a].history : null;
        const hB = u.trains[b] ? u.trains[b].history : null;
        const tA = (hA && hA.length>0 && hA[0] && hA[0].t) ? getTv(hA[0].t) : 9999;
        const tB = (hB && hB.length>0 && hB[0] && hB[0].t) ? getTv(hB[0].t) : 9999;
        if (tA !== tB) return tA - tB;
        const dA = u.trains[a] ? (u.trains[a].date || "") : "";
        const dB = u.trains[b] ? (u.trains[b].date || "") : "";
        return dA.localeCompare(dB);
      }).forEach(tUid => {
        const t = u.trains[tUid]; if(!t || t.deleted || !t.history || t.history.length===0) return; 
        
        let dKind = t.kind === "通勤特急" ? "通特" : t.kind;
        
        if(secF !== "all" && t.sourceName !== secF) return;
        if(kindF !== "all" && dKind !== kindF && !(kindF==='特急_all' && (dKind==='特急'||dKind==='F'))) return;
        if(destF !== "all" && t.dest !== destF) return;

        const last = t.history[t.history.length-1];
        if(!last || !last.t) return;

        const isRunning = t.lastSeen && (Date.now() - t.lastSeen < 300000); 
        if (showRunningOnly && !isRunning) return;
        
        let aff = t.affiliation || "";
        let orch = (t.orchestration && t.orchestration !== "00") ? t.orchestration : "";
        
        let fObj = getFormationString(g.id, aff, orch, useFmt);
        if (currentView !== 'weekday' && currentView !== 'holiday' && formSelVal !== "all") {
            if (formSelVal !== `[${fObj.dispAff}] ${fObj.fNo}`) return;
        }
        
        let isDaiso = false;
        if (aff && u.label) {
            const opAlphaMatch = u.label.match(/[A-Za-z]/);
            if (opAlphaMatch) {
                const opAlpha = opAlphaMatch[0];
                const affGroup = getAffiliationGroup(g.id, aff); 
                if (affGroup && opAlpha !== affGroup) {
                    isDaiso = true;
                }
            }
        }
        if (daisoF && !isDaiso) return;

        hasContent = true; 
        
        let formTag = "";
        
        if ((currentView === 'daily' || currentView.startsWith('custom_') || currentView.startsWith('import')) && ['toyoko', 'meguro', 'shinyokohama', 'extra_tymg', 'extra_dtom'].includes(g.id)) {
            if (aff || orch) {
                let dispText = useFmt ? `${fObj.fNo}` : `${orch}`;
                formTag = `<span class="t-tr-form" style="display:inline-block; width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">[${fObj.dispAff}] ${dispText}</span>`;
            }
        }
        
        let remarksTag = "";
        if (t.remarks && t.remarks.trim() !== "") {
            remarksTag = `<div style="font-size:11px; color:#555; background:#fff9c4; padding:2px 6px; border-radius:4px; margin-top:4px; border:1px solid #fff59d; display:inline-block; max-width:100%; white-space:normal; word-break:break-all;">✎ ${t.remarks}</div>`;
        }

        let hHtml = `<div class="t-hist">`;
        t.history.forEach((h, i) => {
          if(!h || !h.st) return;
          const lColor = ST_COLOR_MAP[h.st] || `var(--${g.id.replace('extra_tymg','extra').replace('extra_dtom','extra')})`;
          const isEkikan = h.st.includes("駅間");
          const style = !isEkikan ? `border-color:${lColor};` : ``;
          const cls = `hist-item ${isEkikan ? 'is-ekikan' : ''}`;
          
          hHtml += `<span class="${cls}" style="${style}"><strong>${h.t}${h.delay>0?'<sup class="tentative-mark">*</sup>':''}</strong> ${h.st}</span>`;
          if(i < t.history.length-1) hHtml += `<span style="color:#aaa; font-size:10px;">▶</span>`;
        });
        hHtml += `</div>`;

        const dispTrainNo = t.trainNo ? `${t.trainNo.substring(0,3)}-${t.trainNo.substring(3)}` : "不明";
        let badgeText = dKind;
        if (dKind === "F") badgeText = "Fラ"; else if (dKind === "B") badgeText = "B各停"; else if (dKind === "G") badgeText = "G各停"; else if (dKind === "Sトレイン") badgeText = "S";
        
        // ★修正: 毎日記録のときは非定期運用の日付タグを表示しない
        let dateTag = (g.id.startsWith('extra') && t.date && currentView !== 'daily') ? `<span class="t-tr-sub" style="font-weight:normal;">(${t.date})</span>` : "";

        const isTodayDaily = (currentView === 'daily' && document.getElementById("dailyDateSelect") && document.getElementById("dailyDateSelect").value === getDailyKey(new Date()));
        
        let posText = `<strong>${last.t}</strong> ${last.st}`;
        if (isTodayDaily && !isRunning) posText = ''; 

        let rowClass = isRunning ? 'row-active' : '';

        tHtml += `<div class="train-row ${rowClass}">
          <div class="t-basic">
            <div class="t-tr-block">
                <div class="t-tr">${dispTrainNo}</div>
                ${formTag}
                ${dateTag}
            </div>
            <div class="t-dest">
              <div class="t-dest-text"><span class="kind-badge kind-${dKind}">${badgeText}</span>${t.dest}${t.dest.endsWith('線')?'直通':'行'}</div>
              ${last.delay>0?`<span class="t-delay">${last.delay}分遅れ</span>`:''}
              ${remarksTag}
            </div>
          </div>
          <div class="t-pos">${posText}</div>
          ${hHtml}
        </div>`;
      });
      
      if(tHtml) groupHtml += `<div class="op-box">
        <div class="op-left">
          <div class="op-no">${u.label || "不明"}</div>
          ${g.id.startsWith('extra')?`<div class="src-tag">from ${Object.values(u.trains)[0]?.sourceName||'不明'}</div>`:''}
        </div>
        <div class="op-right">${tHtml}</div>
      </div>`;
    });
    if(hasContent) html += groupHtml + "</div></div>";
  });
  container.innerHTML = html || "<div style='padding:40px; text-align:center; color:#888; font-weight:bold;'>指定した条件に一致する列車はありません。</div>";
}

// =========================================
// API直接通信機能 (Viewer側ライブ取得)

async function fetchLiveApiData() {
  if (isFetchingApi) return;
  isFetchingApi = true;
  const now = new Date();
  const dKey = getDailyKey(now);
  
  if(!logs.daily) logs.daily = {};
  if(!logs.daily[dKey]) logs.daily[dKey] = {};
  if(!logs.weekday) logs.weekday = {};
  if(!logs.holiday) logs.holiday = {};
  
  let targetDateForCalc = new Date(now.getTime() - 4 * 60 * 60 * 1000);
  let autoInfo = getAutoDayType(targetDateForCalc);
  let dayType = autoInfo.type;
  
  let targetObjects = [ { obj: logs.daily[dKey], isDaily: true } ];
  if (dayType === 'weekday') targetObjects.push({ obj: logs.weekday, isDaily: false });
  if (dayType === 'holiday') targetObjects.push({ obj: logs.holiday, isDaily: false });

  try {
      for(let api of API_ENDPOINTS) {
          const controller = new AbortController(); const timeoutId = setTimeout(() => controller.abort(), 15000);
          const res = await fetch(`${api.url}?t=${Date.now()}`, { cache: 'no-store', signal: controller.signal });
          clearTimeout(timeoutId);
          if (!res.ok) continue;
          const data = await res.json();
          if (!data || !data.trains) continue;
          
          data.trains.forEach(t => {
              if (!t.train_number || t.train_number === "0") return;
              let rawOp = String(t.operation_number || "0"); let rawTr = String(t.train_number || "0");
              if (rawOp === "09999900" || rawTr === "09999900") return;
              let tNo = ""; let opNo = "";
              if (rawOp.length === 8 && rawOp !== "09999900") { tNo = rawOp.substring(1, 7); opNo = tNo.substring(0, 3); } 
              else if (rawTr.length === 8 && rawTr !== "09999900") { tNo = rawTr.substring(1, 7); opNo = rawOp.padStart(3, '0'); } 
              else { tNo = rawTr.padStart(6, '0'); opNo = rawOp.padStart(3, '0'); }
              if (tNo === "999000" || tNo === "999900") return;
              
              const stName = STATION_MAP[t.station_id] || (t.section_id ? `駅間(${t.section_id})` : "不明");
              if (api.id === 'meguro' && tNo === "999090" && stName.includes("大岡山")) return;

              const info = getUnyoInfoStr(opNo, api.id, dayType); if (!info) return;

              const opKey = `${info.homeLine}_${info.label}`;
              const destMapToUse = ['toyoko', 'meguro', 'shinyokohama'].includes(api.id) ? DEST_MAP_TYMG : DEST_MAP_DTOM;
              const destStr = cleanDestName(t.destination_station_code, destMapToUse);
              const dispKind = getDispKind(t.kind || "普", info.homeLine);
              const delay = parseInt(t.delay_time, 10) || 0;
              const actualTimeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
              const adjDate = new Date(now.getTime() - delay * 60000);
              const adjTimeStr = `${String(adjDate.getHours()).padStart(2, '0')}:${String(adjDate.getMinutes()).padStart(2, '0')}`;
              const affiliation = t.affiliation || ""; const orchestration = t.train_orchestration_number || "";

              targetObjects.forEach(cfgObj => {
                  let target = cfgObj.obj; if (!target) return;
                  
                  const timeStr = cfgObj.isDaily ? actualTimeStr : adjTimeStr;
                  
                  if (!target[opKey]) target[opKey] = { label: info.label, homeLine: info.homeLine, trains: {} };
                  
                  const sameNoKeys = Object.keys(target[opKey].trains).filter(k => target[opKey].trains[k] && target[opKey].trains[k].trainNo === tNo && !target[opKey].trains[k].deleted);
                  let targetTrainUid = null;

                  if (sameNoKeys.length > 0) {
                      for (let k of sameNoKeys) {
                          const tr = target[opKey].trains[k]; if (!tr || !tr.history) continue;
                          if (tr.dest !== destStr) continue;
                          if (cfgObj.isDaily && ['toyoko', 'meguro', 'shinyokohama', 'extra_tymg', 'extra_dtom'].includes(info.homeLine)) {
                              if (tr.affiliation && affiliation && tr.affiliation !== affiliation) continue;
                              if (tr.orchestration && orchestration && orchestration !== "00" && tr.orchestration !== orchestration) continue;
                          }
                          let isKindChanged = (tr.kind !== dispKind); let lastSt = tr.history.length > 0 && tr.history[tr.history.length - 1] ? tr.history[tr.history.length - 1].st : "";
                          if (isKindChanged && !["渋谷", "目黒", "新横浜", "新綱島"].some(s => lastSt.includes(s) || stName.includes(s))) continue; 
                          
                          const existingRec = tr.history.find(h => h && h.st === stName);
                          if (existingRec) { 
                              let exTv = getTv(existingRec.t);
                              let curTv = getTv(timeStr);
                              if (exTv !== -1 && curTv !== -1) {
                                  let diff = Math.abs(curTv - exTv);
                                  if (diff > 1440 - 12) diff = 1440 - diff;
                                  
                                  if (cfgObj.isDaily) {
                                      if (diff <= 60) { targetTrainUid = k; break; }
                                  } else {
                                      if (diff <= 2) { targetTrainUid = k; break; }
                                  }
                              } else {
                                  targetTrainUid = k; break;
                              }
                          }
                      }
                      
                      if (!targetTrainUid) {
                          let maxTime = -1; let latestKey = null;
                          sameNoKeys.forEach(k => {
                              const tr = target[opKey].trains[k]; if (!tr || !tr.history) return;
                              if (tr.dest !== destStr) return;
                              if (cfgObj.isDaily && ['toyoko', 'meguro', 'shinyokohama', 'extra_tymg', 'extra_dtom'].includes(info.homeLine)) {
                                  if (tr.affiliation && affiliation && tr.affiliation !== affiliation) return;
                                  if (tr.orchestration && orchestration && orchestration !== "00" && tr.orchestration !== orchestration) return;
                              }
                              let isKindChanged = (tr.kind !== dispKind); let lastSt = tr.history.length > 0 && tr.history[tr.history.length - 1] ? tr.history[tr.history.length - 1].st : "";
                              if (isKindChanged && !["渋谷", "目黒", "新横浜", "新綱島"].some(s => lastSt.includes(s) || stName.includes(s))) return; 
                              
                              const existingRec = tr.history.find(h => h && h.st === stName);
                              if (existingRec) return;
                              
                              const h = tr.history; if (h && h.length > 0) { const lastH = h[h.length - 1]; if (lastH && lastH.t) { let tv = getTv(lastH.t); if (tv > maxTime) { maxTime = tv; latestKey = k; } } }
                          });
                          
                          if (latestKey) { 
                              let curTv = getTv(timeStr);
                              if (curTv !== -1 && maxTime !== -1) {
                                  let diff = Math.abs(curTv - maxTime);
                                  if (diff > 1440 - 120) diff = 1440 - diff;
                                  if (diff <= 180) { targetTrainUid = latestKey; }
                              }
                          }
                      }
                  }
                  
                  if (!targetTrainUid) targetTrainUid = (info.homeLine.startsWith('extra')) ? `${tNo}_${dispKind}_${dKey}_${Date.now()}` : `${tNo}_${dispKind}_${Date.now()}`;

                  if (!target[opKey].trains[targetTrainUid]) {
                      target[opKey].trains[targetTrainUid] = { trainNo: tNo, kind: dispKind, dest: destStr, sourceName: {toyoko:"東横線", meguro:"目黒線", shinyokohama:"新横浜線", dento:"田園都市線", oimachi:"大井町線"}[api.id], date: dKey, history: [], lastSeen: Date.now(), remarks: "" };
                      if (cfgObj.isDaily && ['toyoko', 'meguro', 'shinyokohama', 'extra_tymg', 'extra_dtom'].includes(info.homeLine)) { target[opKey].trains[targetTrainUid].affiliation = affiliation; target[opKey].trains[targetTrainUid].orchestration = orchestration; }
                  } else { 
                      target[opKey].trains[targetTrainUid].dest = destStr; target[opKey].trains[targetTrainUid].sourceName = {toyoko:"東横線", meguro:"目黒線", shinyokohama:"新横浜線", dento:"田園都市線", oimachi:"大井町線"}[api.id]; target[opKey].trains[targetTrainUid].lastSeen = Date.now();
                      if (cfgObj.isDaily && ['toyoko', 'meguro', 'shinyokohama', 'extra_tymg', 'extra_dtom'].includes(info.homeLine)) { if (affiliation) target[opKey].trains[targetTrainUid].affiliation = affiliation; if (orchestration && orchestration !== "00") target[opKey].trains[targetTrainUid].orchestration = orchestration; }
                  }

                  const hist = target[opKey].trains[targetTrainUid].history; if (!hist) return;
                  
                  let existingIdx = hist.findIndex(h => h && h.st === stName);
                  
                  if (existingIdx !== -1) {
                      let ex = hist[existingIdx];
                      if (cfgObj.isDaily) {
                          ex.t = timeStr;
                          ex.delay = delay;
                      } else {
                          if (delay === 0) {
                              ex.t = timeStr;
                              ex.delay = 0;
                          }
                      }
                  } else {
                      if (hist.length === 0) {
                          const otherKeys = Object.keys(target[opKey].trains).filter(k => k !== targetTrainUid && !target[opKey].trains[k].deleted); let prevTrain = null; let pMaxTime = -1;
                          otherKeys.forEach(k => { const h = target[opKey].trains[k] ? target[opKey].trains[k].history : null; if (h && h.length > 0) { const lastH = h[h.length - 1]; if (lastH && lastH.t) { let tv = getTv(lastH.t); if (tv > pMaxTime) { pMaxTime = tv; prevTrain = target[opKey].trains[k]; } } } });
                          if (prevTrain && prevTrain.history && prevTrain.history.length > 0) {
                              const pHist = prevTrain.history; const pLast = pHist[pHist.length - 1];
                              if (pLast && pLast.st && pLast.st.includes("駅間")) {
                                  let currTv = adjDate.getHours() * 60 + adjDate.getMinutes(); if (adjDate.getHours() < 4) currTv += 24 * 60;
                                  let diffPrev = currTv - pMaxTime; if (diffPrev < 0) diffPrev += 24 * 60; if (diffPrev < 240) pHist.push({ t: timeStr, st: stName, delay: delay });
                              }
                          }
                      }
                      hist.push({ t: timeStr, st: stName, delay: delay });
                      hist.sort((a, b) => { return getTv(a.t) - getTv(b.t); });
                  }
              });
          });
      }
      
      lastApiTime = new Date().toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
      updateStatusDisplay();
      
      if (!currentView.startsWith("import")) {
          updateDestDropdown();
          updateFormDropdown();
          render();
      }
  } catch (err) {
      lastApiTime = "⚠ エラー (自動再試行中)";
      updateStatusDisplay();
  } finally {
      isFetchingApi = false;
  }
}

async function fetchFromCloud() {
  if (isSyncing) return;
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 15000);
    const res = await fetch(GAS_URL + "?t=" + Date.now(), { signal: controller.signal });
    clearTimeout(timeoutId);
    
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (isSyncing) return;
    
    if (data) {
      let selectedDaily = null;
      const dailySel = document.getElementById("dailyDateSelect");
      if(dailySel && currentView === 'daily') selectedDaily = dailySel.value;
      
      mergeData(logs, data);
      
      logs.customViews = data.customViews || [];
      if(data.appConfig) logs.appConfig = data.appConfig;
      
      sanitizeLogs(); 
      updateTabs();
      updateNotice();
      
      if (!currentView.startsWith("import")) {
        updateContextUI(selectedDaily); 
        updateDestDropdown(); 
        updateFormDropdown();
        render();
      }
      
      lastCloudTime = new Date().toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
      updateStatusDisplay();
    }
  } catch (err) {
    lastCloudTime = "⚠ エラー (自動再試行中)";
    updateStatusDisplay();
  }
}

function initCloudSync() {
  document.getElementById("cloudStatus").textContent = "☁️ 読込中... | 📡 読込中...";
  
  const cached = localStorage.getItem('tokyu_viewer_logs');
  if (cached) {
      try {
          const parsed = JSON.parse(cached);
          if (parsed.daily) {
              logs = parsed;
              updateTabs();
              updateContextUI();
              render();
          }
      } catch(e){}
  }
  
  fetchFromCloud();
  fetchLiveApiData();
  
  setInterval(fetchFromCloud, 10000); 
  setInterval(fetchLiveApiData, 10000); 
}

function exportData() {
  const data = getActiveData();
  if (!data || Object.keys(data).length === 0) return alert("保存するデータがありません。");
  let dKey = currentView;
  if(currentView === 'daily') dKey = document.getElementById("dailyDateSelect").value;
  if(currentView.startsWith('custom_')) dKey = logs.customViews[parseInt(currentView.split('_')[1])].title;
  
  const f = {};
  for (const ok in data) {
    if(!data[ok] || !data[ok].trains) continue;
    const opName = `${data[ok].homeLine} ${data[ok].label}`; f[opName] = [];
    for (const tUid in data[ok].trains) {
      const t = data[ok].trains[tUid];
      if(!t || t.deleted || !t.history) continue;
      f[opName].push({ 
        "列車番号": t.trainNo ? `${t.trainNo.substring(0,3)}-${t.trainNo.substring(3)}` : "", 
        "種別": t.kind, "行先": t.dest, "走行区間": t.sourceName, "初回記録日": t.date,
        "社局": t.affiliation || "",
        "編成": t.orchestration || "",
        "備考": t.remarks || "",
        "履歴": t.history.map(h => (h && h.t && h.st) ? `${h.t} ${h.st}${h.delay > 0 ? ' (遅れ補正)' : ''}` : null).filter(Boolean)
      });
    }
  }
  const a = document.createElement('a'); 
  a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ "生成日時": new Date().toLocaleString("ja-JP"), "記録日": dKey, "出力ダイヤ": f }, null, 2)); 
  a.download = `tokyu_data_${dKey.replace(/-/g, "")}_${Date.now()}.json`; a.click();
}

function importJSONData(file, targetTab) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const json = JSON.parse(e.target.result);
      let jpKeyToUse = Object.keys(json).find(k => k.includes("ダイヤ")) || Object.keys(json)[0];
      const result = {};
      if (json[jpKeyToUse]) {
        for (const opName in json[jpKeyToUse]) {
          let hl = "extra_tymg"; const firstPart = opName.split(" ")[0]; let label = opName.split(" ").slice(1).join(" ") || opName;
          if (firstPart.includes("東横")) hl = "toyoko"; else if (firstPart.includes("目黒")) hl = "meguro";
          else if (firstPart.includes("新横浜")) hl = "shinyokohama";
          else if (firstPart.includes("田園")) hl = "dento"; else if (firstPart.includes("大井町")) hl = "oimachi";
          
          label = label.replace(/定期運用|非定期運用・臨時等|非定期・臨時等|非定期/g, "").trim();

          const opKey = `${hl}_${label}`; result[opKey] = { label, homeLine: hl, trains: {} };
          json[jpKeyToUse][opName].forEach((t, i) => {
            let internalKind = t["種別"];
            if (internalKind === "Fライナー" || internalKind === "Fラ") internalKind = "F"; else if (internalKind === "B各停") internalKind = "B"; else if (internalKind === "G各停") internalKind = "G"; else if (internalKind === "S") internalKind = "Sトレイン";
            
            const dateStr = t["初回記録日"] ? t["初回記録日"].replace(/\//g, '-') : null;
            const trainNoStr = t["列車番号"] ? t["列車番号"].replace(/-/g, "") : "000000";
            const finalUid = dateStr ? `${trainNoStr}_${internalKind}_${dateStr}_${i}` : `${trainNoStr}_${internalKind}_${i}`;
            
            const histArray = t["履歴"] ? t["履歴"].map(hStr => { 
                const match = hStr.match(/^(\d{2}:\d{2})\s+(.*?)(?:\s+\(遅れ(?:(\d+)分)?補正\))?$/); 
                if (match) {
                    let dVal = 0;
                    if (hStr.includes("(遅れ")) dVal = match[3] ? parseInt(match[3], 10) : 1;
                    return { t: match[1], st: match[2].trim(), delay: dVal };
                }
                return null; 
            }).filter(Boolean) : [];
            
            result[opKey].trains[finalUid] = { 
                trainNo: trainNoStr, 
                kind: internalKind, 
                dest: t["行先"], 
                sourceName: t["走行区間"] || firstPart, 
                date: dateStr, 
                history: histArray,
                affiliation: t["社局"] || "",
                orchestration: t["編成"] || "",
                remarks: t["備考"] || "",
                lastSeen: Date.now()
            };
          });
        }
      }
      logs[targetTab] = result; changeTab(targetTab);
    } catch (err) { alert("読み込みに失敗しました。対応していないファイル形式です。"); }
  };
  reader.readAsText(file);
}

document.addEventListener("DOMContentLoaded", async () => {
  const params = location.search.substring(1);
  if (params && document.getElementById("opFilter")) {
      const opts = Array.from(document.getElementById("opFilter").options).map(o => o.value);
      if (opts.includes(params)) document.getElementById("opFilter").value = params;
  }
  
  await loadHolidays();
  changeTab('daily'); 
  initCloudSync(); 
  updateDestDropdown();
});
</script>
