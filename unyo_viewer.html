function openDBWithTimeout(dbName, version, timeoutMs) {
  return new Promise((resolve) => {
    let isDone = false;
    const timer = setTimeout(() => { if (!isDone) { isDone = true; resolve(null); } }, timeoutMs);
    try {
      const req = indexedDB.open(dbName, version);
      req.onupgradeneeded = e => { if (!e.target.result.objectStoreNames.contains(STORE_NAME)) e.target.result.createObjectStore(STORE_NAME); };
      req.onsuccess = e => { if (!isDone) { isDone = true; clearTimeout(timer); resolve(e.target.result); }};
      req.onerror = () => { if (!isDone) { isDone = true; clearTimeout(timer); resolve(null); }};
    } catch(e) { if (!isDone) { isDone = true; clearTimeout(timer); resolve(null); } }
  });
}
async function loadLogs() {
  const db_local = await openDBWithTimeout(DB_NAME, 1, 1500); 
  if(!db_local) return null;
  return new Promise(resolve => {
    try {
      const tx = db_local.transaction([STORE_NAME], 'readonly');
      tx.objectStore(STORE_NAME).get(RECORD_KEY).onsuccess = e => { resolve(e.target.result || null); };
    } catch(e) { resolve(null); }
  });
}
async function saveLogs() {
  const db_local = await openDBWithTimeout(DB_NAME, 1, 1500);
  if(!db_local) return;
  try { db_local.transaction([STORE_NAME], 'readwrite').objectStore(STORE_NAME).put(logs, RECORD_KEY); } catch(e) {}
}

const KIND_OPTIONS = [ { value: "all", label: "すべて表示" }, { value: "各停", label: "各停" }, { value: "B", label: "B各停" }, { value: "G", label: "G各停" }, { value: "準急", label: "準急" }, { value: "急行", label: "急行" }, { value: "通特", label: "通特" }, { value: "特急_all", label: "Fラ/特急" }, { value: "特急", label: "特急" }, { value: "F", label: "Fラ" }, { value: "Sトレイン", label: "S" }, { value: "回送", label: "回送" } ];
const SECTION_KIND_MAP = { "all": ["all", "各停", "B", "G", "準急", "急行", "通特", "特急_all", "特急", "F", "Sトレイン", "回送"], "東横線": ["all", "各停", "急行", "通特", "特急_all", "特急", "F", "Sトレイン", "回送"], "目黒線": ["all", "各停", "急行", "回送"], "田園都市線": ["all", "各停", "準急", "急行", "回送"], "大井町線": ["all", "各停", "B", "G", "急行", "回送"], "新横浜線": ["all", "各停", "急行", "特急_all", "特急", "F", "回送"] };
const MASTER_LINE_ORDERS = { "東横線": ["副都心線", "渋谷", "中目黒", "自由が丘", "武蔵小杉", "元住吉", "日吉", "菊名", "横浜", "元町・中華街", "新横浜", "相鉄線"], "目黒線": ["三田線", "南北線", "目黒", "武蔵小山", "大岡山", "奥沢", "武蔵小杉", "元住吉", "日吉", "新横浜", "相鉄線"], "新横浜線": ["副都心線", "三田線", "南北線", "渋谷", "目黒", "日吉", "新横浜", "相鉄線"], "田園都市線": ["半蔵門線", "渋谷", "二子玉川", "溝の口", "梶が谷", "鷺沼", "あざみ野", "長津田", "中央林間", "大井町", "大岡山", "恩田", "こどもの国"], "大井町線": ["大井町", "大岡山", "自由が丘", "二子玉川", "溝の口", "鷺沼", "長津田", "恩田", "中央林間"] };
const ST_COLOR_MAP = { "代官山":"var(--toyoko)","中目黒":"var(--toyoko)","祐天寺":"var(--toyoko)","学芸大学":"var(--toyoko)","都立大学":"var(--toyoko)","綱島":"var(--toyoko)","大倉山":"var(--toyoko)","菊名":"var(--toyoko)","妙蓮寺":"var(--toyoko)","白楽":"var(--toyoko)","東白楽":"var(--toyoko)","反町":"var(--toyoko)","横浜":"var(--toyoko)","目黒":"var(--meguro)","不動前":"var(--meguro)","武蔵小山":"var(--meguro)","西小山":"var(--meguro)","洗足":"var(--meguro)","奥沢":"var(--meguro)","池尻大橋":"var(--dento)","三軒茶屋":"var(--dento)","駒沢大学":"var(--dento)","桜新町":"var(--dento)","用賀":"var(--dento)","梶が谷":"var(--dento)","宮崎台":"var(--dento)","宮前平":"var(--dento)","鷺沼":"var(--dento)","たまプラーザ":"var(--dento)","あざみ野":"var(--dento)","江田":"var(--dento)","市が尾":"var(--dento)","藤が丘":"var(--dento)","青葉台":"var(--dento)","田奈":"var(--dento)","長津田":"var(--dento)","つくし野":"var(--dento)","すずかけ台":"var(--dento)","南町田":"var(--dento)","つきみ野":"var(--dento)","中央林間":"var(--dento)","恩田":"var(--dento)","こどもの国":"var(--dento)","大井町":"var(--oimachi)","下神明":"var(--oimachi)","戸越公園":"var(--oimachi)","中延":"var(--oimachi)","荏原町":"var(--oimachi)","旗の台":"var(--oimachi)","北千束":"var(--oimachi)","緑が丘":"var(--oimachi)","九品仏":"var(--oimachi)","尾山台":"var(--oimachi)","等々力":"var(--oimachi)","上野毛":"var(--oimachi)","新綱島":"var(--shinyoko)","新横浜":"var(--shinyoko)" };

function getDailyKey(d = new Date()) { const dt = new Date(d.getTime() - 4 * 60 * 60 * 1000); return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`; }

function updateFilters() {
  const section = document.getElementById("sectionFilter").value;
  const kindSelect = document.getElementById("kindFilter");
  const destSelect = document.getElementById("destFilter");
  const currentKind = kindSelect.value || "all";
  const currentDest = destSelect.value || "all";

  kindSelect.innerHTML = '<option value="all">すべて表示</option>';
  KIND_OPTIONS.forEach(opt => { if (opt.value !== "all" && (section === "all" || SECTION_KIND_MAP[section].includes(opt.value))) kindSelect.appendChild(new Option(opt.label, opt.value)); });
  kindSelect.value = (section === "all" || SECTION_KIND_MAP[section].includes(currentKind)) ? currentKind : "all";

  const data = getActiveData(); const presentDests = new Set();
  if (section === "all") Object.values(MASTER_LINE_ORDERS).forEach(list => list.forEach(d => presentDests.add(d)));
  else if (MASTER_LINE_ORDERS[section]) MASTER_LINE_ORDERS[section].forEach(d => presentDests.add(d));

  if (data) {
    for (const opKey in data) { for (const tUid in data[opKey].trains) {
        const t = data[opKey].trains[tUid];
        if (section === "all" || t.sourceName === section) if (t.dest && t.dest !== "終点" && t.dest !== "不明") presentDests.add(t.dest);
    }}
  }
  let sortedDests = []; let seen = new Set();
  if (section !== "all" && MASTER_LINE_ORDERS[section]) MASTER_LINE_ORDERS[section].forEach(d => { if (presentDests.has(d)) { sortedDests.push(d); seen.add(d); } });
  Object.keys(MASTER_LINE_ORDERS).forEach(lk => { if (lk === section) return; MASTER_LINE_ORDERS[lk].forEach(d => { if (presentDests.has(d) && !seen.has(d)) { sortedDests.push(d); seen.add(d); } }); });
  Array.from(presentDests).sort().forEach(d => { if (!seen.has(d)) sortedDests.push(d); });

  destSelect.innerHTML = '<option value="all">すべての行先</option>';
  sortedDests.forEach(d => destSelect.appendChild(new Option(d.endsWith("線") ? d + "直通" : d + "行", d)));
  destSelect.value = seen.has(currentDest) || currentDest === "all" ? currentDest : "all";
}

function getActiveData() {
  if (currentView === 'weekday' || currentView === 'holiday') return logs[currentView];
  if (currentView === 'daily') { const sel = document.getElementById('dailyDateSelect'); return sel ? logs.daily[sel.value] : null; }
  if (currentView.startsWith('import')) { return logs[currentView]; }
  if (currentView.startsWith('custom_')) {
    let idx = parseInt(currentView.split('_')[1]);
    let cv = logs.customViews[idx];
    if (!cv) return null;
    if (cv.type === 'upload' && cv.uploadData) return cv.uploadData;
    let baseData = logs.daily[cv.date];
    if (!baseData) return null;
    let filtered = {};
    for (let opKey in baseData) {
      if (cv.groups.includes(baseData[opKey].homeLine)) {
        filtered[opKey] = baseData[opKey];
      }
    }
    return filtered;
  }
  return null;
}

// ★ 引数(preservedDailyDate)を受け取って選択を復元する
function updateContextUI(preservedDailyDate = null) {
  const ctx = document.getElementById("contextFilters");
  if (!ctx) return;
  ctx.innerHTML = "";

  if (currentView === "daily") {
    const label = document.createElement("span"); label.className = "filter-label"; label.textContent = "表示日:"; ctx.appendChild(label);
    const select = document.createElement("select"); select.id = "dailyDateSelect"; select.className = "filter-select"; select.onchange = () => { updateFilters(); render(); };
    const keys = Object.keys(logs.daily || {}).sort().reverse();
    if (keys.length === 0) select.appendChild(new Option("記録なし", getDailyKey()));
    else keys.forEach(k => select.appendChild(new Option(k, k)));
    ctx.appendChild(select);
    
    // ★ 退避した日付が存在すればそれを選択し直す
    if (preservedDailyDate && Array.from(select.options).some(o => o.value === preservedDailyDate)) {
       select.value = preservedDailyDate;
    }

  } else if (currentView.startsWith("import")) {
    if (logs[currentView]) {
      const clearBtn = document.createElement("button");
      clearBtn.className = "btn-reset"; clearBtn.style.marginLeft = "10px"; clearBtn.style.padding = "5px 10px";
      clearBtn.textContent = "✖ 読込を破棄";
      clearBtn.onclick = async () => {
        if(confirm(`読み込んだデータを破棄してよろしいですか？`)) {
            logs[currentView] = null; await saveLogs(); changeTab('daily');
        }
      };
      ctx.appendChild(clearBtn);
    }
  } else if (currentView.startsWith("custom_")) {
     const label = document.createElement("span"); label.className = "filter-label"; 
     let idx = parseInt(currentView.split('_')[1]);
     let cv = logs.customViews[idx];
     if(cv) label.textContent = (cv.type === 'upload') ? "（マスターからの配信データ）" : "対象記録日: " + (cv.date || "不明");
     ctx.appendChild(label);
  }
}

function updateTabs() {
  document.querySelectorAll('.tab-custom').forEach(el => el.remove());
  const tabArea = document.getElementById('tabArea');
  if (logs.customViews) {
    logs.customViews.forEach((cv, i) => {
      if (cv.active && cv.title) {
        let btn = document.createElement('button');
        btn.id = `tabC${i}`;
        btn.className = `tab tab-custom`;
        if (currentView === `custom_${i}`) btn.classList.add('active');
        btn.onclick = () => changeTab(`custom_${i}`);
        btn.textContent = cv.title;
        tabArea.appendChild(btn);
      }
    });
  }
}

function changeTab(tabId) { 
  currentView = tabId; 
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  const target = document.getElementById(tabId === 'weekday' ? 'tabW' : tabId === 'holiday' ? 'tabH' : tabId === 'daily' ? 'tabD' : tabId === 'import1' ? 'tabI1' : tabId === 'import2' ? 'tabI2' : tabId === 'import3' ? 'tabI3' : tabId.startsWith('custom') ? `tabC${tabId.split('_')[1]}` : null);
  if(target) target.classList.add('active');
  lastActiveKeys.clear(); 
  updateContextUI(); updateFilters(); render(); 
}

function formatExportData(dayLogs) {
  if (!dayLogs) return {};
  const f = {};
  const gName = { toyoko: "東横線", meguro: "目黒線", dento: "田園都市線", oimachi: "大井町線", extra_tymg: "東横・目黒系統 非定期・臨時等", extra_dtom: "田都・大井町系統 非定期・臨時等" };
  for (const ok in dayLogs) {
    const op = dayLogs[ok]; 
    const prefix = gName[op.homeLine] || op.homeLine;
    const opName = `${prefix} ${op.label}`; 
    f[opName] = [];
    for (const tUid in op.trains) {
      const t = op.trains[tUid];
      f[opName].push({ 
        "列車番号": `${t.trainNo.substring(0,3)}-${t.trainNo.substring(3)}`, 
        "種別": t.kind, "行先": t.dest, "走行区間": t.sourceName, "初回記録日": t.date,
        "履歴": t.history.map(h => `${h.t} ${h.st}${h.delay > 0 ? ' (遅れ補正)' : ''}`) 
      });
    }
  } 
  return f;
}

function exportData() {
  const data = getActiveData();
  if (!data || Object.keys(data).length === 0) return alert("保存するデータがありません。");
  
  let dKey = currentView;
  if(currentView === 'daily') dKey = document.getElementById("dailyDateSelect").value;
  if(currentView.startsWith('custom_')) dKey = logs.customViews[parseInt(currentView.split('_')[1])].title;
  
  const exportObj = { "生成日時": new Date().toLocaleString("ja-JP"), "記録日": dKey, "出力ダイヤ": formatExportData(data) };
  const a = document.createElement('a'); 
  a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportObj, null, 2)); 
  a.download = `tokyu_data_${dKey.replace(/-/g, "")}_${Date.now()}.json`; 
  a.click();
}

function importJSONData(file, targetTab) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const json = JSON.parse(e.target.result);
      let jpKeyToUse = Object.keys(json).find(k => k.includes("ダイヤ")) || Object.keys(json)[0];
      
      const processKey = (jpKey) => {
        const result = {};
        if (!json[jpKey]) return result;
        for (const opName in json[jpKey]) {
          let hl = "extra_tymg"; 
          const firstPart = opName.split(" ")[0]; 
          let label = opName.split(" ").slice(1).join(" ") || opName;

          if (firstPart === "toyoko" || firstPart === "東横線") hl = "toyoko";
          else if (firstPart === "meguro" || firstPart === "目黒線") hl = "meguro";
          else if (firstPart === "dento" || firstPart === "田園都市線") hl = "dento";
          else if (firstPart === "oimachi" || firstPart === "大井町線") hl = "oimachi";
          else if (firstPart === "shinyokohama" || firstPart === "新横浜線") hl = "shinyokohama";
          else if (firstPart === "extra_tymg" || opName.startsWith("東横・目黒系統")) { hl = "extra_tymg"; label = opName.replace("東横・目黒系統 非定期・臨時等 ", ""); }
          else if (firstPart === "extra_dtom" || opName.startsWith("田都・大井町系統")) { hl = "extra_dtom"; label = opName.replace("田都・大井町系統 非定期・臨時等 ", ""); }
          else if (firstPart === "extra" || opName.startsWith("非定期")) { hl = "extra_tymg"; label = opName.replace("非定期運用・臨時等 ", ""); }

          const opKey = `${hl}_${label}`;
          result[opKey] = { label, homeLine: hl, trains: {} };

          json[jpKey][opName].forEach((t, i) => {
            const rawNo = t["列車番号"].replace(/-/g, ""); const kind = t["種別"]; const dest = t["行先"]; const sourceName = t["走行区間"] || (hl.startsWith("extra") ? "不明" : opName.split(" ")[0]);
            let internalKind = kind;
            if (kind === "Fライナー" || kind === "Fラ") internalKind = "F";
            if (kind === "B各停") internalKind = "B";
            if (kind === "G各停") internalKind = "G";
            if (kind === "S") internalKind = "Sトレイン";

            const date = t["初回記録日"] || null;
            const finalUid = date ? `${rawNo}_${internalKind}_${date}_${i}` : `${rawNo}_${internalKind}_${i}`;

            const history = t["履歴"].map(hStr => {
              const match = hStr.match(/^(\d{2}:\d{2})\s+(.*?)(?:\s+\(遅れ補正\))?$/);
              if (match) return { t: match[1], st: match[2], delay: hStr.includes("(遅れ補正)") ? 1 : 0 };
              return null;
            }).filter(Boolean);

            result[opKey].trains[finalUid] = { trainNo: rawNo, kind: internalKind, dest, sourceName, date, history };
          });
        }
        return result;
      };

      logs[targetTab] = processKey(jpKeyToUse || "出力ダイヤ"); 
      await saveLogs(); changeTab(targetTab);
    } catch (err) { alert("読み込みに失敗しました。"); }
  };
  reader.readAsText(file);
}

function render() {
  const container = document.getElementById("container");
  
  if (currentView.startsWith("import") && (!logs[currentView] || Object.keys(logs[currentView]).length === 0)) {
    container.innerHTML = `
      <div class="import-container">
        <p>過去に保存したJSONファイルを読み込んで表示します。</p>
        <input type="file" id="jsonUpload_${currentView}" accept=".json" style="margin-bottom: 10px;">
        <br>
        <button class="btn-export" onclick="importJSONData(document.getElementById('jsonUpload_${currentView}').files[0], '${currentView}')">ファイルを読み込む</button>
      </div>`;
    return;
  }

  const data = getActiveData();
  if (!data || Object.keys(data).length === 0) { container.innerHTML = "<div style='padding:20px;text-align:center;'>データがありません</div>"; return; }

  const secF = document.getElementById("sectionFilter").value;
  const opF = document.getElementById("opFilter").value;
  const kindF = document.getElementById("kindFilter").value;
  const destF = document.getElementById("destFilter").value;

  let html = "";
  const groups = [
    { id: 'toyoko', name: '東横線', cl: 'bg-toyoko' }, { id: 'meguro', name: '目黒線', cl: 'bg-meguro' },
    { id: 'dento', name: '田園都市線', cl: 'bg-dento' }, { id: 'oimachi', name: '大井町線', cl: 'bg-oimachi' },
    { id: 'extra_tymg', name: '東横・目黒系統 非定期・臨時等', cl: 'bg-extra' }, { id: 'extra_dtom', name: '田都・大井町系統 非定期・臨時等', cl: 'bg-extra' }
  ];

  groups.forEach(g => {
    if (opF !== "all" && opF !== g.id) return;
    const opKeys = Object.keys(data).filter(k => data[k].homeLine === g.id).sort((a, b) => {
      const getRank = s => { if(s.includes('K')) return 1; if(s.includes('S')) return 2; if(s.includes('T')) return 3; return 4; };
      return getRank(a) - getRank(b) || a.localeCompare(b);
    });
    if(opKeys.length === 0) return;

    let groupHtml = `<div class="line-section"><div class="line-header ${g.cl}">${g.name}</div><div class="line-body">`;
    let hasContent = false;

    opKeys.forEach(ok => {
      const u = data[ok]; let tHtml = "";
      Object.keys(u.trains).sort((a,b) => {
        const hA = u.trains[a].history, hB = u.trains[b].history;
        const adj = t => { let [h, m] = t.split(':').map(Number); if (h < 4) h += 24; return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`; };
        const tA = hA && hA.length>0 ? adj(hA[0].t) : "99:99", tB = hB && hB.length>0 ? adj(hB[0].t) : "99:99";
        return tA.localeCompare(tB);
      }).forEach(tUid => {
        const t = u.trains[tUid]; if(!t.history || t.history.length===0) return;
        if(secF !== "all" && t.sourceName !== secF) return;
        let dKind = t.kind === "通勤特急" ? "通特" : t.kind;
        if(kindF !== "all" && dKind !== kindF && !(kindF==='特急_all' && (dKind==='特急'||dKind==='F'))) return;
        if(destF !== "all" && t.dest !== destF) return;

        hasContent = true; 
        const last = t.history[t.history.length-1];
        const isTodayDaily = (currentView === 'daily' && document.getElementById("dailyDateSelect") && document.getElementById("dailyDateSelect").value === getDailyKey(new Date()));
        const isActive = (currentView === 'weekday' || currentView === 'holiday' || isTodayDaily) && lastActiveKeys.has(`${ok}_${tUid}`);

        let hHtml = `<div class="hist-scroll">`;
        t.history.forEach((h, i) => {
          const lColor = ST_COLOR_MAP[h.st] || `var(--${g.id.replace('extra_tymg','extra').replace('extra_dtom','extra')})`;
          const isEkikan = h.st.includes("駅間");
          const style = !isEkikan ? `border-bottom:3px solid ${lColor};` : ``;
          const cls = `hist-item ${isEkikan ? 'is-ekikan' : 'current-stop'}`;
          
          hHtml += `<span class="${cls}" style="${style}"><strong>${h.t}${h.delay>0?'<sup class="tentative-mark">*</sup>':''}</strong> ${h.st}</span>`;
          if(i < t.history.length-1) hHtml += `<span class="hist-arrow">▶</span>`;
        });
        hHtml += `</div>`;

        const dispTrainNo = `${t.trainNo.substring(0,3)}-${t.trainNo.substring(3)}`;
        let badgeText = dKind;
        if (dKind === "F") badgeText = "Fラ"; else if (dKind === "B") badgeText = "B各停"; else if (dKind === "G") badgeText = "G各停"; else if (dKind === "Sトレイン") badgeText = "S";
        let dateTag = ""; if (g.id.startsWith('extra') && t.date) dateTag = `<br><span style="font-size:10px; color:#666;">(${t.date})</span>`;

        tHtml += `<div class="train-row ${isActive?'row-active':''}">
          <div class="t-basic">
            <div class="t-col t-tr" style="line-height:1.2;">${dispTrainNo}${dateTag}</div>
            <div class="t-col t-dest-container">
              <div class="dest-row"><span class="kind-badge kind-${dKind}">${badgeText}</span> ${t.dest}${t.dest.endsWith('線')?'直通':'行'}</div>
              ${last.delay>0?`<div class="delay-row"><span class="delay">${last.delay}分遅れ</span></div>`:''}
            </div>
            <div class="t-col t-pos">${isActive && !last.st.includes("駅間") ? `<strong>${last.t}</strong> ${last.st}` : ''}</div>
          </div>
          <div class="t-col t-hist">${hHtml}</div>
        </div>`;
      });
      if(tHtml) groupHtml += `<div class="op-box"><div class="op-left"><div class="op-no">${u.label}</div>${g.id.startsWith('extra')?`<div class="src-tag">from<br>${Object.values(u.trains)[0]?.sourceName||'不明'}</div>`:''}</div><div class="op-right">${tHtml}</div></div>`;
    });
    if(hasContent) html += groupHtml + "</div></div>";
  });
  container.innerHTML = html || "<div style='padding:30px; text-align:center;'>指定した条件に一致する列車はありません。</div>";
}

function initFirebaseListener() {
  if(!db) return;
  document.getElementById("cloudStatus").textContent = "☁️ 接続中...";
  
  db.ref('logs').on('value', async (snapshot) => {
    const data = snapshot.val();
    if (data) {
      // ★ 画面更新前に現在選択されている日付を退避
      let selectedDaily = null;
      const dailySel = document.getElementById("dailyDateSelect");
      if(dailySel && currentView === 'daily') {
          selectedDaily = dailySel.value;
      }
      
      logs = data;
      if(!logs.weekday) logs.weekday = {};
      if(!logs.holiday) logs.holiday = {};
      if(!logs.daily) logs.daily = {};
      if(!logs.customViews) logs.customViews = [];
      
      await saveLogs(); 
      updateTabs();
      
      if (!currentView.startsWith("import")) {
        // ★ 退避した日付を渡して状態を復元
        updateContextUI(selectedDaily); 
        updateFilters(); 
        render();
      }
      document.getElementById("cloudStatus").textContent = `☁️ リアルタイム同期中 (${new Date().toLocaleTimeString()})`;
    }
  }, (error) => {
    document.getElementById("cloudStatus").textContent = "☁️ 接続エラー";
  });
}

document.addEventListener("DOMContentLoaded", async () => {
  document.getElementById("sectionFilter").value = "all";
  document.getElementById("opFilter").value = "all";
  
  const saved = await loadLogs(); if (saved) logs = saved; 
  
  // ★ 古いスラッシュ付きデータ（yyyy/mm/dd）をブラウザから一掃
  let didPurge = false;
  if (logs.daily) {
    for (let k in logs.daily) {
      if (k.includes('/')) { delete logs.daily[k]; didPurge = true; }
    }
  }
  ['weekday', 'holiday'].forEach(dy => {
    if(logs[dy]) {
       for(let op in logs[dy]) {
          let trs = logs[dy][op].trains;
          for(let uid in trs) {
             if(uid.includes('/') || (trs[uid].date && trs[uid].date.includes('/'))) {
                delete trs[uid]; didPurge = true;
             }
          }
       }
    }
  });
  if (didPurge) await saveLogs();
  
  changeTab(new Date().getDay() % 6 === 0 ? 'holiday' : 'weekday');
  initFirebaseListener(); 
});
</script>
